    <script>
      /* Google 번역 상태(googtrans 쿠키)를 위젯·앱이 초기화되기도 전에 세팅 —
         첫 로드(예: 브라우저 언어로 자동 감지된 EN/JA/ZH)부터 바로 번역 적용.
         위젯 구성은 src/i18n/google.ts 참고. */
      (function () {
        var t = "";
        try { t = localStorage.getItem("xconda-lang") || ""; } catch (e) {}
        if (t !== "en" && t !== "ja" && t !== "zh-CN") {
          var n = (navigator.language || "").toLowerCase();
          t = n.indexOf("en") === 0 ? "en" : n.indexOf("ja") === 0 ? "ja" : n.indexOf("zh") === 0 ? "zh-CN" : "";
        }
        if (t === "ko") {
          document.cookie = "googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
        } else if (t) {
          var d = new Date();
          d.setTime(d.getTime() + 31536000000);
          document.cookie = "googtrans=/ko/" + t + "; path=/; expires=" + d.toUTCString();
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google 번역 위젯 — UI는 숨김, 언어 전환은 내비 KO/EN/JA/ZH 버튼이 담당 (src/i18n/google.ts)
         쿠키(googtrans)로 구동: ko=원문, en/ja/zh-CN=해당 언어로 페이지 번역. -->
    <div id="google_translate_element" style="display:none"></div>
    <script>
      window.googleTranslateElementInit = function () {
        // EN 모드: 정제된 영문 크롬 + 한국어 노션 콘텐츠가 섞여 있으므로
        // pageLanguage 를 지정하지 않고 노드별 자동 감지를 씀 (영문은 그대로, 한문만 번역).
        // JA/ZH 모드: 페이지가 전부 한국어 원문이므로 소스 언어를 ko 로 고정.
        var m = document.cookie.match(/(?:^|;\s*)googtrans=([^;]*)/);
        var t = m ? decodeURIComponent(m[1]).replace(/^\//, "").split("/")[1] : "";
        var opts = { includedLanguages: "en,ja,zh-CN", autoDisplay: false };
        if (t !== "en") opts.pageLanguage = "ko";
        new google.translate.TranslateElement(opts, "google_translate_element");
      };
    </script>
    <script async src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
