# XCONDA허브 · Q&A 도우미 무료 LLM 프록시 설정
#
# 배포 방법 (상세 안내: qna-bot-worker/README.md)
#   cd qna-bot-worker
#   npx wrangler login                       # 처음 한 번, Cloudflare 계정 로그인
#   npx wrangler deploy                      # Workers AI 만 쓰면 키 등록 없이 이것만
#   (선택) npx wrangler secret put GEMINI_API_KEY / GROQ_API_KEY  # 백업 공급자
#
# ※ API 키는 절대 이 파일(저장소)에 직접 적지 마세요. 반드시 `wrangler secret put` 으로 등록합니다.

name = "xconda-qna-bot"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Cloudflare Workers AI — 외부 API 키 없이 계정의 무료 한도(하루 10,000 Neurons, UTC 0시 = 한국 오전 9시 초기화)를 씁니다.
# 2026-11-27 기본 공급자로 켬. 한도를 다 쓰면 Worker 가 503 을 돌려주고, 허브 챗봇은 검색 답변만 보여 줍니다.
# ⚠️ Workers 유료 플랜 계정이면 무료 한도를 넘은 사용량이 과금됩니다 (1,000 Neurons 당 약 $0.011).
[ai]
binding = "AI"

[vars]
# 브라우저 호출을 허용할 출처 (쉼표 구분)
ALLOW_ORIGINS = "https://hub.xconda.ai,https://www.xconda.ai,http://localhost:5173,http://127.0.0.1:5173"

# 호출 우선순위 — 앞 공급자가 한도 초과(429)·오류일 때 다음 공급자로 자동 전환
# Workers AI 를 먼저 씁니다. Gemini·Groq 는 키를 `wrangler secret put` 으로 등록했을 때만 뒤에서 백업으로 쓰입니다.
PROVIDER_ORDER = "workers-ai,gemini,groq"

# 공급자별 기본 무료 모델 (필요할 때만 변경)
GEMINI_MODEL = "gemini-2.5-flash"
GROQ_MODEL = "openai/gpt-oss-120b"
CF_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# IP 당 분당 최대 질문 수 (무료 일일 한도 보호용)
RATE_LIMIT_RPM = "20"
