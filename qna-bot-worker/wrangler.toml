# XCONDA허브 · Q&A 도우미 무료 LLM 프록시 설정
#
# 배포 방법 (상세 안내: qna-bot-worker/README.md)
#   cd qna-bot-worker
#   npx wrangler secret put GEMINI_API_KEY   # (선택 1) Google AI Studio 무료 키
#   npx wrangler secret put GROQ_API_KEY     # (선택 2) Groq 무료 키
#   npx wrangler deploy
#
# ※ API 키는 절대 이 파일(저장소)에 직접 적지 마세요. 반드시 `wrangler secret put` 으로 등록합니다.

name = "xconda-qna-bot"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# (선택 3) 외부 API 키 없이 Cloudflare Workers AI 무료 티어(일 10,000 Neurons)를 함께 쓰려면 아래 주석을 해제하세요.
# [ai]
# binding = "AI"

[vars]
# 브라우저 호출을 허용할 출처 (쉼표 구분)
ALLOW_ORIGINS = "https://hub.xconda.ai,https://www.xconda.ai,http://localhost:5173,http://127.0.0.1:5173"

# 호출 우선순위 — 앞 공급자가 한도 초과(429)·오류일 때 다음 공급자로 자동 전환
PROVIDER_ORDER = "gemini,groq,workers-ai"

# 공급자별 기본 무료 모델 (필요할 때만 변경)
GEMINI_MODEL = "gemini-2.5-flash"
GROQ_MODEL = "openai/gpt-oss-120b"
CF_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# IP 당 분당 최대 질문 수 (무료 일일 한도 보호용)
RATE_LIMIT_RPM = "20"
