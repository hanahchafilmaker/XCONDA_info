name: 사이트 빌드 (index.html 갱신)

# 배포되는 `index.html` 은 저장소에 커밋된 **빌드 결과물**입니다(GitHub Pages 가 그대로 서빙).
# 그래서 `src/` 를 고치고 빌드를 잊으면 사이트에는 옛 화면이 남습니다
# → main 에 소스 변경이 들어오면 자동으로 다시 빌드해서 커밋합니다.
#
# 글별 정적 페이지(/post/{slug}/ 등 · sitemap.xml · robots.txt)도 같은 빌드에서 만듭니다
# (scripts/build-seo.mjs — npm run build 의 postbuild). 글 내용은 notion-content.json 에서 오며,
# 그 파일은 notion-sync 워크플로가 갱신합니다.
#
# (내용이 같으면 커밋하지 않으므로 빈 커밋·Pages 재배포가 쌓이지 않습니다)
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "dev.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/build-seo.mjs"
  workflow_dispatch:

concurrency:
  group: site-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 분류 · 동기화 규칙 테스트
        run: npm run test:unit

      - name: 빌드 (dist/dev.html → index.html + 글별 페이지 · sitemap · robots)
        # 이 단계의 SEO 산출물은 체크아웃 시점의 스냅샷 기준입니다. 아래 게시 단계가
        # origin 의 최신 notion-content.json 으로 다시 만들어 덮어씁니다.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: 빌드 결과물 게시 (최신 origin 기준으로 재생성)
        id: publish
        # 빌드 중에 notion-sync 가 main 에 새 스냅샷·페이지를 올렸을 수 있습니다.
        # 체크아웃 상태에 그대로 덮어쓰면 그 내용이 옛 글 목록으로 되돌아가므로,
        # 항상 origin 최신 상태에서 다시 시작해 (1) 새 번들 (2) 최신 스냅샷으로 페이지를 만들고 커밋합니다.
        # 다른 푸시와 경주해 거절되면 같은 순서로 최대 3번 다시 시도합니다.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BRANCH: main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dist/dev.html /tmp/bundle.html
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp /tmp/bundle.html index.html
            node scripts/build-seo.mjs
            # 공용 번들(assets/app.js · app.css)도 커밋 대상입니다.
            # (예전에는 페이지마다 인라인이라 100페이지 × 약 490KB 가 중복 저장됐습니다)
            git add -A -- index.html sitemap.xml robots.txt llms.txt assets
            for d in post notice qna guide; do git add -A -- "$d" 2>/dev/null || true; done
            if git diff --cached --quiet; then
              echo "index.html · 글별 페이지 변경 없음 — 커밋 생략"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "build: 소스 변경 반영 (index.html · 글별 페이지 갱신) [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "게시 완료"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "푸시 경합 — 최신 상태에서 다시 시도 ($attempt/3)"
            sleep 5
          done
          echo "::error::3번 시도했지만 게시하지 못했습니다"
          exit 1

      - name: IndexNow에 사이트맵 주소 알림
        # 자동 실행은 실제 게시물이 바뀐 경우만. workflow_dispatch 는 실패한 알림의 수동 재시도도 겸합니다.
        if: (steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/indexnow.mjs
