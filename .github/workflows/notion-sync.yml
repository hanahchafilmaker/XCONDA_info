name: Notion 동기화

# 게시된 Notion 페이지를 서버에서 읽어 `notion-content.json` 으로 커밋합니다.
# 사이트(index.html)는 같은 도메인의 이 파일을 읽으므로 CORS·외부 프록시 장애와 무관하게
# 항상 최신 글을 표시할 수 있습니다.
#
# ⚠️ GitHub 의 `schedule` 은 "최선 노력(best effort)" 트리거입니다.
#    부하가 큰 시간대에는 지연되거나 누락되며(공식 문서: "some queued jobs may be dropped"),
#    이 저장소에서는 실제로 2~8시간 간격(중앙값 약 3.8시간)으로만 실행됩니다. (2026-09 실측)
#    → "10분 안에 반영"을 지키려면 외부 스케줄러가 아래 `workflow_dispatch` 를 10분마다
#      호출하도록 설정하세요. (NOTION_SETUP.md 「⏱ 반영 속도 보장하기」 참고)
#    이 워크플로는 내용이 바뀌지 않으면 커밋하지 않으므로(scripts/notion-snapshot.mjs),
#    자주 호출해도 빈 커밋 · GitHub Pages 빌드(시간당 10회 soft limit)가 낭비되지 않습니다.
on:
  schedule:
    # 정각(:00)과 30분 부근은 GitHub 스케줄이 가장 혼잡하므로 피해서 분산합니다.
    # (보조 수단일 뿐 실행을 보장하지 않습니다 — 위 안내 참고)
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [notion-sync, sync]
  push:
    # ⚠️ `arena/**` 를 넣으면 기능 브랜치에 푸시할 때마다 동기화 봇이
    #    notion-content.json 과 생성된 글 페이지를 **그 브랜치에도** 커밋합니다.
    #    같은 파일이 main 에서도 10분마다 갱신되므로, PR 이 계속 충돌합니다
    #    (2026-10-25 #57 에서 실제로 5회 발생). 기능 브랜치는 schedule 로 충분합니다.
    branches:
      - main
    # 생성 산출물만 바뀐 커밋으로는 동기화를 다시 돌리지 않습니다(자기 증식 방지).
    paths-ignore:
      - "post/**"
      - "notice/**"
      - "qna/**"
      - "guide/**"
      - "en/**"
      - "ja/**"
      - "zh/**"
      - "assets/**"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "index.html"
      - "404.html"
      - "notion-content.json"

concurrency:
  group: notion-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 글 분류 · 요약 리포트 규칙 테스트
        # 노션 값을 사이트 섹션으로 옮기는 규칙(scripts · src/content/classify.js)을 먼저 검증합니다.
        # 실패하면 엉뚱한 섹션으로 글이 들어가는 것을 막기 위해 동기화를 중단합니다.
        run: npm run test:unit

      - name: Notion 스냅샷 생성
        env:
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          # 허브 Q&A 표(XCONDA 허브 Q&A) — 비워 두면 스크립트의 기본값을 씁니다.
          NOTION_FAQ_PAGE_ID: ${{ vars.NOTION_FAQ_PAGE_ID }}
          NOTION_FAQ_DATABASE_ID: ${{ vars.NOTION_FAQ_DATABASE_ID }}
        # 내용이 이전 스냅샷과 같고 마지막 갱신이 60분 이내면 파일을 다시 쓰지 않습니다.
        # 실행 화면의 Summary 탭에 "글 → 섹션" 분류표와 노션에서 손볼 곳을 남깁니다.
        run: node scripts/notion-snapshot.mjs --out notion-content.json

      - uses: actions/upload-artifact@v4
        with:
          name: notion-content
          path: notion-content.json
          retention-days: 1

      - name: 글별 페이지 · sitemap · robots 재생성 후 커밋
        id: publish
        # 글 페이지(/post/{slug}/ 등)·sitemap.xml·robots.txt·홈 <head> 는 스냅샷에서 만들어집니다.
        # 스냅샷만 커밋하면 페이지가 옛 내용으로 남으므로 여기서 함께 갱신합니다.
        #  - 항상 origin 최신 상태에서 시작합니다(build-site 가 방금 올린 번들을 덮어쓰지 않도록).
        #  - 번들(index.html 의 앱 코드)은 origin 의 것을 그대로 쓰고, <head> 와 글 본문만 다시 씁니다.
        #  - 실패 시(다른 푸시와 경합) 같은 순서로 최대 3번 다시 시도합니다.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp notion-content.json /tmp/notion-content.json
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp /tmp/notion-content.json notion-content.json
            # 글별 공유 이미지(OG)를 우리 도메인으로 복사합니다. 노션 프록시 주소는 만료될 수 있습니다.
            #  - 이미 받아 둔 파일은 manifest 로 건너뜁니다(캐시). 실패해도 빌드는 계속됩니다.
            node scripts/localize-og-images.mjs --snapshot notion-content.json || echo "::warning::공유 이미지 일부를 받지 못했습니다(빌드는 계속)"
            node scripts/build-seo.mjs --snapshot notion-content.json
            git add -A -- notion-content.json index.html sitemap.xml robots.txt llms.txt assets
            # 언어별 정적 페이지(/en/ · /ja/ · /zh/)도 같은 빌드 산출물입니다.
            for d in post notice qna guide en ja zh; do git add -A -- "$d" 2>/dev/null || true; done
            if git diff --cached --quiet; then
              echo "변경 없음 — 커밋 생략"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: Notion 콘텐츠 동기화 [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "게시 완료"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "푸시 경합 — 최신 상태에서 다시 시도 ($attempt/3)"
            sleep 5
          done
          echo "::error::3번 시도했지만 게시하지 못했습니다"
          exit 1

      - name: IndexNow에 사이트맵 주소 알림
        # arena 브랜치에는 알리지 않습니다. workflow_dispatch 는 실패한 알림의 수동 재시도도 겸합니다.
        if: (steps.publish.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/indexnow.mjs
