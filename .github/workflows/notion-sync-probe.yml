name: Notion 동기화 진단 (임시)

# 목적: 스냅샷 생성 단계가 **왜** 실패하는지 로그를 애너테이션으로 꺼내 본다.
# (실행 로그는 results-receiver 호스트에서 내려받아야 해서 외부에서 읽을 수 없고,
#  애너테이션은 GitHub API 로 읽을 수 있다.)
# 진단이 끝나면 이 파일은 삭제합니다. 저장소 산출물은 건드리지 않습니다(--out /tmp).

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 스냅샷 시도 (진단용 · 파일은 /tmp 에만 씀)
        env:
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_FAQ_PAGE_ID: ${{ vars.NOTION_FAQ_PAGE_ID }}
          NOTION_FAQ_DATABASE_ID: ${{ vars.NOTION_FAQ_DATABASE_ID }}
        run: |
          set -o pipefail
          # main 과 **같은 조건**으로 돌린다 — 저장소에 커밋된 스냅샷을 이전 상태로 두고 비교한다.
          cp notion-content.json /tmp/probe.json
          node scripts/notion-snapshot.mjs --out /tmp/probe.json 2>&1 | tee /tmp/probe.log || echo "EXIT=$?"
          echo "===== 요약 줄 ====="
          grep -nE '✖|✔|＝|허브 Q&A|표에서 읽은|제외|가드|삭제|실패|시도' /tmp/probe.log | tail -n 20 || true
          echo "===== 애너테이션 ====="
          {
            node -e '
              const fs=require("fs");
              const prev=JSON.parse(fs.readFileSync("notion-content.json","utf8"));
              const next=JSON.parse(fs.readFileSync("/tmp/probe.json","utf8"));
              const count=(s)=>{const m={};for(const r of s.rows??[]){const k=r.__type??"(none)";m[k]=(m[k]??0)+1;}return m;};
              console.log(`PROBE 이전 rows=${prev.rows.length} ${JSON.stringify(count(prev))}`);
              console.log(`PROBE 이후 rows=${next.rows.length} ${JSON.stringify(count(next))}`);
            ' 2>&1 || echo "PROBE 비교 실패"
          } > /tmp/probe-cmp.txt
          cat /tmp/probe-cmp.txt
          cat /tmp/probe-cmp.txt /tmp/probe.log | grep -E 'PROBE|✖|✔|＝|허브 Q&A|표에서 읽은|가드|삭제|실패|HTTP' | tail -n 25 > /tmp/probe-annot.txt || true
          while IFS= read -r line; do
            safe="${line//%/%25}"
            safe="${safe//$'\r'/}"
            echo "::warning::${safe}"
          done < /tmp/probe-annot.txt

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 진단 결과"
            echo ""
            echo '```'
            tail -n 40 /tmp/probe.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
