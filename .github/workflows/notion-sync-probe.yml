name: Notion 동기화 진단 (임시)

# 목적: 스냅샷 생성 단계가 **왜** 실패하는지 로그를 애너테이션으로 꺼내 본다.
# (실행 로그는 results-receiver 호스트에서 내려받아야 해서 외부에서 읽을 수 없고,
#  애너테이션은 GitHub API 로 읽을 수 있다.)
# 진단이 끝나면 이 파일은 삭제합니다. 저장소 산출물은 건드리지 않습니다(--out /tmp).

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 스냅샷 시도 (진단용 · 파일은 /tmp 에만 씀)
        env:
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_FAQ_PAGE_ID: ${{ vars.NOTION_FAQ_PAGE_ID }}
          NOTION_FAQ_DATABASE_ID: ${{ vars.NOTION_FAQ_DATABASE_ID }}
        run: |
          set -o pipefail
          node scripts/notion-snapshot.mjs --out /tmp/probe.json 2>&1 | tee /tmp/probe.log || true
          echo "===== 마지막 30줄 ====="
          tail -n 30 /tmp/probe.log
          echo "===== 애너테이션 ====="
          while IFS= read -r line; do
            safe="${line//%/%25}"
            safe="${safe//$'\r'/}"
            echo "::warning::${safe}"
          done < <(tail -n 30 /tmp/probe.log)

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 진단 결과"
            echo ""
            echo '```'
            tail -n 40 /tmp/probe.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
