드를 완성합니다.",href:`${Te}/studio/directors-cut`,image:Ft.storyboard,badge:"Most Popular",steps:["이미지 엔진(모델)을 선택합니다.","배경이 될 연도와 장소를 설정합니다.","시나리오를 작성합니다. 인물·상황·감정의 흐름을 구체적으로 쓸수록 좋습니다.","감독 스타일과 아트 스타일을 선택해 전체 무드와 연출 방향을 정합니다.","생성하면 앵글·무드·타이밍이 설계된 9컷 스토리보드가 만들어집니다.","마음에 들지 않는 컷은 처음부터 다시 만들 필요 없이, 해당 컷의 프롬프트만 수정해 개별 재생성합니다."],tips:["광고 피치라면 ‘Ad Storyboard 템플릿’으로 시작하면 브리프 하나로 5분 안에 시안을 완성할 수 있습니다.","피드백을 반영해도 캐릭터의 감정·부상·소품 상태와 이전 프롬프트가 모든 씬에 걸쳐 기억됩니다."]},{slug:"art-director-pro",name:"Art Director Pro",group:"핵심 스튜디오",tagline:"캐릭터 얼굴과 의상이 모든 컷에서 그대로",desc:"얼굴 사진으로 캐릭터 시트를 만들고, 시나리오 속 이름으로 얼굴·의상 레퍼런스를 연결해 컷 간 일관성을 지킵니다.",href:Te,image:Ft.continuity,badge:"Core",steps:["시나리오에 캐릭터의 이름을 반드시 포함합니다. AI는 이름으로 얼굴과 의상 레퍼런스를 연결합니다.","캐릭터의 얼굴 사진을 업로드합니다.","Detect Face를 눌러 캐릭터 시트를 생성합니다. 시트가 있어야 생성을 시작할 수 있습니다.","필요하면 의상·소품 레퍼런스를 추가합니다.","생성합니다. 시나리오를 수정해 다시 생성해도 이전 컷의 톤과 맥락이 유지됩니다."],tips:["여러 인물이 등장하면 인물마다 이름과 얼굴 사진을 하나씩 짝지어 주세요.","정면·밝은 조명의 얼굴 사진이 가장 정확하게 인식됩니다."]},{slug:"scene-snap",name:"Scene Snap",group:"스토리보드",tagline:"이미지 한 장 → 6키프레임 시네마틱 스토리보드",desc:"이미지를 업로드하면 6개의 키프레임으로 구성된 시네마틱 스토리보드를 생성합니다.",href:`${Te}/studio/scene-snap`,image:`${Ht}/tool-scene-snap.png`,steps:["기준이 될 이미지를 업로드합니다.","필요하면 분위기나 전개를 짧게 입력합니다.","생성하면 6개의 키프레임 스토리보드가 만들어집니다."]},{slug:"youtube-ref",name:"YouTube Ref",group:"스토리보드",tagline:"유튜브 링크 → 9씬 스토리보드",desc:"영상 링크를 붙여넣으면 AI가 9씬 스토리보드를 생성합니다. 캐릭터 레퍼런스는 선택 사항입니다.",href:`${Te}/studio/youtube-ref`,image:`${Ht}/tool-youtube-ref.png`,steps:["참고할 유튜브 영상 링크를 붙여넣습니다.","(선택) 캐릭터 레퍼런스 이미지를 업로드합니다.","생성하면 영상 흐름을 참고한 9씬 스토리보드가 만들어집니다."]},{slug:"drct-seq",name:"Directors Sequence",group:"스토리보드",tagline:"키프레임 하나 → 연속된 8씬",desc:"키프레임 한 장을 업로드하면 AI가 이어지는 8개의 씬을 자동 생성해 시네마틱한 시퀀스를 만듭니다.",href:`${Te}/studio/drct-seq`,image:`${Ht}/tool-drct-seq.png`,steps:["시퀀스의 시작이 될 키프레임을 업로드합니다.","생성하면 연속된 8개의 씬이 자동으로 만들어집니다.","필요한 씬만 골라 스토리보드에 활용합니다."]},{slug:"spin-angle",name:"SpinAngle",group:"카메라 · 앵글",tagline:"원과 화살표로 카메라 위치·방향 지정",desc:"원으로 카메라 위치를, 화살표로 방향을 표시하면 그 시점의 포토리얼 뷰를 생
