 Generate and choose OK in the confirmation dialog.","Compare the result, then share, regenerate, download, or delete it."],tips:["Use only your own face or one you have explicit permission to use.","Keep the mask around the face neither too narrow nor too wide."]},"background-blend":{tagline:"Person + background → a cinematic composite",desc:"Upload a portrait and a background image, then let AI blend them naturally into a cinematic look.",steps:["Upload a photo of the person.","Upload a background image.","Generate a composite with matched lighting and color tone."]},"cine-grade":{tagline:"Bring the color of a film still to your image",desc:"Upload a reference film still to transfer its color grade, contrast, and mood to your photo instantly.",steps:["Upload the photo you want to grade.","Upload a film still as your visual reference.","Generate the image with the reference color grade and mood applied."]},image:{tagline:"Create with seven AI models and image references",desc:"Use Nano Banana, Kling, Z Image, Seedream, and Grok Imagine models in one workspace with model-specific references, ratios, resolutions, and output counts.",steps:["Choose one of seven models based on your goal and reference-image limits.","Enter the required prompt and optionally attach references in @image format.","Set one of 12 ratios, 1K/2K/4K resolution, and a count of 1, 2, or 4 images.","With Z Image, enter unwanted elements under Negative prompt.","Generate, then use prompt copy, detail view, and download controls on the result."],tips:["After changing models, verify whether ratio and resolution were reset to supported values.","English prompts can improve text-understanding accuracy."]},video:{tagline:"Video models including Kling 3.0",desc:"Generate video from a finished storyboard cut or a text prompt.",steps:["Choose a video model.","Enter a prompt or upload a starting image.","Set options such as duration and aspect ratio, then generate."]},upscale:{tagline:"2X/4X detail upscaling with Topaz or Xconda",desc:"Scale low-resolution or blurry images by 2X or 4X, then restore detail with source-specific Enhance Models and Face Enhancement.",steps:["Choose fine-control Topaz or the faster in-house Xconda model.","Upload the source and choose 2X or 4X scale.","With Topaz, set Enhance Model, Subject Detection, and output format.","For portraits, tune Face Enhancement and Creativity from a low-to-middle range.","Confirm the Generate cost and choose OK to start.","Download Latest Result and compare previous versions in History."],tips:["Start Face Enhancement near the middle to avoid over-processing portraits.","Use JPG for sharing and PNG for compositing or further editing."]}},F=(o,c="💡")=>({type:"callout",icon:c,text:o}),$=(o,c)=>({type:"toggle",text:o,children:c}),Jx={turn:{ko:[{type:"p",text:"360도 배경 생성부터 3D 시점 선택, 부분 수정, 인물 연출, 최종 스틸까지 한 흐름으로 이어지는 작업 환경입니다."},F("2026 사용자 가이드 기준 · 전체 흐름은 Reference → HDRI → Production → Final Still 순서입니다.","🧭"),{type:"h2",text:"빠른 시작"},{type:"ol",items:["왼쪽 사이드바에서 Turn을 엽니다.","Reference 단계에서 Front / Left / Right / Back 이미지를 넣거나 Description만 작성합니다.","Generate를 눌러 360° HDRI 환경을 만듭니다.","3D Preview를 클릭·드래그해 카메라 방향을 정하고 Freeze Frame을 생성합니다.","Production에서 인물·액션·조명·Cinema Style과 캐스트 레퍼런스를 설정합니다.","Generate로 Final Still을 만든 뒤 원하는 결과를 다운로드합니다."]},{type:"h2",text:"1. Reference — 공간 만들기"},$("입력 방식 선택",[{type:"ul",items:["프롬프트만: 레퍼런스가 없거나 공간 시안을 빠르게 잡을 때 사용합니다.","이미지 1장: 기존 배경의 분위기를 기준으로 360° 공간을 확장할 때 사용합니다.","4방향 이미지: Front / Left / Right / Back의 구조를 명확하게 유지할 때 사용합니다.","Cube Map 수정: 생성 후 특정 방향의 창문·가구·소품·벽면 디테일만 바꿀 때 사용합니다."]}]),{type:"p",text:"레퍼런스는 4장을 모두 넣어도 되고, 1장만 넣거나 전부 비운 채 Description만으로 시작해도 됩니다. 이미지 없이 진행할 때는 공간, 인물, 제품, 소품, 조명 분위기를 구체적으로 적어 주세요."},F("Reference 단계의 Generate는 크레딧을 사용하며, 완료되면 HDRI 단계로 이동합니다.","⚡"),{type:"h2",text:"2. HDRI — 시점 선택과 부분 수정"},{type:"ol",items:["3D Preview에서 화면을 클릭·드래그해 360° 공간을 둘러봅니다.","배경 중심, 인물 배치 위치, 카메라 방향을 확인해 원하는 구도를 찾습니다.","Freeze Frame 영역의 Generate를 눌러 현재 시점을 기준 장면으로 저장합니다."]},$("Cube Map의 5가지 편집 도구",[{type:"ul",items:["Brush: 수정할 영역에 빨간 마스크를 칠합니다. 작은 소품·얼굴 근처는 작은 브러시, 벽·바닥은 큰 브러시가 적합합니다.","Replace with: 선택 영역에 추가하거나 바꿀 내용을 입력합니다.","Inpaint: 프롬프트가 있으면 오브젝트를 추가·변경합니다. 입력칸을 비우면 마스크 영역의 오브젝트를 제거합니다.","Clear: 결과는 바꾸지 않고 현재 방향에 그린 브러시 마스크만 지웁니다.","REGEN: 부분 수정이 아니라 선택한 방향 화면 전체를 다시 생성합니다."]}]),F("Inpaint 마스크는 대상보다 약간 크게 잡는 편이 안정적입니다. 전체 구성이 어색할 때만 변화 폭이 큰 REGEN을 사용하세요."),{type:"h2",text:"3. Production — 최종 연출"},{type:"p",text:"Subject & Casting에 인물의 감정, 자세, 액션, 라이팅과 시네마틱 디테일을 작성합니다. 예: ‘창가에 서 있는 모델, 강한 림 라이트, 자연스러운 미소, 프리미엄 광고 화보’."},$("Cinema Style",[{type:"p",text:"Normal, Hollywood, Korean, Japanese, Chinese, Film Noir, Cyberpunk, Anime 중 하나를 선택합니다. 같은 Freeze Frame이어도 스타일에 따라 색감·조명·대비·분위기가 달라집니다."}]),$("Cast Reference",[{type:"ul",items:["Face ID Source: 유지할 얼굴 기준 이미지를 넣습니다.","Wardrobe Ref: 의상과 스타일 기준 이미지를 넣습니다.","두 레퍼런스를 함께 사용하면 얼굴과 의상 방향을 더 명확하게 유지할 수 있습니다."]}]),{type:"h2",text:"결과와 다운로드"},{type:"ul",items:["Freeze Frame: HDRI 단계에서 선택한 기본 카메라 시점입니다. Production 전 구도 검토용으로 따로 다운로드할 수 있습니다.","Final Still: Production의 인물·액션·조명·스타일을 반영한 최종 이미지입니다.","두 결과는 역할이 다르므로 Download Freeze Frame과 Download Final Still 버튼을 구분해 사용합니다."]}],en:[{type:"p",text:"A continuous workspace for 360° environment generation, 3D viewpoint selection, partial edits, subject direction, and final still creation."},F("Based on the 2026 user guide · The full flow is Reference → HDRI → Production → Final Still.","🧭"),{type:"h2",text:"Quick start"},{type:"ol",items:["Open Turn from the left sidebar.","In Reference, add Front / Left / Right / Back images or write only a Description.","Press Generate to build the 360° HDRI environment.","Click and drag in 3D Preview to choose a camera angle, then create a Freeze Frame.","In Production, set the subject, action, lighting, Cinema Style, and cast references.","Generate the Final Still and download the output you need."]},{type:"h2",text:"1. Reference — build the space"},$("Choose an input mode",[{type:"ul",items:["Prompt only: for quick spatial drafts or when no reference is available.","Single image: extend the mood of an existing background into a 360° space.","Four-direction images: keep Front / Left / Right / Back structure clearly defined.","Cube Map edit: change a window, furniture, prop, wall, or other detail on one face after generation."]}]),{type:"p",text:"Use all four reference slots, only one, or leave them empty and rely on Description. For prompt-only work, describe the space, subject, product, props, and lighting mood in detail."},F("Generate in the Reference step consumes credits and advances to HDRI when complete.","⚡"),{type:"h2",text:"2. HDRI — choose an angle and refine the space"},{type:"ol",items:["Click and drag in 3D Preview to inspect the 360° environment.","Check the scene center, planned subject position, and camera direction.","Press Generate in Freeze Frame to save the current viewpoint as the reference shot."]},$("Five Cube Map editing controls",[{type:"ul",items:["Brush: paint a red mask over the edit area. Use a small brush near faces and props, and a large brush for walls or floors.","Replace with: describe what to add or change inside the selected region.","Inpaint: adds or changes an object when a prompt is present; with an empty field, it removes the masked object.","Clear: removes only the current brush mask without changing the image.","REGEN: rebuilds the entire selected directional face rather than making a local edit."]}]),F("A mask slightly larger than the target is usually most reliable. Use the higher-variation REGEN only when the whole face composition is not working."),{type:"h2",text:"3. Production — direct the final image"},{type:"p",text:"In Subject & Casting, describe emotion, pose, action, lighting, and cinematic detail. Example: “a model standing by the window, strong rim light, natural smile, premium advertising editorial.”"},$("Cinema Style",[{type:"p",text:"Choose Normal, Hollywood, Korean, Japanese, Chinese, Film Noir, Cyberpunk, or Anime. Even with the same Freeze Frame, style changes color, light, contrast, and atmosphere."}]),$("Cast Reference",[{type:"ul",items:["Face ID Source: add the face identity you want to preserve.","Wardrobe Ref: add the clothing and styling reference.","Using both provides clearer direction for face and wardrobe continuity."]}]),{type:"h2",text:"Outputs and downloads"},{type:"ul",items:["Freeze Frame: the base camera viewpoint selected during HDRI. Download it separately for composition review before Production.","Final Still: the finished image with Production subject, action, lighting, and style applied.","The outputs serve different purposes, so use Download Freeze Frame and Download Final Still separately."]}]},"directors-cut":{ko:[{type:"p",text:"이미지 엔진과 시간·공간, 연출·아트 스타일을 설정해 하나의 이야기로 이어지는 9컷 그리드를 만드는 도구입니다."},F("2026 사용자 매뉴얼 기준 · 필수 항목을 모두 입력해야 Generate가 활성화됩니다.","🎬"),{type:"h2",text:"빠른 시작"},{type:"ol",items:["왼쪽 사이드바에서 Director's Cut을 엽니다.","Standard 또는 Cinema Pro 이미지 엔진을 선택합니다.","Year, Location, Scenario를 입력합니다.","Director Style과 Art Style을 선택합니다.","필요하면 Hero Product와 Hero Muse 이미지를 첨부합니다.","Generate를 눌러 3×3 구성의 9컷 그리드를 만듭니다."]},{type:"h2",text:"1. 이미지 엔진"},$("Standard와 Cinema Pro 비교",[{type:"ul",items:["Standard (Gemini 2.5 Flash): 빠르고 기본 구도를 잘 잡아 초안, 아이디어 탐색, 레퍼런스 제작에 적합합니다. 매뉴얼 예시는 컷당 4 credits입니다.","Cinema Pro (Gemini 3.1 Pro): 피부·질감·광원 디테일, 클로즈업·로우앵글·심도, 프레임 일관성이 뛰어나 광고·영상용 최종 결과에 적합합니다. 매뉴얼 예시는 컷당 7 credits입니다."]},F("크레딧은 변경될 수 있으므로 생성 직전 화면에 표시된 실제 비용을 확인하세요.","⚡")]),{type:"h2",text:"2. 필수 입력"},{type:"ul",items:["Year: 시대 또는 시간적 배경을 입력합니다.","Location: 도시나 장소 등 공간적 배경을 입력합니다.","Scenario: 제작할 이야기나 상황을 최소 글자 수 이상으로 작성합니다.","Director Style: 장면의 연출 문법과 톤앤무드를 선택합니다.","Art Style: 실사·애니메이션·클레이메이션·3D 중 결과 매체를 선택합니다."]},$("5가지 Director Style",[{type:"ul",items:["Wes Anderson: 대칭 구도, 파스텔 톤, 정돈된 동화적 미장센.","Spike Jonze: 현실과 환상의 경계, 인간적인 스토리, 몽환적이고 서정적인 무드.","Wieden+Kennedy: 강한 메시지와 브랜드 아이덴티티 중심의 광고 연출.","The Baker Brothers: 빠른 템포, 트렌디한 컷 편집, 리듬감 있는 광고 연출.","Show Yanagisawa: 자연광과 여백을 활용한 일본식 미니멀 감성."]}]),$("4가지 Art Style",[{type:"ul",items:["Live Action (Arri Alexa): 현실적 영화·광고 룩.","Studio Ghibli: 따뜻하고 감성적인 판타지 애니메이션.","Stop-motion Claymation: 수공예 질감과 개성.","3D Animation (Pixar Style): 친근하고 대중적인 캐릭터 표현."]}]),{type:"h2",text:"3. 제품·모델 레퍼런스 (선택)"},{type:"ul",items:["Hero Product: 광고의 핵심 제품 이미지를 첨부합니다.","Hero Muse: 9컷에 동일한 모델을 유지하려면 가능한 정면 사진을 첨부합니다.","배경이 없는 이미지를 쓰면 인식 정확도와 컷 간 일관성이 좋아집니다. 두 항목은 선택 사항이며 제품 중심 광고도 만들 수 있습니다."]},{type:"h2",text:"4. 생성·개별 수정·다운로드"},{type:"ol",items:["필수 항목을 확인하고 Generate를 눌러 오른쪽에 9컷 그리드를 만듭니다.","수정할 컷의 펜 아이콘을 눌러 해당 프롬프트를 엽니다.","프롬프트를 수정하고 Regenerate를 누르면 선택한 컷만 다시 생성됩니다. 다른 컷은 영향을 받지 않습니다.","각 컷의 다운로드 아이콘으로 개별 저장하거나 Download All로 9장을 한 번에 저장합니다."]},F("컷은 순서와 횟수에 관계없이 개별 재생성할 수 있습니다. 전체를 다시 만들기 전에 문제 있는 컷만 수정해 보세요.")],en:[{type:"p",text:"Build a coherent nine-cut story grid by setting the image engine, time and place, directorial style, and art medium."},F("Based on the 2026 user manual · Generate activates only after every required field is complete.","🎬"),{type:"h2",text:"Quick start"},{type:"ol",items:["Open Director's Cut from the left sidebar.","Choose the Standard or Cinema Pro image engine.","Enter Year, Location, and Scenario.","Choose a Director Style and Art Style.","Optionally attach Hero Product and Hero Muse images.","Press Generate to create a 3×3 nine-cut grid."]},{type:"h2",text:"1. Image engine"},$("Standard vs Cinema Pro",[{type:"ul",items:["Standard (Gemini 2.5 Flash): fast with solid base framing; suited to drafts, idea exploration, and reference creation. The manual example shows 4 credits per cut.","Cinema Pro (Gemini 3.1 Pro): stronger skin, texture, lighting, close-up, low-angle, depth, and cross-frame consistency; suited to final ad and video output. The manual example shows 7 credits per cut."]},F("Credit pricing can change. Always confirm the actual cost displayed immediately before generation.","⚡")]),{type:"h2",text:"2. Required inputs"},{type:"ul",items:["Year: enter the era or temporal setting.","Location: enter the city, place, or spatial setting.","Scenario: describe the story or situation and meet the minimum length.","Director Style: choose the directorial grammar and tone-and-mood.","Art Style: choose live action, animation, claymation, or 3D as the output medium."]},$("Five Director Styles",[{type:"ul",items:["Wes Anderson: symmetry, pastels, and precisely arranged storybook mise-en-scène.","Spike Jonze: human storytelling on the border of reality and fantasy, with a lyrical mood.","Wieden+Kennedy: message-led advertising with strong brand identity.","The Baker Brothers: fast tempo, trend-aware cuts, rhythm, and visual impact.","Show Yanagisawa: Japanese minimalism using natural light, negative space, and quiet emotion."]}]),$("Four Art Styles",[{type:"ul",items:["Live Action (Arri Alexa): realistic film and advertising look.","Studio Ghibli: warm, emotional fantasy animation.","Stop-motion Claymation: handcrafted texture and personality.","3D Animation (Pixar Style): approachable, mass-appeal character rendering."]}]),{type:"h2",text:"3. Product and model references (optional)"},{type:"ul",items:["Hero Product: attach the central product image for the campaign.","Hero Muse: attach a front-facing model photo to maintain the same person across all nine cuts.","Background-free images improve recognition and consistency. Both fields are optional, so product-only campaigns are supported."]},{type:"h2",text:"4. Generate, edit a frame, and download"},{type:"ol",items:["Check the required fields and press Generate to create the nine-cut grid on the right.","Press the pen icon on the frame you want to revise to reveal its prompt.","Edit the prompt and press Regenerate to rerender only that frame; the others are unaffected.","Use a frame's download icon for an individual file, or Download All for all nine images."]},F("Frames can be regenerated individually in any order and as many times as needed. Fix only the problem frame before rebuilding the full grid.")]},"art-director-pro":{ko:[{type:"p",text:"포커스 모드, 캐릭터 시트, 카메라와 렌즈를 조합해 얼굴·의상·공간의 연속성을 유지하는 시네마틱 9컷을 만듭니다."},F("2026 사용자 매뉴얼 기준 · 시나리오의 이름과 Role Name이 정확히 일치해야 얼굴과 의상 레퍼런스가 연결됩니다.","🎭"),{type:"h2",text:"빠른 시작"},{type:"ol",items:["메인 화면의 START를 누른 뒤 왼쪽 사이드바에서 Art Director Pro를 엽니다.","Dialogue, Action, Atmosphere 중 포커스 모드를 선택합니다.","등장인물의 Role Name이 포함된 시나리오를 작성하고 배경 이미지를 올립니다.","캐스트별 Role Name, Face ID Source, 선택 사항인 Wardrobe Ref를 설정합니다.","Detect Face로 좌·정면·우 3뷰 캐릭터 시트를 생성합니다.","Camera와 Optics를 선택한 뒤 Generate를 누릅니다."]},{type:"h2",text:"1. 포커스 모드"},{type:"ul",items:["Dialogue Focus: 감정, 표정, 인물 관계와 얼굴 클로즈업 중심. 드라마·인터뷰·스토리텔링에 적합합니다.","Action Focus: 동작, 동선, 다이나믹한 카메라와 속도감 중심. 액션·퍼포먼스·광고·스포츠에 적합합니다.","Atmosphere Focus: 조명, 색감, 공간 디테일과 톤앤매너 중심. 무드 필름·브랜딩·룩북에 적합합니다."]},{type:"h2",text:"2. 시나리오와 공간"},{type:"ul",items:["Scenario는 필수이며 최소 글자 수를 충족해야 합니다. 각 등장인물의 이름을 반드시 포함하세요.","Plate Product에는 건물, 방 구조, 거리 형태처럼 공간 구조가 명확한 배경 이미지를 사용하면 일관성이 좋아집니다.","Role Name은 시나리오에서 사용한 이름과 철자까지 동일하게 입력합니다.","인물이 2명 이상이면 Add Cast로 입력 영역을 추가합니다."]},{type:"h2",text:"3. 얼굴·의상 연속성"},{type:"ol",items:["Face ID Source에 가능한 밝고 정면에 가까운 얼굴 사진을 업로드합니다.","필요하면 Wardrobe Ref에 유지할 의상 이미지를 올립니다. 의상 레퍼런스는 선택 사항입니다.","Detect Face를 눌러 좌측·정면·우측 3뷰 캐릭터 시트를 만듭니다.","캐릭터 시트가 없으면 Generate가 활성화되지 않으므로 캐스트마다 생성 여부를 확인합니다."]},F("애니메이션 캐릭터도 입력할 수 있지만 실사 데이터에 최적화된 엔진 특성상 실사화되거나 디테일이 줄어들 수 있습니다.","⚠️"),{type:"h2",text:"4. Camera / Optics"},$("6가지 Camera",[{type:"ul",items:["ARRI ALEXA 35: 균형 잡힌 17-stop 다이나믹 레인지, 광고·영화 표준 톤.","SONY VENICE 2: 부드러운 그림자와 페인터리 질감, 감성적이고 고급스러운 이미지.","RED V-RAPTOR: 초고해상도와 강한 대비, 선명한 광고 비주얼.","PANAVISION MILLENNIUM DXL2: 대형 포맷 특유의 깊이감.","ARRIFLEX 16SR: 16mm 필름 그레인, 빈티지·다큐멘터리 감성.","IMAX MKIV: 70mm 기반의 압도적인 스케일감."]}]),$("10가지 Optics",[{type:"ul",items:["Cooke S4 — 따뜻한 색감·크리미한 보케 / ARRI Signature Prime — 현대적·깨끗한 표준 이미지.","Zeiss Ultra Prime — 강한 콘트라스트·디테일 / Canon K-35 — 빈티지 하이라이트 글로우.","Panavision C-Series — 블루 플레어 아나모픽 / Hawk V-Lite — 레트로 아나모픽.","JDC Xtal Xpress — 독특한 왜곡 / Helios 44-2 — 소용돌이 보케.","Angénieux Optimo — 유연한 시네마 줌 / Leica Summilux-C — 자연스럽고 사실적인 고급 룩."]}]),{type:"h2",text:"5. Preview, 재생성, 업스케일"},{type:"ul",items:["Generate를 누르면 Preview 1에 9컷 그리드가 만들어집니다. Preview 2~4에서 반복 생성하면 최대 36장까지 만들 수 있습니다.","시나리오를 바꾸지 않고 결과만 다시 만들려면 Regenerate Grid를 사용합니다.","시나리오의 흐름을 수정한 뒤 Generate하면 기존 톤앤매너를 유지하면서 변경된 인과 관계를 반영합니다.","탭의 X로 Preview를 삭제할 수 있습니다. 선택한 탭이 없으면 빈 탭이 자동으로 채워집니다.","업스케일할 컷을 체크한 뒤 Apply to Selection을 누릅니다. Select All로 전체 선택할 수 있으며 결과는 9장씩 페이지로 구분됩니다.","Download Selected는 선택한 컷만, Download All은 전체 결과를 저장합니다."]}],en:[{type:"p",text:"Combine a focus mode, character sheets, camera, and optics to create cinematic nine-cut grids with face, wardrobe, and spatial continuity."},F("Based on the 2026 user manual · Names in the Scenario and Role Name fields must match exactly for face and wardrobe references to connect.","🎭"),{type:"h2",text:"Quick start"},{type:"ol",items:["Press START on the main screen, then open Art Director Pro from the left sidebar.","Choose Dialogue, Action, or Atmosphere focus.","Write a scenario containing each Role Name and upload a background image.","For each cast member, set Role Name, Face ID Source, and the optional Wardrobe Ref.","Press Detect Face to generate a left/front/right three-view character sheet.","Choose Camera and Optics, then press Generate."]},{type:"h2",text:"1. Focus mode"},{type:"ul",items:["Dialogue Focus: emotion, expression, relationships, and facial close-ups; best for drama, interviews, and storytelling.","Action Focus: motion, blocking, dynamic cameras, and speed; best for action, performance, advertising, and sports.","Atmosphere Focus: lighting, color, environmental detail, and tone; best for mood films, branding, and lookbooks."]},{type:"h2",text:"2. Scenario and space"},{type:"ul",items:["Scenario is required and must meet the minimum length. Include the name of every character.","For Plate Product, a background with clear structure—buildings, room layout, or street form—improves consistency.","Enter each Role Name exactly as written in the scenario.","For two or more characters, use Add Cast to create another input group."]},{type:"h2",text:"3. Face and wardrobe continuity"},{type:"ol",items:["Upload a bright, near-frontal portrait to Face ID Source.","Optionally add the outfit to preserve in Wardrobe Ref.","Press Detect Face to create the left, front, and right three-view character sheet.","Generate remains disabled without a character sheet, so confirm one exists for every cast member."]},F("Animated characters are accepted, but an engine optimized for live-action data may convert the style toward realism or lose detail.","⚠️"),{type:"h2",text:"4. Camera / Optics"},$("Six Camera options",[{type:"ul",items:["ARRI ALEXA 35: balanced 17-stop dynamic range and a standard ad/film tone.","SONY VENICE 2: soft shadows and painterly texture for emotional, premium images.","RED V-RAPTOR: ultra-high resolution and strong contrast for crisp advertising visuals.","PANAVISION MILLENNIUM DXL2: large-format cinematic depth.","ARRIFLEX 16SR: 16mm grain with a vintage documentary feel.","IMAX MKIV: 70mm-based scale and impact."]}]),$("Ten Optics options",[{type:"ul",items:["Cooke S4 — warm color and creamy bokeh / ARRI Signature Prime — modern, clean standard image.","Zeiss Ultra Prime — strong contrast and detail / Canon K-35 — vintage highlight glow.","Panavision C-Series — blue-flare anamorphic / Hawk V-Lite — retro anamorphic.","JDC Xtal Xpress — distinctive distortion / Helios 44-2 — swirly bokeh.","Angénieux Optimo — flexible cinema zoom / Leica Summilux-C — natural, realistic premium look."]}]),{type:"h2",text:"5. Preview, regenerate, and upscale"},{type:"ul",items:["Generate creates a nine-cut grid in Preview 1. Repeat in Previews 2–4 for up to 36 images.","Use Regenerate Grid to rerender the images without changing the scenario.","Edit the scenario flow and Generate again to apply the new causal sequence while preserving tone-and-mood.","Delete a Preview with its X. If no tab is selected, generation automatically fills an empty slot.","Check the frames to upscale, then press Apply to Selection. Select All chooses every frame; results are paginated in groups of nine.","Download Selected saves checked frames; Download All saves the complete result set."]}]},"face-swap":{ko:[{type:"p",text:"원본의 배경·의상·포즈·조명·구도를 최대한 유지하면서 지정한 얼굴 영역만 다른 얼굴로 교체합니다."},F("본인 또는 명시적인 사용 동의를 받은 얼굴만 사용하고, 공개 공유 전 결과와 권리를 확인하세요.","🛡️"),{type:"h2",text:"언제 사용하나요?"},{type:"ul",items:["재촬영 없이 같은 컷에서 캐스팅 후보나 모델의 인상을 비교할 때.","기존 이미지의 포즈와 의상은 유지하고 얼굴만 바꿀 때.","초상권이 민감한 레퍼런스를 대체하거나 배우·모델 버전을 비교할 때."]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 사이드바에서 Face Swap을 열고 Models에서 Nano Banana 2 또는 Nano Banana를 선택합니다.","Original image에 얼굴을 바꿀 원본 이미지를 업로드합니다.","Brush Size를 조절하며 원본 위의 교체할 얼굴 영역을 마스크로 칠합니다.","Swap to image에 새로 적용할 얼굴 이미지를 업로드합니다.","세 입력(원본·마스크·교체 얼굴)이 완료되면 Generate를 누르고 확인 팝업에서 OK를 선택합니다.","오른쪽 결과 카드에서 생성 결과, 마스크 영역, 교체 얼굴을 비교합니다."]},{type:"h2",text:"좋은 결과를 위한 이미지·마스크 설정"},{type:"ul",items:["원본은 얼굴 방향, 조명, 해상도가 안정적일수록 자연스럽습니다.","교체 얼굴은 얼굴 구조가 잘 보이는 정면 또는 3/4 각도 이미지가 좋습니다.","마스크가 실제 교체 범위가 됩니다. 얼굴 주변을 너무 좁거나 너무 넓게 칠하지 마세요.","넓은 면은 굵은 브러시로 칠하고, 눈가·턱선은 작은 브러시로 정리합니다.","업로드 이미지는 우측 상단 X로 제거한 뒤 다시 선택할 수 있습니다."]},F("매뉴얼의 테스트 화면은 1회 생성에 6 credits를 표시합니다. 실제 비용은 Generate 직전 화면에서 다시 확인하세요.","⚡"),{type:"h2",text:"결과 관리"},{type:"ul",items:["공유: 외부 링크 아이콘을 누른 뒤 확인 팝업에서 OK를 선택하면 미디어가 공개 공유됩니다.","재생성: 새로고침 아이콘으로 같은 입력값을 바탕으로 다른 결과를 만듭니다.","다운로드: 다운로드 아이콘으로 파일을 저장합니다.","삭제: 휴지통 아이콘을 누른 뒤 확인 팝업에서 OK를 선택합니다. 삭제할 결과인지 반드시 확인하세요."]}],en:[{type:"p",text:"Replace a marked face while preserving the source background, wardrobe, pose, lighting, and composition as much as possible."},F("Use only your own face or one you have explicit permission to use, and verify rights and output before public sharing.","🛡️"),{type:"h2",text:"When to use it"},{type:"ul",items:["Compare casting candidates or model impressions in the same shot without a reshoot.","Keep an existing pose and wardrobe while changing only the face.","Replace portrait-sensitive references or compare actor/model versions of one scene."]},{type:"h2",text:"Workflow"},{type:"ol",items:["Open Face Swap from the left sidebar and choose Nano Banana 2 or Nano Banana under Models.","Upload the source image under Original image.","Adjust Brush Size and paint a mask over the face to replace.","Upload the new face under Swap to image.","When source, mask, and replacement face are ready, press Generate and confirm with OK.","Compare the generated image, marked region, and replacement face in the result card on the right."]},{type:"h2",text:"Image and mask setup for better results"},{type:"ul",items:["A source with stable face direction, lighting, and resolution produces a more natural result.","Use a frontal or three-quarter replacement image where facial structure is clearly visible.","The mask becomes the actual replacement boundary. Do not paint too narrowly or too widely around the face.","Use a thick brush for broad areas and a small brush around the eyes and jawline.","Remove either uploaded image with the X at its upper-right corner, then select it again."]},F("The manual's test screen shows 6 credits per generation. Confirm the current cost shown immediately before pressing Generate.","⚡"),{type:"h2",text:"Manage results"},{type:"ul",items:["Share: press the external-link icon, then OK in the confirmation to make the media public.","Regenerate: use the refresh icon to produce another result from the same inputs.","Download: save the file with the download icon.","Delete: press the trash icon and confirm with OK. Verify that the result should be removed first."]}]},image:{ko:[{type:"p",text:"7가지 AI 모델에서 텍스트 프롬프트와 선택적인 레퍼런스 이미지를 이용해 이미지를 생성하고 결과를 비교·관리합니다."},F("2026 사용자 가이드 기준 · 프롬프트는 필수이며 영어로 작성하면 더 정확한 결과를 얻을 수 있습니다.","✨"),{type:"h2",text:"빠른 시작"},{type:"ol",items:["왼쪽 사이드바 첫 번째 아이콘에서 Image Generator를 엽니다.","목적과 레퍼런스 장수에 맞는 모델을 선택합니다.","프롬프트를 입력하고 필요하면 점선 박스 아이콘으로 레퍼런스를 첨부합니다.","이미지 비율, 해상도, 생성 매수와 모델별 옵션을 설정합니다.","Generate를 누른 뒤 오른쪽에서 결과를 확인·다운로드합니다."]},{type:"h2",text:"1. 모델과 레퍼런스 제한"},$("7가지 모델",[{type:"ul",items:["Nano Banana 2: 범용적이고 텍스트 정확도가 높은 안정적인 모델 · 레퍼런스 최대 14장.","Nano Banana Pro: 더 높은 디테일과 품질 · 레퍼런스 최대 14장.","Kling Image O1: 독자적인 이미지 해석 스타일 · 레퍼런스 최대 10장.","Z Image: 레퍼런스 미지원, Negative Prompt 지원, 해상도 1K 전용.","Seedream 5.0 Lite: 감성적이고 부드러운 톤 · 레퍼런스 최대 14장.","Grok Imagine Image: 레퍼런스 1장.","Grok Imagine Pro: Grok Imagine 상위 모델 · 레퍼런스 최대 3장."]}]),{type:"h2",text:"2. 프롬프트와 레퍼런스"},{type:"ul",items:["Prompt는 필수입니다. 비어 있으면 Generate가 활성화되지 않으며, 이전 사용 기록이 있으면 마지막 프롬프트가 자동 적용될 수 있습니다.","프롬프트 왼쪽 점선 박스 아이콘으로 이미지를 첨부합니다. 레퍼런스는 선택 사항입니다.","첨부된 이미지는 @image1, @image2 형식으로 표시되므로 프롬프트에서 각 이미지를 명시적으로 참조할 수 있습니다.","Z Image에서는 Negative prompt에 blurry, extra fingers, watermark, text, low quality처럼 제외할 요소를 적을 수 있습니다."]},{type:"h2",text:"3. 출력 옵션"},$("비율 · 해상도 · 생성 매수",[{type:"ul",items:["비율: 16:9, 9:16, 1:1, 3:2, 2:3, 4:3, 3:4, 5:4, 4:5, 21:9, 4:1, 1:4 중 선택합니다.","해상도: 1K는 빠른 초안, 2K는 기본 권장, 4K는 인쇄·상업용 최고 품질에 적합합니다. Z Image는 1K만 지원합니다.","생성 매수: 한 번에 1장, 2장 또는 4장을 선택할 수 있습니다."]},F("모델마다 지원 비율과 해상도가 다릅니다. 모델을 바꾸면 지원 가능한 기본값으로 자동 조정될 수 있으니 모델 선택 후 다시 확인하세요.","⚠️")]),{type:"h2",text:"4. 생성과 결과 관리"},{type:"ol",items:["설정을 완료한 뒤 노란색 Generate를 누릅니다. 버튼에 표시된 크레딧이 사용됩니다.","생성이 끝나면 오른쪽에 결과와 사용한 프롬프트가 표시됩니다. 4장 생성 시 번호가 붙은 썸네일이 가로로 나열됩니다.","프롬프트 오른쪽 위 복사 아이콘으로 같은 문장을 다시 쓰거나 다른 모델에 옮길 수 있습니다.","썸네일을 누르면 전체 화면에서 좌우 이동, 확대·축소, 90° 회전을 사용할 수 있습니다.","결과 우측 하단 아이콘으로 새 창에서 열기, 다운로드, 삭제를 실행합니다."]}],en:[{type:"p",text:"Generate, compare, and manage images across seven AI models using text prompts and optional reference images."},F("Based on the 2026 user guide · A prompt is required, and writing it in English can improve accuracy.","✨"),{type:"h2",text:"Quick start"},{type:"ol",items:["Open Image Generator from the first icon in the left sidebar.","Choose a model based on the goal and number of references.","Enter a prompt and optionally attach references with the dotted-box icon.","Set aspect ratio, resolution, image count, and any model-specific option.","Press Generate, then review and download results on the right."]},{type:"h2",text:"1. Models and reference limits"},$("Seven models",[{type:"ul",items:["Nano Banana 2: stable general model with strong text accuracy · up to 14 references.","Nano Banana Pro: higher detail and quality · up to 14 references.","Kling Image O1: distinctive image interpretation · up to 10 references.","Z Image: no references, supports Negative Prompt, and limited to 1K.","Seedream 5.0 Lite: emotional, soft tone · up to 14 references.","Grok Imagine Image: 1 reference.","Grok Imagine Pro: upper-tier Grok Imagine model · up to 3 references."]}]),{type:"h2",text:"2. Prompt and references"},{type:"ul",items:["Prompt is required; Generate stays disabled when it is empty. Your last prompt may be restored automatically.","Attach optional images with the dotted-box icon to the left of Prompt.","Attached files appear as @image1, @image2, and so on, allowing explicit references inside the prompt.","With Z Image, list unwanted elements under Negative prompt—for example: blurry, extra fingers, watermark, text, low quality."]},{type:"h2",text:"3. Output options"},$("Ratio · resolution · image count",[{type:"ul",items:["Ratio: choose 16:9, 9:16, 1:1, 3:2, 2:3, 4:3, 3:4, 5:4, 4:5, 21:9, 4:1, or 1:4.","Resolution: 1K for fast drafts, 2K as the recommended default, or 4K for print and commercial quality. Z Image supports only 1K.","Image count: generate 1, 2, or 4 images at once."]},F("Supported ratios and resolutions vary by model. Changing models can reset an unsupported value, so verify options again after model selection.","⚠️")]),{type:"h2",text:"4. Generate and manage results"},{type:"ol",items:["Complete the settings and press the yellow Generate button. The displayed credits are consumed.","Results and their prompts appear on the right. With four images, numbered thumbnails are arranged horizontally.","Use the copy icon at the upper-right of a result prompt to reuse it here or in another model.","Press a thumbnail for fullscreen navigation, zoom, and 90° rotation.","Use the icons at the lower-right of a result to open it in a new window, download it, or delete it."]}]},upscale:{ko:[{type:"p",text:"저해상도이거나 흐릿한 사진·AI 이미지·제품 컷·인물 컷을 2X 또는 4X로 확대하고 디테일을 보강하는 마무리 도구입니다."},F("2026 사용자 가이드 기준 · Upscaler의 흐름은 모델 선택 → 이미지 업로드 → 옵션 설정 → Generate입니다.","🔎"),{type:"h2",text:"빠른 시작"},{type:"ol",items:["왼쪽 사이드바에서 Upscaler를 엽니다.","Models에서 Topaz 또는 Xconda를 선택합니다.","Drop Image Here / Click to Upload에 원본을 넣습니다.","2X 또는 4X와 필요한 보정 옵션을 설정합니다.","Generate를 누르고 확인 팝업에서 OK를 선택합니다.","Latest Result에서 결과를 확인하고 다운로드합니다."]},{type:"h2",text:"1. 모델 선택"},{type:"ul",items:["Topaz: 배율, Enhance Model, Subject Detection, Output Format, Face Enhancement, Creativity를 세밀하게 조절할 수 있습니다.","Xconda: 자체 학습 모델로 옵션이 단순하며 빠른 결과를 우선할 때 적합합니다."]},{type:"h2",text:"2. 배율과 Topaz 옵션"},$("2X / 4X",[{type:"ul",items:["2X: 웹 미리보기와 빠르고 가벼운 작업에 적합합니다.","4X: 더 많은 시간·크레딧이 들지만 큰 화면과 고해상도 납품에 적합합니다."]}]),$("Enhance Model",[{type:"ul",items:["Standard V2 / High Fidelity V2: 일반 사진과 원본 충실도가 중요한 작업.","Low Resolution V2: 작은 저해상도 원본.","CGI: 일러스트와 3D 렌더.","Text Refine: 글자 디테일이 중요한 이미지."]}]),$("Subject Detection · Output Format",[{type:"ul",items:["Foreground는 배경과 분리된 인물이나 제품을 전경 피사체 중심으로 보정할 때 안정적입니다.","JPG는 가벼운 공유·미리보기, PNG는 투명도·합성·후편집에 적합합니다."]}]),$("Face Enhancement · Creativity",[{type:"ul",items:["Face Enhancement는 눈·코·입·피부·윤곽을 보강합니다. 너무 높으면 인공적으로 보일 수 있으므로 중간값에서 시작하세요.","Creativity가 낮으면 원본을 유지하고, 높으면 질감과 디테일을 더 적극적으로 재해석합니다. 얼굴은 낮음~중간이 안전합니다."]}]),{type:"h2",text:"3. 생성과 결과 관리"},{type:"ol",items:["Generate 오른쪽의 예상 크레딧을 확인합니다. 매뉴얼 예시에는 8 credits가 표시되지만 옵션에 따라 달라질 수 있습니다.","Generate를 누른 뒤 ‘Would you like to generate an image?’ 팝업에서 OK를 선택합니다.","완료된 이미지는 오른쪽 Latest Result에 표시됩니다.","Download 아이콘으로 저장하고 Delete로 필요 없는 결과를 정리합니다.","하단 History에서 이전 결과를 다시 열어 시안을 비교합니다."]},F("얼굴 보정은 정면에 가깝고 얼굴이 충분히 크게 보이는 원본에서 가장 안정적입니다. 원본 느낌을 지키려면 Face Enhancement와 Creativity를 한 번에 높이지 마세요.")],en:[{type:"p",text:"A finishing tool that scales low-resolution or blurry photos, AI images, product shots, and portraits by 2X or 4X while restoring detail."},F("Based on the 2026 user guide · The Upscaler flow is model → upload → options → Generate.","🔎"),{type:"h2",text:"Quick start"},{type:"ol",items:["Open Upscaler from the left sidebar.","Choose Topaz or Xconda under Models.","Add the source under Drop Image Here / Click to Upload.","Choose 2X or 4X and configure the correction options you need.","Press Generate and confirm with OK.","Review and download the output under Latest Result."]},{type:"h2",text:"1. Choose a model"},{type:"ul",items:["Topaz: fine control over scale, Enhance Model, Subject Detection, Output Format, Face Enhancement, and Creativity.","Xconda: a simpler in-house model suited to fast, one-click results."]},{type:"h2",text:"2. Scale and Topaz options"},$("2X / 4X",[{type:"ul",items:["2X: lighter and faster, suited to web previews.","4X: takes more time and credits but suits large screens and high-resolution delivery."]}]),$("Enhance Model",[{type:"ul",items:["Standard V2 / High Fidelity V2: general photos and source-faithful work.","Low Resolution V2: small, low-resolution sources.","CGI: illustration and 3D renders.","Text Refine: images where lettering detail matters."]}]),$("Subject Detection · Output Format",[{type:"ul",items:["Foreground reliably centers correction on a person or product clearly separated from the background.","Use JPG for lightweight sharing and previews; PNG for transparency, compositing, and further editing."]}]),$("Face Enhancement · Creativity",[{type:"ul",items:["Face Enhancement restores eyes, nose, mouth, skin, and contours. Start in the middle range—too high can look artificial.","Low Creativity preserves the source; high values reconstruct texture more aggressively. Low-to-middle is safest for faces."]}]),{type:"h2",text:"3. Generate and manage results"},{type:"ol",items:["Check the estimated credits next to Generate. The manual example shows 8 credits, but the cost varies by options.","Press Generate, then OK in the “Would you like to generate an image?” dialog.","The finished image appears under Latest Result on the right.","Save it with Download and remove unwanted outputs with Delete.","Reopen previous generations in History to compare versions."]},F("Face correction is most reliable when the face is near-frontal and clearly visible. To preserve the original look, avoid raising Face Enhancement and Creativity aggressively at the same time.")]},video:{ko:[{type:"p",text:"텍스트와 이미지에서 영상을 만드는 도구입니다. Veo·Runway·Kling·Grok·Vidu·Seedance 등 다중 비디오 엔진을 한 화면에서 사용합니다."},F("2026 사용자 가이드 기준 · 제공 모델: Veo 3.1 / Veo 3.1 Fast, Runway Gen-4.5, Kling 3.0 Pro / Kling OMNI, Grok Imagine Video, Vidu Q3, Seedance 2.0 / Seedance 2.0 Fast (업데이트: 2026-04-28)","🧭"),{type:"h2",text:"빠른 시작"},{type:"ol",items:["상단 Tools 메뉴 → 사이드바 2번째 아이콘으로 Video Generator를 엽니다.","Models 드롭다운에서 비디오 엔진을 선택합니다.","Text to video 또는 Image to video 탭을 선택해 입력을 준비합니다.","해상도(480p / 720p / 1080p)·길이·비율을 설정하고 Generate를 누릅니다.","결과 목록에서 미리보기 후 저장 아이콘으로 다운로드합니다."]},{type:"h2",text:"1. Text to video"},{type:"ul",items:["Prompt에 생성할 장면을 텍스트로 입력합니다. 장면 → 행동 → 카메라/조명 순서로 쓰면 안정적입니다.","해상도·영상 길이·화면 비율은 모델별로 지원 범위가 다릅니다.","Negative Prompt에는 결과물에서 제외할 요소를 입력합니다."]},{type:"h2",text:"2. Image to video"},{type:"ul",items:["Start frame에 첫 장면, End frame에 마지막 장면 이미지를 업로드하면 그 사이를 AI가 자연스럽게 이어 줍니다.","Reference Mode(Seedance 2.0 전용): Frame은 이미지를 시작/끝 프레임으로 직접 사용, Reference는 스타일·분위기·구도만 참고합니다.","Start/End는 같은 카메라 톤·구도·인물 표정의 이미지를 쓰면 한 시퀀스처럼 이어집니다."]},{type:"h2",text:"3. 멀티샷과 생성"},{type:"ul",items:["Multi-Shot은 Kling 3.0 Pro / Kling OMNI 전용 기능으로, 한 편을 여러 컷으로 나눠 생성합니다.","Shots 영역에서 샷별 길이(초)를 설정하고 + Add Shot으로 샷을 추가합니다. 총 길이는 최대 15초입니다.","1회 생성당 50 크레딧, 멀티샷 기준 180 크레딧이 소모됩니다."]},F("모델별 강점이 다릅니다 — Veo 3.1은 Audio Sync, Seedance는 Reference Mode, Kling은 Multi-Shot. 작업 목적에 맞춰 모델을 먼저 고르세요."),{type:"h2",text:"결과 관리"},{type:"ul",items:["결과 우측에서 Date / Resolution / Aspect Ratio / Duration / Model 정보를 확인합니다.","재생 버튼으로 미리보기, 영상 클릭으로 전체화면 확대가 가능합니다.","영상 위에 마우스를 올리면 저장·삭제·공유 아이콘이 나타납니다."]}],en:[{type:"p",text:"Create videos from text and images. Use multiple video engines — Veo, Runway, Kling, Grok, Vidu, and Seedance — from a single screen."},F("Based on the 2026 user guide · Available models: Veo 3.1 / Veo 3.1 Fast, Runway Gen-4.5, Kling 3.0 Pro / Kling OMNI, Grok Imagine Video, Vidu Q3, Seedance 2.0 / Seedance 2.0 Fast (updated 2026-04-28)","🧭"),{type:"h2",text:"Quick start"},{type:"ol",items:["Open Video Generator from the Tools menu — the second icon in the sidebar.","Pick a video engine from the Models dropdown.","Choose the Text to video or Image to video tab.","Set resolution (480p / 720p / 1080p), duration, and aspect ratio, then press Generate.","Preview results in the list and download with the save icon."]},{type:"h2",text:"1. Text to video"},{type:"ul",items:["Describe the scene in the Prompt field. Writing scene → action → camera/lighting in order gives stable results.","Supported resolution, duration, and aspect ratios vary by model.","Use Negative Prompt to explicitly exclude unwanted elements."]},{type:"h2",text:"2. Image to video"},{type:"ul",items:["Upload the opening image as the Start frame and the closing image as the End frame; the AI fills in the motion between them.","Reference Mode (Seedance 2.0 only): Frame uses images directly as start/end frames, while Reference only borrows style, mood, and composition.","Use start/end images with matching camera tone, framing, and expressions so they cut together as one sequence."]},{type:"h2",text:"3. Multi-shot and generation"},{type:"ul",items:["Multi-Shot is exclusive to Kling 3.0 Pro / Kling OMNI and splits one video into several cuts.","Set each shot's length (seconds) in the Shots area and press + Add Shot to add more. Total length is capped at 15 seconds.","Each generation costs 50 credits (180 credits for multi-shot)."]},F("Each model has different strengths — Veo 3.1 offers Audio Sync, Seedance has Reference Mode, Kling supports Multi-Shot. Pick the model for the job first."),{type:"h2",text:"Managing results"},{type:"ul",items:["Check Date / Resolution / Aspect Ratio / Duration / Model on the right side of each result.","Use the play button to preview and click the video for fullscreen.","Hover over a video to reveal save, delete, and share icons."]}]},"auto-angle":{ko:[{type:"p",text:"1장의 이미지로 최대 34가지 카메라 앵글을 자동 생성합니다. 촬영 장소·장비·인력 없이 다양한 앵글의 상품/인물 이미지를 확보할 수 있습니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["정면 1장만 촬영한 상품을 탑뷰·로우앵글·사이드뷰 등으로 확장할 때","쇼핑몰 상세페이지에 여러 앵글의 상품 이미지를 빠르게 채울 때","룩북·포트폴리오를 다양한 시점으로 구성할 때","촬영 전 앵글별 시안을 미리 확인하고 싶을 때"]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 사이드바 5번째(각도 표시 삼각형) 아이콘을 클릭합니다.","Drop Image Here / Click to Upload 영역에 원본 이미지를 업로드합니다.","생성할 카메라 앵글 버튼을 선택합니다(선택 시 노란색). Select All / Deselect All로 일괄 선택·해제할 수 있습니다.","하단의 노란색 Generate Angles 버튼을 클릭합니다.","오른쪽 결과 영역에서 앵글 이름과 함께 결과를 확인합니다."]},$("원본 이미지 체크리스트",[{type:"ul",items:["단순한 배경 — 흰색/단색 또는 깔끔한 스튜디오 배경일수록 정확합니다.","중앙 배치 — 잘리거나 치우친 피사체는 변환 시 왜곡될 수 있습니다.","높은 해상도 — 저해상도 원본은 디테일이 떨어집니다.","정면 촬영 — 극단적 앵글의 원본은 부자연스러울 수 있습니다.","단일 피사체 — 피사체가 겹치거나 손·팔이 복잡하게 교차되면 품질이 저하됩니다."]}]),F("앵글은 Eye Level·High/Low Angle·Aerial·Top View·Close Up·Side Profile·Over-the-Shoulder·POV·Dutch Angle·Silhouette 등 34종을 지원합니다.","📐"),{type:"h2",text:"결과 관리"},{type:"ul",items:["결과 이미지를 클릭하면 상세 보기가 열리며 확대·축소·화면 맞춤·회전이 가능합니다.","결과에 마우스를 올리면 개별 다운로드·삭제 아이콘이 나타납니다."]}],en:[{type:"p",text:"Automatically generate up to 34 camera angles from a single image — multi-angle product or portrait shots without a set, gear, or crew."},{type:"h2",text:"When to use it"},{type:"ul",items:["Expand a single front-facing product shot into top view, low angle, side view, and more","Quickly fill e-commerce detail pages with multi-angle product images","Build lookbooks and portfolios from one image across many viewpoints","Preview per-angle drafts before an actual shoot"]},{type:"h2",text:"How to use"},{type:"ol",items:["Click the 5th sidebar icon (a triangle with an angle mark).","Upload the source image via Drop Image Here / Click to Upload.","Select the camera angles to generate (selected buttons turn yellow). Use Select All / Deselect All for bulk selection.","Press the yellow Generate Angles button at the bottom.","Review results on the right, each labeled with its angle name."]},$("Source image checklist",[{type:"ul",items:["Simple background — white/solid or clean studio backdrops convert most accurately.","Centered subject — cropped or off-center subjects can distort.","High resolution — low-res sources lose detail.","Front-facing — extreme source angles can look unnatural.","Single subject — overlapping subjects or crossed hands/arms reduce quality."]}]),F("34 angles are supported, including Eye Level, High/Low Angle, Aerial, Top View, Close Up, Side Profile, Over-the-Shoulder, POV, Dutch Angle, and Silhouette.","📐"),{type:"h2",text:"Managing results"},{type:"ul",items:["Click a result to open detail view with zoom, fit-to-screen, and rotation.","Hover over a result to download or delete it individually."]}]},"background-blend":{ko:[{type:"p",text:"인물 사진과 배경 이미지를 AI가 자연스럽게 합성해 시네마틱 스틸 이미지를 만듭니다. 조명·색감·그림자를 자동으로 매칭하고, 인물의 얼굴·피부톤·헤어스타일·의상은 원본 기준으로 보존됩니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["모델을 특정 배경에 배치한 제품/브랜드 광고 이미지가 필요할 때","촬영 전 클라이언트에게 시각적 초안(컨셉 프레젠테이션)을 보여줄 때","다양한 배경의 인물 이미지를 빠르게 만드는 SNS/마케팅 콘텐츠","스토리보드·무드보드용 합성 이미지가 필요한 영상 프리프로덕션"]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 사이드바 6번째(풍경+반짝임) 아이콘을 클릭합니다.","Upload person Image에 인물 이미지를 업로드합니다.","Upload Background Image에 배경 이미지를 업로드합니다.","Prompt에 상황·조명·카메라 느낌을 입력합니다. (최대 2,500자)","노란색 Generate 버튼 → 확인 창에서 OK를 누르면 생성이 시작됩니다."]},$("프롬프트 작성 원칙",[{type:"ul",items:["인물의 포즈/동작 + 조명 방향/분위기 + 카메라 느낌을 구체적으로 서술합니다.","좋은 예: “Standing by the window, rim lighting, emotional expression”","피해야 할 예: “합성해줘”, “예쁘게” — 시각적으로 특정되지 않는 지시는 해석되지 않습니다."]}]),F("인물 이미지는 배경이 없거나 단색 배경인 사진일수록 합성 정확도가 높습니다."),{type:"h2",text:"결과 관리"},{type:"ul",items:["결과 카드에는 합성 이미지와 프롬프트가 함께 표시됩니다.","카드 아이콘: 공유(클립보드 복사) · 재실행 · 삭제. 마우스를 올리면 다운로드·프롬프트 수정·삭제도 가능합니다.","이미지를 클릭하면 상세 보기에서 확대·축소·화면 맞춤·회전을 할 수 있습니다."]}],en:[{type:"p",text:"Blend a person photo with a background image into a cinematic still. The AI matches lighting, color, and shadows automatically while preserving the subject's face, skin tone, hairstyle, and wardrobe."},{type:"h2",text:"When to use it"},{type:"ul",items:["Product/brand ads that place a model in a specific location","Concept presentations — visual drafts for clients before a shoot","SNS/marketing content that needs people across many backdrops fast","Video pre-production composites for storyboards and mood boards"]},{type:"h2",text:"How to use"},{type:"ol",items:["Click the 6th sidebar icon (landscape with sparkles).","Upload the subject under Upload person Image.","Upload the backdrop under Upload Background Image.","Describe the situation, lighting, and camera feel in the Prompt (up to 2,500 characters).","Press the yellow Generate button and confirm with OK."]},$("Prompt principles",[{type:"ul",items:["Be specific about pose/action + lighting direction/mood + camera feel.","Good: “Standing by the window, rim lighting, emotional expression”","Avoid: “blend this”, “make it pretty” — instructions that aren't visually specific can't be interpreted."]}]),F("Person photos with no background or a solid-color background blend most accurately."),{type:"h2",text:"Managing results"},{type:"ul",items:["Result cards show the composite image together with its prompt.","Card icons: share (copies a link), rerun, delete. Hovering also reveals download, prompt editing, and delete.","Click an image for detail view with zoom, fit-to-screen, and rotation."]}]},expression:{ko:[{type:"p",text:"이미지 속 인물의 표정을 자유롭게 바꿉니다. 원본 인물성은 유지하면서 미소·놀람·진지함 같은 감정만 바꿔, 같은 인물의 표정 후보를 빠르게 생성·비교합니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["촬영 없이 같은 인물의 표정 후보(미소·놀람·진지함)를 비교할 때","광고·썸네일·상세페이지·콘티처럼 감정 표현이 중요한 작업","촬영 전 표정 방향을 제안하거나 클라이언트와 시안을 비교할 때"]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 사이드바의 웃는 얼굴 아이콘을 클릭합니다.","Drop Image Here / Click to Upload로 원본 이미지를 업로드합니다.","Prompt에 바꾸고 싶은 표정을 입력합니다. 예: gentle smile, surprised expression, serious cinematic expression.","필요하면 Camera 옵션(View · Shot Size · Angle)을 설정합니다 — 모두 선택 사항입니다.","Generate(1회 6 크레딧) → 확인 팝업에서 OK를 누르면 진행률과 함께 생성됩니다."]},$("Camera 옵션 3가지",[{type:"ul",items:["Camera View / Position: Front View · 3/4 View · Profile View 등 인물이 카메라를 바라보는 방향.","Shot Size / Distance: Wide · Medium · Close-Up. 표정 강조는 Close-Up, 의상·포즈 확인은 Medium 계열.","Camera Angle / Height: Eye Level · Low Angle · High Angle. Eye Level은 자연스럽고 Low Angle은 인물을 강하게 보이게 합니다."]}]),F("같은 인물·의상을 유지하려면 프롬프트에 preserve identity, preserve clothing을 함께 적으세요.","🔒"),F("표정·시선·구도·조명을 한 번에 너무 많이 바꾸면 인물성이 약해집니다. 먼저 표정만 테스트하고 필요할 때 카메라 옵션을 더하는 방식이 안정적입니다."),{type:"h2",text:"결과 관리"},{type:"ul",items:["결과 영역에 표정 이미지가 카드로 쌓여 같은 원본의 표정 후보를 한 화면에서 비교할 수 있습니다.","하단 다운로드 아이콘으로 저장, 휴지통 아이콘으로 정리합니다."]}],en:[{type:"p",text:"Freely change a subject's facial expression. Identity stays intact while only the emotion changes — generate and compare smile, surprise, or serious variants of the same person in minutes."},{type:"h2",text:"When to use it"},{type:"ul",items:["Compare expression candidates (smile, surprise, seriousness) without a shoot","Work where emotion matters: ads, thumbnails, detail pages, storyboards","Propose expression directions before a shoot or compare drafts with clients"]},{type:"h2",text:"How to use"},{type:"ol",items:["Click the smiling-face icon in the left sidebar.","Upload the source image via Drop Image Here / Click to Upload.","Describe the target expression in the Prompt — e.g. gentle smile, surprised expression, serious cinematic expression.","Optionally set the Camera options (View · Shot Size · Angle) — all optional.","Press Generate (6 credits per run) and confirm with OK; progress is shown as a percentage."]},$("The three camera options",[{type:"ul",items:["Camera View / Position: Front View, 3/4 View, Profile View — the direction the subject faces.","Shot Size / Distance: Wide, Medium, Close-Up. Close-Up emphasizes expression; Medium shows wardrobe and pose.","Camera Angle / Height: Eye Level, Low Angle, High Angle. Eye Level reads natural; Low Angle makes the subject look stronger."]}]),F("To keep the same person and outfit, add preserve identity and preserve clothing to your prompt.","🔒"),F("Changing expression, gaze, framing, and lighting all at once weakens identity. Test the expression first, then add camera options as needed."),{type:"h2",text:"Managing results"},{type:"ul",items:["Results stack as cards so you can compare expression candidates from the same source side by side.","Download with the bottom icon; tidy up with the trash icon."]}]},"scene-snap":{ko:[{type:"p",text:"레퍼런스 이미지 한 장을 AI가 분석해 시네마틱 스토리보드 컷으로 확장합니다. 각 컷은 이미지와 장면 설명, 카메라·렌즈 정보가 담긴 키프레임 카드로 생성됩니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["한 장의 분위기 컷을 영상 콘티 흐름으로 빠르게 확장할 때","광고·브랜드 필름·숏폼·프리비즈처럼 장면 흐름을 먼저 보여줘야 할 때","시작·디테일·감정·마무리 컷을 카메라·렌즈 정보와 함께 연출 회의 자료로 쓸 때"]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 사이드바에서 필름 프레임 모양의 SceneSnap 아이콘을 클릭합니다.","Drop Image Here / Click to Upload로 분석할 장면 이미지를 업로드합니다.","Generate(1회 63 크레딧)를 누르고 확인 팝업에서 OK를 클릭합니다.","진행 중 일부 카드가 먼저 나타나고, 완료에 가까워질수록 키프레임이 채워집니다."]},$("좋은 레퍼런스 고르기",[{type:"ul",items:["공간·인물·조명·오브젝트가 잘 보이는 이미지일수록 결과가 구체적입니다.","인물의 위치, 움직일 수 있는 공간, 시선이 갈 오브젝트가 보이면 장면 흐름을 만들기 쉽습니다."]}]),{type:"h2",text:"키프레임 카드 읽기"},{type:"ul",items:["각 카드에는 KF 번호·숏 라벨(Medium Full Shot, Close-up 등)·SCENE 번호와 장면 설명이 담깁니다.","CAMERA에는 Eye-level·Static·Dolly shot 같은 촬영 정보, LENS에는 35mm·50mm·85mm 등 렌즈 값이 함께 제안됩니다.","결과가 많으면 오른쪽 결과 패널 내부를 스크롤해 전체 키프레임을 확인합니다."]},{type:"h2",text:"저장과 활용"},{type:"ul",items:["Download All로 전체 저장, 카드별 다운로드 아이콘으로 좋은 컷만 선택 저장할 수 있습니다.","결과는 시작 컷 → 오브젝트 디테일 → 감정 클로즈업 → 마무리 컷 흐름으로 제안됩니다."]},F("SceneSnap 결과는 최종본이 아니라 콘티 초안으로 보는 것이 좋습니다. 좋은 컷은 저장하고 장면 설명·카메라 정보를 바탕으로 연출안을 다듬으세요.")],en:[{type:"p",text:"Analyze a single reference image and expand it into cinematic storyboard cuts. Each cut becomes a keyframe card with an image, scene description, and camera/lens info."},{type:"h2",text:"When to use it"},{type:"ul",items:["Quickly expand one mood frame into a video continuity flow","Show scene flow first for ads, brand films, short-form, or previz","Bring opening/detail/emotion/closing cuts with camera and lens data to direction meetings"]},{type:"h2",text:"How to use"},{type:"ol",items:["Click the film-frame SceneSnap icon in the left sidebar.","Upload the scene image via Drop Image Here / Click to Upload.","Press Generate (63 credits per run) and confirm with OK.","Some cards appear early during generation; keyframes fill in as it completes."]},$("Choosing a good reference",[{type:"ul",items:["Images with clear space, subjects, lighting, and objects produce more specific results.","Visible subject placement, room to move, and eye-catching objects make scene flows easier to build."]}]),{type:"h2",text:"Reading keyframe cards"},{type:"ul",items:["Each card carries a KF number, shot label (Medium Full Shot, Close-up…), SCENE number, and description.","CAMERA suggests shooting info like Eye-level, Static, or Dolly shot; LENS proposes values like 35mm, 50mm, 85mm.","With many results, scroll inside the right panel to see every keyframe."]},{type:"h2",text:"Saving and using results"},{type:"ul",items:["Download All saves everything; per-card icons save only the keepers.","Results follow an opening cut → object detail → emotional close-up → closing cut flow."]},F("Treat SceneSnap output as a storyboard draft, not a final. Save the good cuts and refine your direction from the scene descriptions and camera data.")]},"cloth-swap":{ko:[{type:"p",text:"원본 인물의 옷 영역을 브러시로 지정하고 참조 의상의 스타일로 교체합니다. 얼굴·포즈·배경은 그대로 두고 의상의 색상·형태·분위기만 빠르게 바꿉니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["브랜드 룩북 — 같은 모델에 시즌 의상 라인업을 입혀 일관된 톤의 시안 구성","패션 광고/커머스 — 착용 컷을 컬러·실루엣 옵션별로 시뮬레이션","캐릭터 의상 콘셉트 — 동일 인물·동일 포즈에서 의상 시안 비교","샘플 제작 전 착용 시안 검토, 기존 자산 리스타일링"]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 세로 메뉴에서 티셔츠 모양 아이콘을 클릭합니다.","Source Image에 옷을 바꿀 원본 이미지를 업로드합니다.","Brush Size를 조절하며 바꿀 옷 영역을 칠합니다 — 칠한 영역만 교체됩니다.","Reference Clothing에 새로 적용할 의상 이미지를 업로드합니다.","Generate(1회 6 크레딧) → 확인 팝업에서 OK를 누릅니다."]},$("마스크(옷 영역) 지정 요령",[{type:"ul",items:["옷 본체뿐 아니라 옷깃·소매 끝·밑단까지 포함해 칠하세요. 빠뜨린 부분은 원본 의상이 남을 수 있습니다.","얼굴·손·헤어·배경은 칠하지 않습니다 — 인물 형태가 변형될 수 있습니다.","큰 브러시로 안쪽을 빠르게 채우고, 작은 브러시로 외곽선을 다듬는 2단계 칠하기가 가장 효율적입니다."]}]),$("입력 이미지 권장 조건",[{type:"ul",items:["원본: 옷 전체가 잘 보이고 팔과 몸의 경계가 뚜렷한 이미지. 정면·전신·균일한 조명·단색 배경이 가장 안정적입니다.","참조 의상: 마네킹·평면 컷처럼 의상이 단독으로 잘 보이는 이미지 권장. 의상 외 요소가 많으면 의도치 않은 디테일이 섞일 수 있습니다."]}]),{type:"h2",text:"결과 확인과 관리"},{type:"ul",items:["결과는 얼굴·포즈를 유지한 채 참조 의상의 색·실루엣·디테일을 반영합니다. 100% 동일하지 않을 수 있으니 여러 번 생성해 비교하세요.","최종 사용 전 옷 경계·소매·목 주변·가방끈 같은 겹침 요소를 확인하고, 어색하면 마스크를 조정해 재생성합니다.","결과 카드는 아래로 누적되어 시안 비교가 쉽습니다. 채택할 카드만 다운로드하고 나머지는 삭제하세요."]},F("Source Image·브러시 영역·Reference Clothing 세 가지가 모두 준비되어야 Generate가 활성화됩니다.","⚠️")],en:[{type:"p",text:"Paint the clothing area on a source portrait and swap it to the style of a reference garment. Face, pose, and background stay intact — only the outfit's color, shape, and mood change."},{type:"h2",text:"When to use it"},{type:"ul",items:["Brand lookbooks — dress one model in a seasonal lineup with a consistent tone","Fashion ads/commerce — simulate worn shots across color and silhouette options","Character wardrobe concepts — compare outfits on the same person and pose","Pre-sample wear checks and restyling of existing assets"]},{type:"h2",text:"How to use"},{type:"ol",items:["Click the t-shirt icon in the left sidebar.","Upload the source portrait under Source Image.","Adjust Brush Size and paint the clothing to replace — only painted areas change.","Upload the new garment under Reference Clothing.","Press Generate (6 credits per run) and confirm with OK."]},$("Masking tips",[{type:"ul",items:["Cover the whole garment including collar, cuffs, and hem — missed spots keep the original clothing.","Never paint the face, hands, hair, or background — the figure can deform.","Fastest workflow: fill the interior with a large brush, then refine edges with a small one."]}]),$("Recommended inputs",[{type:"ul",items:["Source: garment fully visible with clear arm/body separation. Front-facing, full-body, even lighting, and plain backgrounds are most stable.","Reference garment: standalone shots (mannequin or flat-lay) work best; busy images can leak unintended details."]}]),{type:"h2",text:"Reviewing and managing results"},{type:"ul",items:["Results keep the face and pose while applying the reference's color, silhouette, and detail. It may not match 100% — generate a few and compare.","Before final use, check garment edges, sleeves, neckline, and overlapping items like bag straps; adjust the mask and regenerate if needed.","Result cards stack for easy comparison — download the keepers, delete the rest."]},F("Generate activates only when Source Image, brush mask, and Reference Clothing are all in place.","⚠️")]},"youtube-ref":{ko:[{type:"p",text:"YouTube 레퍼런스 영상 링크만 입력하면 AI가 영상을 분석해 9씬 스토리보드를 자동 생성합니다. 영상의 색감·조명·구도 등 시각적 톤앤무드를 기반으로 이미지를 만듭니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["클라이언트가 보낸 레퍼런스 영상의 시각적 톤·구도·색감을 빠르게 파악할 때","영상 기획 단계에서 방향성을 잡아 팀원과 공유할 때","촬영/제작 전 전체 흐름을 시각적으로 확인하는 스토리보드 초안","경쟁 브랜드 광고 영상의 구성·연출 패턴 분석"]},F("원본 영상의 실제 콘텐츠 맥락까지 정확하게 반영하지는 않습니다. 시각적 톤과 무드 중심의 참고용으로 활용하세요.","⚠️"),{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 사이드바 12번째 클랩보드 모양 아이콘을 클릭합니다.","YouTube URL 빈칸에 참고할 영상 링크를 입력합니다. 인식되면 썸네일과 제목이 표시됩니다.","(선택) Character References에 Body/Outfit·Face Detail 이미지를 업로드하면 스토리보드에 해당 캐릭터가 반영됩니다.","노란색 Generate 버튼 → 확인 창에서 OK를 클릭합니다.","SCENE 01~09 그리드가 생성되면 각 장면의 이미지와 설명을 확인합니다."]},$("씬 수정(Regenerate) 프롬프트 팁",[{type:"ul",items:["장소 + 상황 + 분위기를 구체적으로 서술하세요. 예: “도심 거리에서 비 오는 밤, 네온 사인 조명”.","피해야 할 표현: “실내”, “밖에서”, “좋은 분위기” — 시각적으로 특정되지 않는 추상 표현은 해석되지 않습니다."]}]),{type:"h2",text:"수정과 다운로드"},{type:"ul",items:["장면 이미지를 클릭하면 상세 보기로 확대되고, Esc 또는 닫기 아이콘으로 닫습니다.","장면 오른쪽 연필 아이콘 → 설명 수정 → Regenerate로 해당 장면만 다시 생성합니다.","Download All로 9개 장면 전체, 개별 다운로드 아이콘으로 장면별 저장이 가능합니다."]}],en:[{type:"p",text:"Paste a YouTube reference link and the AI analyzes the video to auto-generate a 9-scene storyboard, built from the video's visual tone — color, lighting, and composition."},{type:"h2",text:"When to use it"},{type:"ul",items:["Quickly read the visual tone, framing, and palette of a client's reference video","Set direction in planning and share it with the team","Draft storyboards to check the full flow before shooting","Analyze competitor ads for structure and direction patterns"]},F("It doesn't reproduce the original video's actual content context. Use it as a visual tone & mood reference.","⚠️"),{type:"h2",text:"How to use"},{type:"ol",items:["Click the 12th sidebar icon (clapperboard).","Paste the video link into the YouTube URL field — the thumbnail and title appear once recognized.","(Optional) Upload Body/Outfit and Face Detail images under Character References to cast that character in the storyboard.","Press the yellow Generate button and confirm with OK.","Review the SCENE 01–09 grid; each scene includes an image and description."]},$("Prompt tips for scene regeneration",[{type:"ul",items:["Describe place + situation + mood concretely, e.g. “rainy night on a downtown street, neon sign lighting”.","Avoid vague terms like “indoors”, “outside”, “nice vibe” — abstractions can't be interpreted visually."]}]),{type:"h2",text:"Editing and download"},{type:"ul",items:["Click a scene to zoom into detail view; close with Esc or the close icon.","Pencil icon → edit the description → Regenerate re-creates only that scene.","Download All saves all nine scenes; per-scene icons save individually."]}]},"spin-angle":{ko:[{type:"p",text:"한 장의 이미지 위에 원(Circle)으로 카메라 위치를, 화살표(Arrow)로 바라보는 방향을 표시하면, 같은 장면을 다른 시점에서 본 포토리얼 이미지를 생성합니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["스토리보드/콘티 — 한 장면을 로우·하이·측면 앵글로 빠르게 변환","광고 컷/인물 시안 — 정면·사선·측면 후보를 한 번에 만들어 비교","룩북 — 같은 의상·인물 컷을 다양한 앵글로 확장","영상 프리비즈 — 본촬영 전 카메라 위치 후보를 시각화","제품 시점 변경, 클라이언트 보고용 앵글 후보 정리"]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 세로 메뉴에서 원형 화살표 모양 아이콘을 클릭합니다.","Upload an image to get started 영역에 원본 이미지를 업로드합니다.","Circle 버튼 선택 → 이미지 위에 원을 그려 카메라가 놓일 위치를 표시합니다.","Arrow 버튼 선택 → 원에서 피사체 쪽으로 향하는 화살표를 그려 시선 방향을 지정합니다.","상단의 Circle = Camera, Arrow = Direction이 모두 초록 체크가 되면 Generate(1회 6 크레딧)를 누릅니다."]},$("도구 버튼 4가지",[{type:"ul",items:["Circle: 가상 카메라의 위치 표시. 피사체의 왼쪽·오른쪽·위·아래 어디에 두느냐로 결과 앵글이 달라집니다.","Arrow: 카메라가 바라보는 방향. 원이 “어디서”라면 화살표는 “무엇을 향해”입니다.","Clear: 그려진 원·화살표만 초기화합니다. 원본 이미지는 유지됩니다.","New Image: 원본 이미지를 교체합니다. 이전 표시는 초기화됩니다."]}]),F("피사체의 윤곽과 공간감이 분명한 이미지가 가장 안정적입니다. 과한 모션블러·심한 노이즈·복잡한 배경은 품질을 떨어뜨립니다."),{type:"h2",text:"결과 확인과 관리"},{type:"ul",items:["결과는 원본의 분위기·톤·색감을 유지한 채 표시한 위치·방향의 새 앵글로 생성됩니다.","100% 동일하지 않을 수 있으니 여러 번 생성해 가장 적합한 컷을 선택하세요.","최종 사용 전 얼굴·의상·배경 왜곡과 피사체의 방향감을 확인합니다.","결과 카드가 누적되어 앵글 후보를 비교할 수 있습니다. 채택 컷만 다운로드하고 나머지는 삭제하세요."]}],en:[{type:"p",text:"Draw a circle on an image to mark the camera position and an arrow for the viewing direction — the AI generates a photoreal image of the same scene from that new viewpoint."},{type:"h2",text:"When to use it"},{type:"ul",items:["Storyboards — convert one scene into low, high, or side angles fast","Ad/portrait drafts — build front, diagonal, and side candidates in one pass","Lookbooks — expand the same outfit and subject across angles","Previz — visualize camera position candidates before the shoot","Product viewpoint changes and angle decks for client reviews"]},{type:"h2",text:"How to use"},{type:"ol",items:["Click the circular-arrow icon in the left sidebar.","Upload a source image in the Upload an image to get started area.","Select Circle and draw a circle where the camera should sit.","Select Arrow and draw from the circle toward the subject to set the gaze direction.","When both Circle = Camera and Arrow = Direction show green checks, press Generate (6 credits per run)."]},$("The four tools",[{type:"ul",items:["Circle: virtual camera position. Placing it left/right/above/below the subject changes the resulting angle.","Arrow: the camera's viewing direction — the circle is “from where”, the arrow is “toward what”.","Clear: erases the circle and arrow only; the source image stays.","New Image: replaces the source image and resets previous marks."]}]),F("Images with clear subject outlines and spatial depth work best. Heavy motion blur, noise, or busy backgrounds reduce quality."),{type:"h2",text:"Reviewing and managing results"},{type:"ul",items:["Results keep the original mood, tone, and palette while adopting the marked position and direction.","Outputs may vary — generate several and pick the best cut.","Before final use, check face/wardrobe/background distortion and the subject's sense of direction.","Result cards stack for comparing angle candidates — download the keepers, delete the rest."]}]},"cine-grade":{ko:[{type:"p",text:"내 사진에 레퍼런스 영화 스틸의 컬러 그레이딩·대비·무드를 적용합니다. 구도와 피사체는 그대로 두고 색감과 분위기만 빠르게 바꿔봅니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["시네마틱 룩 — 영화 스틸 한 장으로 사진에 영화 같은 색감·대비 부여","광고 캠페인 톤 — 키비주얼의 색감을 다른 컷에도 통일감 있게 확장","룩북·SNS 피드의 무드 통일, 장르 톤(누아르·웜·콜드) 테스트","본 색보정 전 의사결정용 톤 후보 비교"]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 세로 메뉴에서 마법봉 모양 아이콘을 클릭합니다.","왼쪽 박스(Your Photo)에 색보정을 적용할 원본 사진을 업로드합니다.","오른쪽 박스(Reference Movie Still)에 색감 기준이 될 스타일 레퍼런스를 업로드합니다.","두 박스가 모두 채워지면 Generate(1회 6 크레딧)가 활성화됩니다 → 확인 팝업에서 OK."]},F("왼쪽은 “무엇을”, 오른쪽은 “어떤 톤으로” — AI는 왼쪽 사진의 피사체·구도·디테일을 유지하고 오른쪽 이미지의 컬러 무드·대비를 입힙니다.","🎨"),$("입력 이미지 권장 조건",[{type:"ul",items:["원본: 피사체와 배경이 또렷하고 노출이 안정적인 사진. 톤이 뭉개진 사진은 변화를 평가하기 어렵습니다.","레퍼런스: 웜·콜드·시네마틱·하이콘트라스트 등 색감 방향이 분명한 한 컷. 영화 스틸·광고 키비주얼·사진 작품 모두 가능합니다.","레퍼런스를 고를 때는 “가져가고 싶은 것이 색·조명·대비인지”를 기준으로 판단하세요."]}]),{type:"h2",text:"결과 확인과 관리"},{type:"ul",items:["결과는 피사체·구도를 유지한 채 레퍼런스의 조명 무드·컬러 톤·대비가 입혀집니다.","최종 사용 전 얼굴 톤·의상 색·배경 밝기·전체 대비 네 가지를 우선 확인하세요. 과하면 다른 레퍼런스로 재생성합니다.","레퍼런스를 바꿔가며 생성하면 톤 후보가 카드로 누적되어 비교가 쉽습니다. 마우스 호버로 다운로드·삭제할 수 있습니다."]}],en:[{type:"p",text:"Apply the color grading, contrast, and mood of a reference movie still to your own photo. Composition and subject stay the same — only the tone and atmosphere change."},{type:"h2",text:"When to use it"},{type:"ul",items:["Cinematic look — give a photo film-grade color and contrast from one still","Campaign tone — extend a key visual's palette across other shots","Unify lookbook or SNS feed moods; test genre tones (noir, warm, cold)","Build tone candidates for decisions before the real color grade"]},{type:"h2",text:"How to use"},{type:"ol",items:["Click the magic-wand icon in the left sidebar.","Upload the photo to edit in the left box (Your Photo).","Upload the style reference in the right box (Reference Movie Still).","Once both boxes are filled, Generate activates (6 credits per run) — confirm with OK."]},F("Left is “what”, right is “in which tone” — the AI keeps the left photo's subject, composition, and detail while applying the right image's color mood and contrast.","🎨"),$("Recommended inputs",[{type:"ul",items:["Photo: clear subject and stable exposure. Crushed or blown-out tones make changes hard to judge.","Reference: one image with a distinct color direction — warm, cold, cinematic, high-contrast. Movie stills, ad visuals, and photography all work.","Pick references by asking: is what I want to borrow the color, lighting, or contrast?"]}]),{type:"h2",text:"Reviewing and managing results"},{type:"ul",items:["Results keep the subject and framing while taking on the reference's lighting mood, palette, and contrast.","Before final use, check four things first: face tone, wardrobe color, background brightness, overall contrast. If it's too strong, regenerate with a different reference.","Swap references across runs to stack tone candidates as cards — hover to download or delete."]}]},"arw-view":{ko:[{type:"p",text:"이미지 위에 화살표 하나를 그으면 AI가 그 방향에서 바라본 시점을 생성합니다. 3D 모델링·렌더링·공간 지각 없이 직관적으로 카메라 앵글을 바꿉니다."},{type:"h2",text:"이럴 때 사용하세요"},{type:"ul",items:["제품 촬영 앵글 확장 — 정면 1장을 탑뷰·측면뷰·45도 앵글로","에어리얼 탑뷰 생성 — AI 이미지 생성의 약점인 항공뷰를 정확하게","스토리보드 앵글 다양화 — 동일 씬을 여러 카메라 앵글로","건축/인테리어 시점 변환, 배너·포스터·SNS용 광고 소재 변형"]},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 사이드바 15번째(오른쪽 화살표 모양) 아이콘을 클릭합니다.","Upload an image to get started 영역에 이미지를 업로드합니다.","이미지 위에서 마우스를 드래그해 화살표를 그립니다 — 시작점 → 끝점이 카메라 이동 방향입니다.","노란색 Generate 버튼을 클릭합니다. 이미지 + 화살표가 모두 있어야 활성화됩니다.","왼쪽(원본+화살표)과 오른쪽(결과)을 나란히 보며 의도한 시점인지 검토합니다."]},$("화살표 그리기 요령",[{type:"ul",items:["짧은 화살표 = 소폭 앵글 변화, 긴 화살표 = 대폭 앵글 변화.","화살표 방향이 명확할수록 결과가 정확합니다.","화살표만 다시 그리려면 Clear Arrow, 원본 자체를 바꾸려면 New Image."]}]),F("짧고 명확한 화살표 + 깔끔한 원본 + 합리적인 앵글 변화량이 가장 안정적입니다. 원본에서 보이지 않는 영역이 많은 극단적 변환, 복잡한 배경, 인물의 다른 측면이 없는 케이스는 부정확할 수 있습니다.","⚠️"),{type:"h2",text:"결과 관리"},{type:"ul",items:["화살표 길이·각도를 미세하게 바꾸며 여러 번 생성해 가장 적합한 결과를 고르는 것이 일반적인 워크플로우입니다.","결과 카드의 다운로드 아이콘으로 저장, 삭제 아이콘으로 정리합니다."]}],en:[{type:"p",text:"Draw a single arrow on an image and the AI generates the view from that direction. Change camera angles intuitively — no 3D modeling, rendering, or spatial expertise required."},{type:"h2",text:"When to use it"},{type:"ul",items:["Product angle expansion — turn one front shot into top, side, or 45° views","Aerial top views — nail the overhead angle AI generators usually struggle with","Storyboard variety — show the same scene from multiple camera angles","Architecture/interior viewpoint shifts; ad asset variants for banners, posters, SNS"]},{type:"h2",text:"How to use"},{type:"ol",items:["Click the 15th sidebar icon (right-arrow shape).","Upload an image in the Upload an image to get started area.","Drag on the image to draw an arrow — start point → end point is the camera's travel direction.","Press the yellow Generate button; it activates only with both image and arrow in place.","Compare left (source + arrow) and right (result) side by side to verify the viewpoint."]},$("Arrow-drawing tips",[{type:"ul",items:["Short arrow = subtle angle change; long arrow = big angle change.","The clearer the arrow's direction, the more accurate the result.","Use Clear Arrow to redraw just the arrow, New Image to swap the source."]}]),F("Short clear arrows + clean sources + reasonable angle changes are most stable. Extreme conversions revealing unseen areas, busy backgrounds, or unseen sides of a person can be inaccurate.","⚠️"),{type:"h2",text:"Managing results"},{type:"ul",items:["The usual workflow: nudge arrow length and angle across several runs, then pick the best result.","Save with the download icon on each result card; tidy up with delete."]}]},"drct-seq":{ko:[{type:"p",text:"키프레임 한 장을 기준으로 8개의 연속 장면을 자동 생성합니다. 한 장의 이미지에서 이야기가 이어지는 시퀀스를 빠르게 만들 수 있습니다."},{type:"h2",text:"사용 순서"},{type:"ol",items:["왼쪽 사이드바 16번째 아이콘으로 Directors Sequence를 엽니다.","KEY FRAME 영역의 업로드 박스 또는 New Key Frame 버튼으로 기준 이미지를 업로드합니다. (필수)","(선택) Synopsis에 제작할 이야기·분위기·배경을 입력합니다.","Directors Note에 다음 장면에 반영할 연출 메모를 입력하거나 수정합니다.","하단의 노란색 Generate 버튼을 클릭하면 8개의 연속 장면 생성이 시작됩니다."]},$("입력 항목 정리",[{type:"ul",items:["Key Frame(필수): 연속 장면의 기준 프레임. 누락 시 생성 버튼이 활성화되지 않습니다.","Synopsis(선택): 이야기·분위기·배경. 비워둘 수 있습니다.","Directors Note: 기본값은 “make the next scene with high cinematic tension”. 필요에 따라 수정하세요."]}]),{type:"h2",text:"결과 확인과 다운로드"},{type:"ul",items:["생성이 완료되면 오른쪽에 SCENE 01~08 그리드가 표시됩니다.","Download All로 전체 저장, 장면별 다운로드 아이콘으로 개별 저장이 가능합니다."]}],en:[{type:"p",text:"Automatically generate 8 consecutive scenes from a single keyframe — build a story-driven sequence from one image in minutes."},{type:"h2",text:"How to use"},{type:"ol",items:["Open Directors Sequence from the 16th sidebar icon.","Upload the base image via the KEY FRAME upload box or the New Key Frame button. (Required)","(Optional) Describe the story, mood, and setting in Synopsis.","Enter or edit the direction memo for upcoming scenes in Directors Note.","Press the yellow Generate button to start generating the 8-scene sequence."]},$("Inputs at a glance",[{type:"ul",items:["Key Frame (required): the base frame for the sequence — Generate stays disabled without it.","Synopsis (optional): story, mood, setting. Can be left empty.","Directors Note: defaults to “make the next scene with high cinematic tension”; edit as needed."]}]),{type:"h2",text:"Results and download"},{type:"ul",items:["When finished, a SCENE 01–08 grid appears on the right.","Download All saves every scene; per-scene icons save individually."]}]}};function Fx(o,c){return Jx[o]?.[c]}const xe=o=>`https://drive.google.com/file/d/${o}/preview`,$x={image:{ko:xe("1NyAQw0hGUxapnS__DHECfYebQO7F-H9D"),en:xe("1iGejB3PNJEbsCyvIt7V_gW6RN2N-OJ4m")},video:{ko:xe("1yo8OxQLwrXljwCzhVnkNOMHWp5TRvtrV"),en:xe("1GswLRqjC4bzbRlrknDhq_6jBDhwi5tCm")},upscale:{ko:xe("1KcumCH4MRqGVb1ITf3uJXX_YHrhBzZAY"),en:xe("14fWiRiNoXJWwwJzW3jNoAokUXBc-vidl")},"face-swap":{ko:xe("11RSvqoewsriDWdfncKRiEccxS-KhnBEB"),en:xe("1dCt_WVGxsD5eQRhdlh6IfUb3hLiHhSdT")},"auto-angle":{ko:xe("1iM8HlUaPy5SAmr3pBmyOlp1Q3gg4sfBn"),en:xe("1qa7jph8VqFXY2wj_B8Zq8ydB3V27qklM")},"background-blend":{ko:xe("1GDZYg68oocR4ooBkBM07dS0mMpu9G7fe"),en:xe("1oVAuZicTy2C5d9-4QavANdM4zEhxeXwh")},expression:{ko:xe("1LBloYy4hBBAdJoVn7AC7IOi6uJRkt0uc"),en:xe("178uq4-XWgUyCEwoTTZYkNFc4MlOi7g9B")},"directors-cut":{ko:xe("1ccAtpVYeNOYZ3lRVOVQbgOsKsPEGsdKR"),en:xe("14boecV98spjkphljXesBIVZvrMUUNkjD")},"art-director-pro":{ko:xe("1yJuyYID0kty92oxFDSD1B1ZjXG4U79Z-"),en:xe("1tdlUUZYF0A5ZGrOgG89W83Znby3HDF7q")},"scene-snap":{ko:xe("1NO2dUo-dDnktFVGZCSQRSQ5Z62SSBoB-"),en:xe("1iLHSCoHPgdgPSNgPs9hP3qvqWkDuoWRl")},"cloth-swap":{ko:xe("1hBL76djB-KM_XVl6H5Ype3nkaibRjF0w"),en:xe("1uakGh6YhClj8_xncHrFMgJTP7rgPPxn5")},"youtube-ref":{ko:xe("1gCR6j9qGTIyYJ77X6n9TGZBW_tR_QApX"),en:xe("1okP5rJGnpaxk2O4watgp--ZlmPRErZFH")},"spin-angle":{ko:xe("1-7teTTwC6_IKKW03byC96nMM3h4Duaiz"),en:xe("1agouapJDmMJmDHE
