ions, injuries, props, and previous prompts across every scene."]},"art-director-pro":{tagline:"Keep every character's face and wardrobe consistent across cuts",desc:"Create a character sheet from a face photo, then connect face and wardrobe references to names in your scenario to preserve continuity between cuts.",steps:["Include every character's name in the scenario. AI uses names to connect face and wardrobe references.","Upload a face photo for the character.","Select Detect Face to create a character sheet. A sheet is required before generation can begin.","Add wardrobe or prop references when needed.","Generate the storyboard. The tone and context of previous cuts remain consistent even after you revise the scenario and generate again."],tips:["For scenes with multiple people, pair each name with one face photo.","A well-lit, front-facing portrait gives the most accurate detection."]},"scene-snap":{tagline:"One image → a cinematic six-keyframe storyboard",desc:"Upload an image to create a cinematic storyboard composed of six keyframes.",steps:["Upload the image that will serve as your starting point.","Optionally enter a short description of the mood or progression.","Generate a six-keyframe storyboard."]},"youtube-ref":{tagline:"YouTube link → a nine-scene storyboard",desc:"Paste a video link and AI will generate a nine-scene storyboard. A character reference is optional.",steps:["Paste the YouTube video link you want to reference.","Optionally upload a character reference image.","Generate a nine-scene storyboard inspired by the video's flow."]},"drct-seq":{tagline:"One keyframe → eight connected scenes",desc:"Upload one keyframe and AI automatically creates eight connected scenes as a cinematic sequence.",steps:["Upload the keyframe that will begin the sequence.","Generate eight connected scenes automatically.","Choose the scenes you want to use in your storyboard."]},"spin-angle":{tagline:"Set camera position and direction with a circle and arrow",desc:"M
