<head>

<title>엑스콘다 Q&amp;A 도우미</title>

<style>
/* 레이아웃: 위 머리글 · 가운데 대화 기록(스크롤) · 아래 입력창 고정, 가운데 정렬된 720px 대화 칼럼 */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --ink:#151a2d; --muted:#5d6480; --line:#dfe2ec;
  --accent:#3a45d6; --accent-soft:#e6e8fc; --user:#151a2d; --user-ink:#ffffff; --warn:#a2560a; --warn-soft:#fdf1e3; --on-accent:#ffffff;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Space Grotesk","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --panel:#181c2e; --ink:#e8eaf4; --muted:#9aa1bd; --line:#2a3048;
  --accent:#8a93ff; --accent-soft:#252a4d; --user:#e8eaf4; --user-ink:#0f1220; --warn:#f0b36a; --warn-soft:#3a2b17; --on-accent:#0f1220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --panel:#181c2e; --ink:#e8eaf4; --muted:#9aa1bd; --line:#2a3048;
  --accent:#8a93ff; --accent-soft:#252a4d; --user:#e8eaf4; --user-ink:#0f1220; --warn:#f0b36a; --warn-soft:#3a2b17; --on-accent:#0f1220; color-scheme:dark}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;display:flex;flex-direction:column}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{border-bottom:1px solid var(--line);background:var(--panel)}
header .wrap{padding-block:14px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.head-main{flex:1;min-width:0}
h1{font-size:17px;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.mode-badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode-badge.is-ai{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
main{flex:1;overflow-y:auto}
#log{display:flex;flex-direction:column;gap:14px;padding-block:20px 28px}
.msg{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.user .bubble{background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px}
.bot .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;max-width:100%}
.bot .bubble.pending{color:var(--muted);font-size:14px}
.example-tag{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.card-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.chip-kind{font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.card-title{font-weight:700;font-size:15px;white-space:normal}
.answer{white-space:pre-wrap}
.answer.clamp{max-height:13.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.more{margin-top:6px;background:none;border:0;color:var(--accent);font:inherit;font-size:13.5px;cursor:pointer;padding:0}
.meta{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;white-space:normal}
.meta a{color:var(--accent);font-weight:500}
.source-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.source-link{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line);text-decoration:none;font-size:12px}
.source-link:hover{border-color:var(--accent)}
.notice{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:6px 10px;border-radius:8px;margin-top:8px;white-space:normal}
.related{display:flex;flex-direction:column;gap:6px}
.related p{margin:0;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
footer{border-top:1px solid var(--line);background:var(--panel)}
footer .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button.send{font:inherit;font-weight:700;border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:focus-visible,.chip:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#examples{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
#examples .chip{flex:none;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.4}}}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="logo" aria-hidden="true">X</div>
  <div class="head-main">
    <h1>엑스콘다 Q&amp;A 도우미</h1>
    <p class="sub" id="sub">허브 글을 찾아서 답해요</p>
  </div>
  <span class="mode-badge" id="mode-badge">원문 검색</span>
</div></header>

<main id="scroller"><div class="wrap"><div id="log" aria-live="polite"></div></div></main>

<footer><div class="wrap">
  <div class="chips" id="examples"></div>
  <form id="f" autocomplete="off">
    <label for="q" class="hint" hidden>질문</label>
    <input id="q" placeholder="궁금한 걸 물어보세요 (예: 환불은 어떻게 받나요?)" aria-label="질문 입력">
    <button class="send" type="submit">보내기</button>
  </form>
  <p class="hint">답변은 XCONDA 허브(hub.xconda.ai)의 Q&amp;A·공지·가이드 글을 근거로 보여 줘요. 가격·크레딧은 바뀔 수 있으니 원문도 꼭 확인하세요.</p>
</div></footer>

<script>
/* ===== 1. BM25 검색 엔진 (API 키 없이도 브라우저 안에서 즉시 동작) =====
 * 원리: 질문과 각 답변을 두 글자씩 자른 조각(바이그램)으로 바꾼 뒤,
 * 겹치는 조각이 많고 드문 조각일수록 점수를 높게 주는 BM25 방식으로 가장 맞는 답을 고릅니다. */
var SAME_WORDS = [
  [/시댄스|씨댄스|seedance/g, " seedance "],
  [/플렉스\s*보드|flex\s*board|flexboard/g, " flexboard "],
  [/블로킹\s*보드|blocking\s*board/g, " 블로킹보드 "],
  [/시드림|seedream/g, " seedream "],
  [/드래프트|초안|draft/g, " draft "],
  [/클링|kling/g, " kling "],
  [/(?<![가-힣])턴|turn/g, " turn "],
  [/워크\s*스페이스|workspace/g, " 워크스페이스 "],
  [/엑스콘다|xconda/g, " "]
];
var EXPAND = [
  [/^\s*(엑스콘다|xconda)\s*(가|는|이|란|이란)?\s*(뭐|무엇|어떤|뭔)/i, " 서비스 소개 플랫폼 "],
  [/가격|요금|비용|얼마(?!나)|가격표|price|결제\s*금액/, " 크레딧 팩 가격 "],
  [/무료|공짜|체험|웰컴/, " 웰컴 크레딧 무료 "],
  [/연락|전화|이메일|메일|고객\s*센터|상담|문의/, " 문의 고객센터 "],
  [/해지|구독\s*취소|그만/, " 구독 해지 "],
  [/할인|프로모션|이벤트|세일/, " 할인 행사 "],
  [/저작권|상업/, " 저작권 상업적 "],
  [/회사|운영|만든/, " 회사 큐브베리 "],
  [/팀|동료|멤버|여럿이|같이\s*쓰|함께\s*쓰/, " 워크스페이스 구성원 조직 "],
  [/가입|계정\s*만들/, " 회원가입 "],
  [/뭐야|뭐예요|뭐에요|무엇|뭔가요|뭔데|소개/, " 어떤 도구 "]
];
var STOP = /(싶어요|싶은데|싶으면|싶다|뭐야|인가요|있나요|하나요|되나요|어떻게|무엇|뭔가요|뭐예요|뭐에요|이에요|예요|에요|해요|나요|까요|궁금|알려\s*주세요|알려줘|주세요)/g;
function norm(s){ s=s.toLowerCase(); for(var i=0;i<SAME_WORDS.length;i++) s=s.replace(SAME_WORDS[i][0],SAME_WORDS[i][1]); return s.replace(/[^0-9a-z가-힣\s]/g," "); }
function grams(s){ var out=[]; s.split(/\s+/).forEach(function(w){ if(!w) return; if(/^[a-z0-9]+$/.test(w)){ if(w.length>1) out.push(w); return; } if(w.length===1){out.push(w);return;} for(var i=0;i<w.length-1;i++) out.push(w.substr(i,2)); }); return out; }
function buildIndex(kb){
  var df={}, docs=kb.map(function(d){
    var tf={}, g=grams(norm(d.t+" "+d.t+" "+d.t+" "+(d.h?d.h+" "+d.h+" ":"")+d.a));
    g.forEach(function(x){ tf[x]=(tf[x]||0)+1; });
    Object.keys(tf).forEach(function(x){ df[x]=(df[x]||0)+1; });
    return {tf:tf,len:g.length};
  });
  var avg=docs.reduce(function(a,d){return a+d.len;},0)/docs.length;
  return {kb:kb,docs:docs,df:df,avg:avg,N:docs.length};
}
function search(ix,q){
  var qq=q; EXPAND.forEach(function(e){ if(e[0].test(q)) qq+=e[1]; });
  var qg=grams(norm(qq).replace(STOP," ")); var uniq={}; qg.forEach(function(x){uniq[x]=1;}); qg=Object.keys(uniq);
  var k1=1.2,b=0.75, res=[];
  ix.docs.forEach(function(d,i){
    var s=0; qg.forEach(function(x){ var f=d.tf[x]; if(!f) return; var n=ix.df[x]; var idf=Math.log(1+(ix.N-n+0.5)/(n+0.5)); s+=idf*f*(k1+1)/(f+k1*(1-b+b*d.len/ix.avg)); });
    if(ix.kb[i].k==="qna") s*=1.15;
    if(s>0) res.push({i:i,s:s});
  });
  res.sort(function(a,b){return b.s-a.s;});
  return res;
}

/* ===== 2. 무료 LLM 프록시(qna-bot-worker) 호출 + 자동 BM25 폴백 ===== */
function askBotApi(apiUrl, question, docs, lang, fetchFn, timeoutMs){
  var fn = fetchFn || (typeof fetch !== "undefined" ? fetch : null);
  if(!apiUrl || !fn || !docs || !docs.length) return Promise.resolve(null);
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeoutMs || 8000) : null;
  var payload = {
    question: question,
    lang: lang || "ko",
    docs: docs.slice(0, 4).map(function(d){
      return { title: d.t || d.title, answer: d.a || d.answer, url: d.u || d.url, kind: d.k || d.kind, date: d.d || d.date };
    })
  };
  return fn(apiUrl.replace(/\/+$/, "") + "/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(res){
    if(!res || !res.ok) return null;
    return res.json();
  }).then(function(data){
    return data && data.answer ? data : null;
  }).catch(function(){
    return null;
  }).finally(function(){
    if(timer) clearTimeout(timer);
  });
}
if(typeof module!=="undefined") module.exports={buildIndex:buildIndex,search:search,askBotApi:askBotApi};

hub.xconda.ai/qna/blocking-board-space-json-size/","d":"2026-11-18"},{"k":"qna","t":"구독은 어떻게 해지하나요?","a":"계정 설정(Account Settings)에서 언제든지 직접 해지할 수 있고, 고객센터에 연락하실 필요가 없습니다. 해지하면 다음 결제일부터 자동 결제가 멈춥니다. 이미 낸 금액은 일할 계산으로 돌려드리지 않지만, 7일 이내 미사용 조건에 해당하면 환불을 요청할 수 있습니다. 해지 후에도 남은 구독 크레딧은 지급일로부터 최대 1년까지 쓸 수 있습니다.","s":"이용약관(Terms of Use) 1.14 (https://www.xconda.ai/legal/terms)","u":"https://hub.xconda.ai/qna/cancel-subscription/","d":"2026-10-11","h":"구독 해지 취소 그만 방법"},{"k":"qna","t":"카드 정보는 안전하게 보관되나요?","a":"카드 정보는 Stripe 또는 PortOne(토스페이먼츠, 카카오페이, Eximbay)이 처리하고, 큐브베리 서버에는 전체 카드 번호를 저장하지 않습니다. 확인용으로 카드 끝 4자리와 유효기간만 보관합니다.","s":"이용약관(Terms of Use) 1.9.5 (https://www.xconda.ai/legal/terms) / 개인정보처리방침(Privacy Policy) 2.4.2 (https://www.xconda.ai/legal/privacy)","u":"https://hub.xconda.ai/qna/card-information-security/","d":"2026-10-11"},{"k":"qna","t":"엑스콘다로 만든 영상을 상업적으로 써도 되나요?","a":"약관상 엑스콘다로 생성한 결과물의 소유권은 회원에게 있습니다. 상업적 이용을 막는 별도 조항은 없습니다. 다만 다른 사람의 지식재산권을 침해하는 콘텐츠를 올리거나 만드는 것은 금지되어 있으니, 사용하는 이미지와 영상의 권리를 확인해 주세요.","s":"이용약관(Terms of Use) 1.6, 1.17 (https://www.xconda.ai/legal/terms)","u":"https://hub.xconda.ai/qna/commercial-use/","d":"2026-10-21","h":"유튜브 광고 판매 수익 상업 사용"},{"k":"qna","t":"큐브베리에 영상 제작을 맡길 수 있나요?","a":"네. 큐브베리는 엑스콘다를 기반으로 기획, 스토리, AI 생성, 편집, 후반 작업까지 한 팀에서 진행합니다. 웹드라마, 애니메이션, 다큐, 광고, 기업 홍보 영상 등을 제작해 왔습니다. 아래 연락처로 문의해 주세요.","s":"큐브베리 회사 소개 (https://www.cubeberry.ai/)","u":"https://hub.xconda.ai/qna/commission-video-production/","d":"2026-10-21"},{"k":"qna","t":"엑스콘다를 운영하는 회사의 사업자 정보를 알 수 있나요?","a":"엑스콘다는 주식회사 큐브베리(Cubeberry Co., Ltd.)가 개발하고 운영합니다. 대표이사는 이진서, 사업자등록번호는 480-88-03079, 통신판매업 신고번호는 2026-광주동구-0289입니다. 주소는 2F, 69-12 Chungjang-ro, Dong-gu, Jeonnam-Gwangju 61482, Republic of Korea, 전화는 +82-70-8095-2302, 이메일은 cubeberry@cuberry.kr이며 운영시간은 평일 10:00~17:00(한국시간)입니다. 서버는 Amazon Web Services에서 운영합니다. 사업자 정보는 공정거래위원회 사이트(https://www.ftc.go.kr/bizCommPop.do?wrkr_no=4808803079)에서 확인하실 수 있습니다.","s":"이용약관(Terms of Use) 1.22 (https://www.xconda.ai/legal/terms) / XCONDA 공식 사이트 푸터 (https://www.xconda.ai) / 공정거래위원회 사업자정보확인 (https://www.ftc.go.kr/bizCommPop.do?wrkr_no=4808803079)","u":"https://hub.xconda.ai/qna/company-business-info/","d":"2026-10-21","h":"회사 이름 사업자 등록번호 주소 대표"},{"k":"qna","t":"문의는 어디로 하나요?","a":"고객센터는 모든 고객에게 한 곳에서 운영합니다. 이메일 cubeberry@cuberry.kr, 전화 +82-70-8095-2302, 평일 10:00~17:00(한국시간, 점심 12:00~13:00)입니다. 미국 법인(Cubeberry Co., Ltd, Delaware)은 info@cubeberry.ai, 전화 +1-888-202-1989이고 뉴욕 주소는 276 5th Ave, Ste 704-2816, New York, NY 10001입니다. 미국 법인에서 구매한 건의 환불도 같은 고객센터로 요청하시면 됩니다.","s":"이용약관(Terms of Use) 1.22 (https://www.xconda.ai/legal/terms) / XCONDA 공식 사이트 푸터 (https://www.xconda.ai)","u":"https://hub.xconda.ai/qna/contact-inquiry/","d":"2026-10-21","h":"연락처 전화번호 이메일 고객센터 상담"},{"k":"qna","t":"쿠키를 사용하나요?","a":"네. 로그인과 보안에 필요한 필수 쿠키, 사용 통계와 오류 추적용 분석 쿠키, 언어 같은 설정을 기억하는 선호 쿠키를 씁니다. 브라우저에서 쿠키를 거부하거나 지울 수 있지만 일부 기능이 제한될 수 있습니다. 유럽·영국 사용자에게는 필수가 아닌 쿠키를 동의를 받은 경우에만 쓰며, 동의는 언제든 철회할 수 있습니다.","s":"개인정보처리방침(Privacy Policy) 2.11 (https://www.xconda.ai/legal/privacy)","u":"https://hub.xconda.ai/qna/cookies/","d":"2026-10-11"},{"k":"qna","t":"크레딧 유효기간과 환불 규정이 있나요?","a":"유효기간은 구독 크레딧이 지급일로부터 최대 1년, 크레딧 팩이 결제일로부터 1년이며, 지나면 자동으로 소멸합니다. 환불은 결제 후 7일 이내이고, 그 결제로 받은 크레딧을 하나도 쓰지 않았을 때 전액 환불을 요청할 수 있습니다. 하나라도 썼거나 7일이 지났다면 환불되지 않습니다. 환불하면 그 결제로 받은 크레딧만 회수되고, 전에 이월된 크레딧은 그대로 남습니다. 거주 국가의 소비자법이 주는 환불·철회 권리는 약관으로 제한되지 않습니다. 자세한 절차는 아래 환불 항목을 보세요.","s":"이용약관(Terms of Use) 1.10, 1.15 (https://www.xconda.ai/legal/terms) / 환불정책(Refund Policy) 3.1 (https://www.xconda.ai/legal/refund)","u":"https://hub.xconda.ai/qna/credit-expiry-and-refund-policy/","d":"2026-10-11","h":"환불 규정 유효기간 만료"},{"k":"qna","t":"크레딧 팩은 무엇이고 얼마인가요?","a":"크레딧 팩은 한 번 결제하면 정해진 크레딧을 받는 상품이고, 자동으로 갱신되지 않습니다. 한국(원화, 부가세 포함)은 Starter Pack V1 10,450원(2,020크레딧), Starter Pack V2 31,350원(6,200), Pro Pack V1 52,250원(10,500), Pro Pack V2 99,000원(21,500), Master Pack 495,000원(114,000)입니다. 해외(달러, 세금 별도)는 $6.90, $20.90, $34.90, $67.90, $369.90입니다. 유효기간은 결제일로부터 1년입니다.","s":"이용약관(Terms of Use) 1.8 (https://www.xconda.ai/legal/terms) / XCONDA Pricing (https://www.xconda.ai/pricing)","u":"https://hub.xconda.ai/qna/credit-packs-and-price/","d":"2026-10-11","h":"가격 요금 비용 얼마 요금제 가격표 플랜 상품 구매 원 달러"},{"k":"qna","t":"크레딧을 다른 사람에게 넘기거나 현금으로 바꿀 수 있나요? 탈퇴하면 크레딧은 어떻게 되나요?","a":"아니요. 크레딧은 현금 가치가 없고, 다른 사람에게 양도하거나 판매할 수 없습니다. 탈퇴하거나 계정이 해지되면 남은 크레딧은 소멸합니다. 다만 환불 조건에 해당하는 결제는 환불이 우선합니다.","s":"이용약관(Terms of Use) 1.3.2, 1.18.3 (https://www.xconda.ai/legal/terms)","u":"https://hub.xconda.ai/qna/credit-transfer-cash-withdrawal/","d":"2026-10-11"},{"k":"qna","t":"크레딧은 점수예요?","a":"아니요. Xconda에서 쓰는 토큰이에요.","s":"","u":"https://hub.xconda.ai/qna/credits-are-tokens-not-points/","d":"2026-11-23"},{"k":"qna","t":"지금 진행 중인 할인 행사가 있나요?","a":"현재 진행 중인 시댄스 할인 행사는 없습니다. Flex Board 출시 기념 시댄스 2.5 할인은 2026년 11월 6일 오전 11시(한국 시간)에 끝났습니다. 지금은 신규 가입 시 500크레딧을 드리고, 원화 결제 시 크레딧 팩을 정가보다 5~10% 낮은 가격에 판매하고 있습니다. 새 행사는 Xconda 뉴스에서 안내해 드립니다.","s":"XCONDA 프로모션 안내","u":"https://hub.xconda.ai/qna/current-discount-events/","d":"2026-11-23"},{"k":"qna","t":"엑스콘다 데이터는 어디에서 운영되나요?","a":"엑스콘다는 Amazon Web Services에서 운영하며, 저장된 데이터는 전송 중과 저장 중에 암호화됩니다. 개인정보는 주 운영지인 한국, 그리고 미국(미국 법인, Stripe, 클라우드 업체)과 서비스 제공사가 있는 나라에서 처리·저장될 수 있습니다. 국가 간 이전에는 표준계약조항과 데이터 처리 계약 등을 적용합니다.","s":"개인정보처리방침(Privacy Policy) 2.8, 2.10 (https://www.xconda.ai/legal/privacy)","u":"https://hub.xconda.ai/qna/data-operation-location/","d":"2026-10-21"},{"k":"qna","t":"서비스 이용 중 오류가 생기면 어떻게 하나요?","a":"생성 실패나 서비스 장애로 차감된 크레딧은 자동으로 복구됩니다. 그 밖의 오류는 고객센터 이메일 cubeberry@cuberry.kr로 알려 주세요(전화 +82-70-8095-2302, 평일 10:00~17:00 한국시간). 계정 이메일, 오류가 난 화면 캡처, 발생 시각을 함께 보내시면 확인이 빠릅니다.","s":"이용약관(Terms of Use) 1.16 (https://www.xconda.ai/legal/terms) / 환불정책(Refund Policy) (https://www.xconda.ai/legal/refund)","u":"https://hub.xconda.ai/qna/error-support/","d":"2026-10-21"},{"k":"qna","t":"유럽이나 영국에서도 환불(철회)할 수 있나요?","a":"유럽경제지역(EEA)과 영국의 소비자는 디지털 서비스에 대해 14일의 철회권이 있습니다. 결제 전에 즉시 서비스와 크레딧을 제공받는 데 동의하고, 그 결제로 받은 크레딧을 쓰는 순간 철회권을 잃는다는 점을 확인합니다. 크레딧을 쓰지 않았다면 결제 후 14일 안에 철회하고 전액 환불받을 수 있습니다.","s":"환불정책(Refund Policy) 3.1.7 (https://www.xconda.ai/legal/refund)","u":"https://hub.xconda.ai/qna/eu-uk-withdrawal-refund/","d":"2026-10-11"},{"k":"qna","t":"Auto Refine과 Instant Apply는 언제 쓰나요?","a":"Auto Refine은 아이디어나 거친 시나리오를 다듬어 컷으로 나눠줍니다. Instant Apply는 이미 정리된 시나리오를 그대로 빠르게 적용합니다. Flex Board 스킬로 글콘티를 미리 만들어 두었다면 Instant Apply가 편합니다.","s":"XCONDA Hub 툴 사용법 FLEXBOARD","u":"https://hub.xconda.ai/qna/flexboard-auto-refine-instant-apply/","d":"2026-11-23"},{"k":"qna","t":"컷이 바뀌어도 같은 인물이 나오게 하려면 어떻게 하나요?","a":"Scene Settings의 Reference Assets에 인물(Cast) 카드와 배경(Background) 카드를 등록합니다. 카드마다 @image1, @image2 같은 토큰이 붙고, 컷 설명에 이 토큰이 들어가 어떤 인물과 배경이 쓰였는지 표시됩니다. 인물은 한 사람당 카드 하나로 등록하세요.","s":"XCONDA Hub 툴 사용법 FLEXBOARD","u":"https://hub.xconda.ai/qna/flexboard-character-consistency/","d":"2026-10-21"},{"k":"qna","t":"Flex Board에서 컷은 몇 개까지, 몇 초까지 만들 수 있나요?","a":"한 화면에 최대 36컷까지 구성할 수 있습니다. 컷 수는 Number of Panels에서, 컷 하나의 길이는 Shot Length에서 4초부터 30초 사이로 정합니다. 예를 들어 9컷 × 15초로 설정하면 단순 합계는 약 2분 15초입니다.","s":"","u":"https://hub.xconda.ai/qna/flexboard-cut-count-and-length/","d":"2026-11-23"},{"k":"qna","t":"Flex Board에서 만든 콘티를 내려받을 수 있나요?","a":"네. Edit Panel 오른쪽 위에서 Panel 보기일 때는 Download CUT ZIP으로 컷 이미지를 한꺼번에, Sheet 보기일 때는 Download Sheet로 시트 한 장을 내려받을 수 있습니다. 팀원이나 클라이언트와 콘티를 공유할 때 쓰면 좋습니다.","s":"","u":"https://hub.xconda.ai/qna/flexboard-download-storyboard/","d":"2026-11-23"},{"k":"qna","t":"마음에 안 드는 컷 하나만 고칠 수 있나요?","a":"네. Edit Panel의 Panel 보기에서 고칠 컷의 Edit를 누르면 그 컷만 수정합니다. 간단한 변경은 Quick Edit에 한 문장으로 적고(예: '안경만 바꾸고 자세와 배경은 그대로'), 카메라를 바꾸려면 Detailed Edit에서 Shot Size, Camera Angle, Camera Movement를 골라 다시 생성합니다. 나머지 컷은 그대로 유지됩니다.","s":"XCONDA Hub 툴 사용법 FLEXBOARD","u":"https://hub.xconda.ai/qna/flexboard-edit-single-cut/","d":"2026-11-23"},{"k":"qna","t":"Panel 보기와 Sheet 보기는 무엇이 다른가요?","a":"Panel 보기는 컷마다 카드 하나로, 이미지와 함께 장면 설명, 대사, 효과음, Edit 버튼이 나옵니다. 컷 하나하나를 읽고 고칠 때 씁니다. Sheet 보기는 설명 없이 컷 이미지만 크게 모아 보여줍니다. 전체 흐름이 자연스럽게 이어지는지 볼 때 씁니다. Sheet로 흐름을 먼저 보고 Panel로 한 컷씩 확인하는 순서를 추천합니다.","s":"","u":"https://hub.xconda.ai/qna/flexboard-panel-vs-sheet/","d":"2026-10-11"},{"k":"qna","t":"분쟁이 생기면 어느 나라 법을 따르나요?","a":"한국 법인(주식회사 큐브베리)과 계약했다면 대한민국 법이 적용되고, 협의로 풀리지 않는 분쟁은 한국 법원이 맡습니다. 미국 법인(Cubeberry Co., Ltd, Delaware)과 계약했다면 미국 뉴욕주 법이 적용되고, 뉴욕 카운티의 주 또는 연방 법원이 맡습니다. 사는 곳의 강행 소비자법 보호는 그대로 유지됩니다.","s":"이용약관(Terms of Use) 1.20 (https://www.xconda.ai/legal/terms)","u":"https://hub.xconda.ai/qna/governing-law-disputes/","d":"2026-10-11"},{"k":"qna","t":"크레딧은 어떻게 차감되나요?","a":"크레딧은 사용하는 기능과 모델에 따라 다르게 차감됩니다. 생성 버튼이나 선택 화면에 1회 생성에 필요한 크레딧이 표시되니 생성 전에 확인해 주세요. 예를 들어 Turn에서는 이미지 엔진마다 1회 생성 크레딧이 다르게 표시되고, Flex Board의 이미지 재생성 버튼에도 필요한 크레딧이 표시됩니다. 서비스 장애나 생성 실패로 차감된 크레딧은 자동으로 복구됩니다. 크레딧이 여러 묶음이면 만료일이 빠른 것부터 차감됩니다.","s":"이용약관(Terms of Use) 1.10.5, 1.16 (https://www.xconda.ai/legal/terms) / 환불정책(Refund Policy) 3.1.6 (https://www.xconda.ai/legal/refund) / XCONDA Hub 툴 사용법 Turn 가이드 / XCONDA Hub 툴 사용법 FLEXBOARD","u":"https://hub.xconda.ai/qna/how-credits-are-deducted/","d":"2026-11-23"},{"k":"qna","t":"허브에는 어떻게 들어가나요?","a":"엑스콘다 홈페이지(xconda.ai)에서 Resources 메뉴의 Hub로 들어가실 수 있습니다.","s":"XCONDA 공식 사이트 푸터 (https://www.xconda.ai)","u":"https://hub.xconda.ai/qna/how-to-access-hub/","d":"2026-10-21"},{"k":"qna","t":"스킬은 어떻게 설치하나요?","a":"Claude 고객센터 안내 기준입니다. 1) 허브에서 스킬 ZIP 파일을 내려받습니다(스킬 하나당 ZIP 파일 하나입니다). 2) Claude에서 Customize > Skills로 들어갑니다. 3) '+' 버튼을 누르고 Create skill을 고릅니다. 4) Upload a skill을 선택해 ZIP 파일을 올립니다. 5) 스킬 목록에 나타나면 켜서 사용합니다. 설정의 Capabilities에서 코드 실행이 켜져 있어야 합니다.","s":"Claude 고객센터 https://support.claude.com/en/articles/12512180 / XCONDA Hub","u":"https://hub.xconda.ai/qna/how-to-install-skills/","d":"2026-10-21"},{"k":"qna","t":"환불은 어떻게 요청하고, 얼마나 걸리나요?","a":"고객센터(cubeberry@cuberry.kr 또는 +82-70-8095-2302, 평일 10:00~17:00 한국시간)로 요청해 주세요. 계정 이메일, 주문(거래) 번호, 결제일, 환불 사유를 함께 보내시면 됩니다. 요청은 영업일 2~3일 안에 검토하고, 승인 후 처음 결제한 수단으로 취소 처리되며 금액이 보이기까지 영업일 7~14일이 걸릴 수 있습니다. 구독 첫 결제, 갱신, 업그레이드, 크레딧 팩 모두 같은 기준(7일 이내, 그 결제로 받은 크레딧 미사용)으로 전액 환불됩니다. 환불은 구매한 회사(Stripe 결제는 미국 법인, PortOne 결제는 한국 법인)가 처리합니다.","s":"환불정책(Refund Policy) 3.0, 3.2 (https://www.xconda.ai/legal/refund)","u":"https://hub.xconda.ai/qna/how-to-request-refund/","d":"2026-10-11","h":"환불 신청 요청 돌려받기 환불 받고 받기 방법"},{"k":"qna","t":"회원가입은 어떻게 하나요?","a":"엑스콘다 홈페이지(xconda.ai)에서 계정을 만들어 시작합니다. 구글, 페이스북, X 소셜 로그인이나 이메일과 비밀번호로 가입할 수 있습니다. 만 18세 이상만 이용할 수 있고, 정확한 정보로 가입해야 하며, 계정 정보는 본인이 관리해야 합니다. 계정을 다른 사람과 공유하면 안 됩니다. 현재 가입 시 무료 크레딧은 제공하지 않습니다.","s":"이용약관(Terms of Use) 1.5 (https://www.xconda.ai/legal/terms) / 개인정보처리방침(Privacy Policy) 2.2.4, 2.9 (https://www.xconda.ai/legal/privacy)","u":"https://hub.xconda.ai/qna/how-to-sign-up/","d":"2026-10-11","h":"가입 계정 만들기 로그인"},{"k":"qna","t":"허브는 다른 언어로도 볼 수 있나요?","a":"네. 허브 화면 상단의 언어 버튼으로 한국어, 영어, 일본어, 중국어 중에서 고를 수 있습니다.","s":"","u":"https://hub.xconda.ai/qna/hub-languages/","d":"2026-10-11"},{"k":"qna","t":"이미지 프롬프트는 몇 자까지 쓰는 게 좋나요?","a":"이미지 프롬프트는 영어 기준 약 600자 이내로 쓰는 것을 권장합니다. 이미지 생성 모델을 제공하는 BytePlus의 권장 사항이며, 프롬프트가 이보다 길어지면 모델이 세부 내용을 지나치게 따지면서 이미지 품질이 떨어질 수 있습니다. 강제로 막는 제한이 아니라 권장 기준입니다.\n핵심(누구가, 어디서, 무엇을 하는지, 분위기)을 먼저 쓰고, 세부 묘사는 결과를 확인한 뒤 수정하면서 하나씩 더하는 방식이 좋습니다.\n예시: \"A young woman in a red coat standing on a rainy Seoul street at night, neon signs reflected on wet pavement, cinematic mood.\"","s":"BytePlus ModelArk 이미지 생성 API 문서 (https://docs.byteplus.com/en/docs/modelark/image-generation-api)","u":"https://hub.xconda.ai/qna/image-prompt-length/","d":"2026-11-12"},{"k":"qna","t":"해외에서도 결제할 수 있나요?","a":"네. 결제 경로가 두 가지입니다. Stripe로 결제하면 미국 법인 Cubeberry Co., Ltd(Delaware)가 판매하고 미국 달러($)로 청구되며, 사는 곳에 따라 세금이 결제 화면에서 추가될 수 있습니다. 토스페이먼츠, 카카오페이, Eximbay(PortOne 경유)로 결제하면 한국 법인 주식회사 큐브베리가 판매하고, 국내 결제는 원화(₩)로 청구됩니다. 판매하는 회사는 결제 화면과 영수증에 표시됩니다.","s":"이용약관(Terms of Use) 1.2, 1.8, 1.9 (https://www.xconda.ai/legal/terms) / XCONDA 공식 사이트 푸터 (https://www.xconda.ai)","u":"https://hub.xconda.ai/qna/international-payment/","d":"2026-10-11"},{"k":"qna","t":"가격에 세금이 포함되어 있나요?","a":"한국 요금은 부가세 10%가 포함된 금액입니다. 해외 요금은 세금이 포함되지 않으며, 사는 곳에 따라 판매세, VAT, GST 같은 세금이 결제 화면에서 추가될 수 있습니다. 세금이 포함된 최종 금액은 결제를 확정하기 전에 화면에 표시됩니다.","s":"이용약관(Terms of Use) 1.8 ⑤, 1.9.3 (https://www.xconda.ai/legal/terms)","u":"https://hub.xconda.ai/qna/is-tax-included/","d":"2026-10-11"},{"k":"qna","t":"미성년자도 쓸 수 있나요?","a":"아니요. 엑스콘다는 만 18세 이상만 이용할 수 있습니다. 만 18세 미만의 개인정보는 수집하지 않으며, 수집한 사실을 알게 되면 바로 삭제합니다.","s":"이용약관(Terms of Use) 1.5.1 (https://www.xconda.ai/legal/terms) / 개인정보처리방침(Privacy Policy) 2.9 (https://www.xconda.ai/legal/privacy)","u":"https://hub.xconda.ai/qna/minors-eligibility/","d":"2026-10-11"},{"k":"qna","t":"실사 촬영 영상과 섞어서 쓸 수 있나요?","a":"레퍼런스 방식에서 이미지뿐 아니라 영상을 최대 10개까지 참조로 넣을 수 있어서, 직접 촬영한 영상을 참조 자료로 쓸 수 있습니다. 참조한 영상이 결과에 얼마나 반영되는지는 프롬프트와 소재에 따라 다르니, 짧은 컷으로 먼저 시험해 보시길 권합니다.","s":"XCONDA Video Generator (https://www.xconda.ai/video)","u":"https://hub.xconda.ai/qna/mixing-with-live-footage/","d":"2026-10-11"},{"k":"qna","t":"같은 인물 얼굴 사진을 여러 장 넣으면 더 정확해지나요?","a":"오히려 반대인 경우가 많습니다. 같은 인물의 얼굴 이미지를 여러 장 넣으면 얼굴이 섞여 뭉개질 수 있습니다. 인물당 얼굴 이미지는 1장으로 넣는 것이 원칙입니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/multiple-face-photos-accuracy/","d":"2026-10-21"},{"k":"qna","t":"환불이 안 되는 경우는 언제인가요?","a":"결제 후 7일이 지났거나, 그 결제로 받은 크레딧을 하나라도 썼거나, 약관 위반으로 계정이 해지된 경우에는 환불되지 않습니다. 이 내용은 결제 전에 안내하고 동의를 받습니다. 서비스 장애나 생성 실패로 사라진 크레딧은 환불이 아니라 자동 복구됩니다.","s":"환불정책(Refund Policy) 3.1.2, 3.1.5, 3.1.6 (https://www.xconda.ai/legal/refund)","u":"https://hub.xconda.ai/qna/non-refundable-cases/","d":"2026-10-11","h":"환불 불가 안되는"},{"k":"qna","t":"만든 결과물의 저작권은 누구에게 있나요?","a":"약관상 서비스로 생성한 콘텐츠의 소유권은 회원에게 있습니다. 엑스콘다 플랫폼 자체(소프트웨어, 기술, 상표)는 주식회사 큐브베리 소유입니다. 회원은 서비스를 제공하고 개선하는 범위에서 큐브베리(한국, 미국 법인)가 회원 콘텐츠를 쓸 수 있도록 비독점 사용권을 줍니다. 다른 사람의 지식재산권을 침해하는 콘텐츠는 올리거나 만들 수 없습니다.","s":"이용약관(Terms of Use) 1.17 (https://www.xconda.ai/legal/terms)","u":"https://hub.xconda.ai/qna/output-copyright/","d":"2026-10-11"},{"k":"qna","t":"결제가 실패하면 어떻게 하나요?","a":"실패 원인으로 잔액이나 한도 부족, 카드 만료, 해외 결제 차단, 청구지 주소·CVV 오류, 카드사의 부정 사용 방지 시스템 작동이 많습니다. 카드사에 해외 결제 허용 여부를 물어보고, 잔액과 만료일, 청구 "t":"Draft는 얼마나 보관돼요?","a":"14일이에요. 이 기한은 1080p로 바꿀 수 있는 시간이고, 초안 영상 자체는 결과물로 남아요.","s":"XCONDA 뉴스 「Seedance 2.5 Draft Mode 업데이트: 초안 보관 기간 최대 14일로 연장」(2026-11-02)","u":"https://hub.xconda.ai/qna/seedance-draft-1080p-window-14-days/","d":"2026-11-18"},{"k":"qna","t":"프롬프트를 꼭 영어로 써야 하나요?","a":"Xconda 프롬프트 스킬을 쓰면 한국어와 영어를 나란히 띄운 편집기로 프롬프트를 만들고 고칠 수 있습니다. 한국어로 확인하고, 영상 생성에는 영문 실사용본을 넣으면 됩니다. 영어 프롬프트가 부담스러운 분도 편하게 쓰실 수 있습니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/seedance-prompt-language/","d":"2026-11-23"},{"k":"qna","t":"결과가 마음에 안 들면 프롬프트를 처음부터 다시 써야 하나요?","a":"아닙니다. Xconda 프롬프트 스킬에서 결과를 보고 고칠 점을 대화로 요청하면 편집기의 프롬프트가 수정되고, 그걸로 다시 생성합니다. 완성도가 오를 때까지 이 과정을 반복합니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/seedance-prompt-retry/","d":"2026-11-23"},{"k":"qna","t":"레퍼런스 이미지와 영상은 몇 개까지 넣을 수 있나요?","a":"엑스콘다 영상 생성의 레퍼런스(Reference) 방식에서는 한 번에 이미지 최대 30장, 영상 최대 10개, 오디오 최대 10개까지 참조로 넣을 수 있습니다. 넣은 자산은 입력 자산(Input Assets) 보관함에 저장되고, 프롬프트에서 @를 입력해 어느 자산을 가리킬지 지정합니다.","s":"XCONDA Video Generator (https://www.xconda.ai/video)","u":"https://hub.xconda.ai/qna/seedance-reference-limits/","d":"2026-10-11"},{"k":"qna","t":"스킬을 쓰려면 Claude 유료 플랜이 필요한가요?","a":"Anthropic 고객센터 안내에 따르면 스킬은 Free, Pro, Max, Team, Enterprise 플랜에서 쓸 수 있고, 설정에서 코드 실행(code execution) 기능을 켜야 합니다. 플랜마다 사용량 한도가 다르니, 긴 시나리오를 자주 작업한다면 유료 플랜이 편할 수 있습니다. Claude의 정책은 바뀔 수 있으니 최신 내용은 Claude 고객센터에서 확인해 주세요.","s":"Claude 고객센터 https://support.claude.com/en/articles/12512180","u":"https://hub.xconda.ai/qna/skills-claude-paid-plan/","d":"2026-10-11"},{"k":"qna","t":"사운드와 편집은 어떻게 하나요?","a":"큐브베리 제작 흐름에서는 완성된 영상의 분위기와 길이에 맞춰 수노(Suno)로 사운드를 만들고, 프리미어 프로에서 영상과 사운드를 합쳐 컷 연결, 음량, 자막을 확인한 뒤 최종 출력합니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/sound-and-editing/","d":"2026-11-01"},{"k":"qna","t":"구독은 자동으로 갱신되나요?","a":"네. 구독은 해지하기 전까지 매월 같은 날 등록한 결제수단으로 자동 결제됩니다. 첫 결제 전에 가격, 결제 주기, 갱신 조건, 해지 방법을 보여드리고 동의를 받으며, 구매 후에는 갱신 조건과 해지 방법이 담긴 확인 메일을 보내드립니다.","s":"이용약관(Terms of Use) 1.9, 1.11 (https://www.xconda.ai/legal/terms)","u":"https://hub.xconda.ai/qna/subscription-auto-renewal/","d":"2026-10-11"},{"k":"qna","t":"남은 구독 크레딧은 다음 달로 넘어가나요?","a":"네. 쓰지 않은 구독 크레딧은 다음 결제 주기로 이월되며, 지급일로부터 최대 1년까지 유효합니다. 기한이 지난 크레딧은 자동으로 소멸하고, 크레딧은 만료일이 빠른 것부터 차감됩니다.","s":"이용약관(Terms of Use) 1.10 (https://www.xconda.ai/legal/terms)","u":"https://hub.xconda.ai/qna/subscription-credit-rollover/","d":"2026-10-11"},{"k":"qna","t":"어떤 AI 모델을 쓸 수 있나요?","a":"영상 생성은 입력 모드에 따라 I2V 14종, T2V 13종을 지원합니다. 모델 목록: Kling 4.0, Seedance 2.5, Seedance 2.0, Seedance 2.0 Fast, Seedance 2.0 MINI, Kling 3.0 Pro, Kling 3.0 4K, Kling OMNI (O3 Pro), Veo 3.1, Veo 3.1 Fast, Gemini Omni Flash, Grok Imagine Video, Grok Imagine Video 1.5, Vidu Q3. 이미지 모델은 Seedream 5.5, Seedream 5.0 Lite, Seedream 5.0 Pro, Kling Image O1, Nano Banana 2, Nano Banana 2 Lite, Nano Banana Pro, Grok Imagine Pro, Grok Imagine Image, Z Image, GPT Image 2.5입니다. 지원하는 입력·길이·해상도는 모델과 생성 모드에 따라 다르므로 각 도구 화면에서 확인해 주세요.","s":"","u":"https://hub.xconda.ai/qna/supported-ai-models/","d":"2026-11-23"},{"k":"qna","t":"요금이나 약관이 바뀌면 미리 알려주나요?","a":"네. 요금 변경은 시행 30일 전에 알려드리고, 이미 결제한 금액에는 바뀌기 전 가격이 적용됩니다. 구독은 안내 기간이 지난 뒤 첫 결제일부터 새 가격이 적용되며, 그 전에 해지할 수 있습니다. 약관 변경은 7일 전(회원에게 불리한 변경은 30일 전), 개인정보처리방침의 중요한 변경은 최소 30일 전에 알려드립니다.","s":"이용약관(Terms of Use) 1.4, 1.8 ⑥ (https://www.xconda.ai/legal/terms) / 개인정보처리방침(Privacy Policy) 2.14 (https://www.xconda.ai/legal/privacy)","u":"https://hub.xconda.ai/qna/terms-change-notice/","d":"2026-10-11"},{"k":"qna","t":"Turn으로 만든 이미지는 어디에 쓰나요?","a":"세 군데에 씁니다. 빈 공간 이미지(Freeze Frame)는 시댄스 영상 생성의 배경 레퍼런스로, 인물을 넣은 키 이미지는 Flex Board 스토리보드의 컷으로, 공간 이미지는 블로킹 보드에서 동선을 짤 무대로 씁니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개 / XCONDA Hub 툴 사용법 Turn 가이드","u":"https://hub.xconda.ai/qna/turn-image-usage/","d":"2026-11-23"},{"k":"qna","t":"Turn에서 소품을 추가하거나 벽지를 바꿀 수 있나요?","a":"네. Wall Edit에서 여섯 방향 카드 중 하나를 골라 참고 이미지를 올리고, 바꿀 부분을 붓으로 칠한 뒤 실행합니다. 소품 하나는 INPAINT(칠한 부분만 수정), 그 방향 면 전체는 REGEN(다시 생성), 특정 물건 교체는 REPLACE를 씁니다. 벽지처럼 넓은 면은 참고 이미지와 함께 '몰딩은 지우고 벽지만 바꿔줘' 같은 지시문을 넣으면 깔끔하게 바뀝니다.","s":"XCONDA Hub 툴 사용법 Turn 가이드","u":"https://hub.xconda.ai/qna/turn-props-wallpaper/","d":"2026-10-21"},{"k":"qna","t":"Turn에서 방 크기를 바꾸면 크레딧이 또 드나요?","a":"Room Size · Camera에서 방의 폭, 깊이, 천장 높이를 바꾼 뒤 'Apply Room Size · No Additional Generation'을 누르면, 이미지를 새로 생성하지 않고 기존 벽면 이미지로 비율만 바꿉니다. 소품도 제자리에 남습니다.","s":"XCONDA Hub 툴 사용법 Turn 가이드","u":"https://hub.xconda.ai/qna/turn-room-size-credits/","d":"2026-10-21"},{"k":"qna","t":"사진이 없어도 Turn을 쓸 수 있나요?","a":"네. 참고 사진 칸(Front, Left, Right, Back)을 모두 비워두면 글 설명(프롬프트)만으로 공간을 만듭니다. 정면 사진 한 장만 있어도 되고, 가지고 있는 방향의 사진을 더 넣어도 됩니다.","s":"XCONDA Hub 툴 사용법 Turn 가이드","u":"https://hub.xconda.ai/qna/turn-without-photos/","d":"2026-10-21"},{"k":"qna","t":"내가 올린 이미지와 영상을 큐브베리가 사용하나요?","a":"업로드한 이미지와 영상, 만든 결과물의 소유권은 회원에게 있습니다. 큐브베리는 서비스를 제공하고 개선하는 범위에서 이 콘텐츠를 사용할 수 있습니다. 엑스콘다 AI 모델을 학습시키는 데는 회원이 동의한 경우에만 사용합니다. 개인정보는 판매하지 않고, 타깃 광고를 위해 공유하지 않습니다.","s":"이용약관(Terms of Use) 1.17.3 (https://www.xconda.ai/legal/terms) / 개인정보처리방침(Privacy Policy) 2.4.6 (https://www.xconda.ai/legal/privacy)","u":"https://hub.xconda.ai/qna/uploaded-content-usage/","d":"2026-10-21"},{"k":"qna","t":"영상 생성 창에는 무엇을 넣어야 하나요?","a":"네 가지를 함께 넣는 것을 권장합니다. 1) 레퍼런스 이미지(캐릭터 시트, 배경 시트, 소품): 얼굴, 의상, 공간을 고정합니다. 2) 스토리보드(컷별 이미지): 구도와 컷 순서를 고정합니다. 3) 시댄스용 프롬프트(영문): 움직임, 타이밍, 카메라를 지시합니다. 4) 블로킹 퍼펫 영상: 인물 동선과 이동 경로를 고정합니다. 하나가 빠지면 그 부분을 AI가 임의로 채우게 됩니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/video-generation-inputs/","d":"2026-11-14"},{"k":"qna","t":"블로킹 보드는 어떤 도구인가요?","a":"블로킹 보드는 영상을 생성하기 전에 인물, 공간, 카메라가 서로 부딪히지 않는지 미리 확인하는 디지털 리허설 도구입니다. 2026년 10월 20일부터 웹에서 무료 베타로 제공하고 있습니다(카드 등록 불필요). 평면도에 인물 위치와 이동 경로를 그리고, 3D 무대에서 재생하며 시선, 180도 축, 충돌을 점검합니다. 공간 안에서 인형(퍼펫)이 움직이는 영상을 만들어 영상 생성 때 함께 넣을 수 있습니다.","s":"XCONDA Hub 툴 사용법 블로킹 보드","u":"https://hub.xconda.ai/qna/what-is-blocking-board/","d":"2026-11-02"},{"k":"qna","t":"Flex Board는 어떤 도구인가요?","a":"Flex Board는 시나리오를 컷으로 나누고 컷마다 글과 이미지로 미리 보여주는 스토리보드 도구입니다. 영상을 생성하기 전에 컷별 구도와 인물을 확인하고, 마음에 안 드는 컷만 골라 고칠 수 있습니다. 상단 메뉴 「스튜디오」의 연출 단계에서 블로킹 보드와 둘 중 하나를 골라 씁니다. 컷이 완성되면 「보내기」로 에셋 라이브러리에 저장하거나, 영상 프로젝트로 넘겨 시댄스 2.5로 영상을 만듭니다. 영상의 비율·화질·길이·음성은 「영상 › 모델 선택」 화면에서 정합니다. 예전에 Flex Board에서 만든 프로젝트는 영상 프로젝트로 옮겨지고, 컷 이미지는 에셋 라이브러리에서 찾을 수 있습니다.","s":"XCONDA Hub 툴 사용법 FLEXBOARD","u":"https://hub.xconda.ai/qna/what-is-flexboard/","d":"2026-11-23"},{"k":"qna","t":"Turn은 어떤 도구인가요?","a":"Turn은 사진 한 장이나 글 설명으로 360도 돌려볼 수 있는 가상 세트를 만드는 도구입니다. 한 공간을 만들어 두고 그 안에서 카메라를 돌려 필요한 각도를 고르기 때문에, 컷이 바뀌어도 문, 창문, 소품 위치가 유지됩니다. 마음에 드는 각도에서 인물을 넣어 키 이미지까지 만들 수 있습니다.","s":"XCONDA Hub 툴 사용법 Turn 가이드","u":"https://hub.xconda.ai/qna/what-is-turn/","d":"2026-10-21"},{"k":"qna","t":"엑스콘다 클로드 스킬은 무엇인가요?","a":"클로드(Claude)에 추가해서 쓰는 엑스콘다 전용 작업 도구입니다. 두 가지가 있습니다. Flex Board 스킬은 시나리오를 컷으로 나누며 컷 길이의 합, 한 컷의 동작 양, 비슷한 컷끼리 붙어 화면이 튀는지, 등장인물 수를 점검합니다. Xconda 프롬프트 스킬은 Flex Board에서 확정한 키 이미지를 바탕으로 시댄스 2.5용 프롬프트를 만들며, 총괄, 촬영, 조명, 미술 감독 네 명이 나눠 맡는 방식으로 작성합니다.","s":"","u":"https://hub.xconda.ai/qna/what-is-xconda-claude-skill/","d":"2026-11-23"},{"k":"qna","t":"엑스콘다(Xconda)는 어떤 서비스인가요?","a":"엑스콘다는 큐브베리가 운영하는 AI 영상·이미지 제작 플랫폼입니다(xconda.ai). 여러 생성 AI 모델을 한곳에서 쓸 수 있고, 시나리오에서 스토리보드, 영상 생성까지 이어지는 제작 도구(Flex Board, Turn, 블로킹 보드 등)를 함께 제공합니다. 클립 한 개를 뽑는 데서 끝나지 않고, 여러 컷이 같은 인물과 같은 공간으로 이어지는 작품을 만드는 데 초점을 맞췄습니다. 상단 메뉴는 「스튜디오」(한 편을 단계별로 끝까지), 「이미지」·「영상」(하나씩 바로 생성), 「캔버스」, 「커뮤니티」(예시 영상)로 나뉩니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개 / 큐브베리 회사 소개 (https://www.cubeberry.ai/)","u":"https://hub.xconda.ai/qna/what-is-xconda/","d":"2026-11-23","h":"서비스 소개 플랫폼"},{"k":"qna","t":"스킬은 어디서 받을 수 있나요?","a":"엑스콘다 제작 워크플로우용 클로드 스킬(Flex Board 스킬, Xconda 프롬프트 스킬)은 엑스콘다 허브에서 내려받으실 수 있습니다. 내려받은 파일은 아래 설치 방법대로 Claude에 추가해 쓰시면 됩니다.","s":"","u":"https://hub.xconda.ai/qna/where-to-get-skills/","d":"2026-11-23"},{"k":"qna","t":"엑스콘다는 누가 만들었나요?","a":"엑스콘다는 대한민국의 주식회사 큐브베리(Cubeberry Co., Ltd.)가 개발하고 운영합니다. 큐브베리는 2023년에 설립되었고, KBS 드라마 PD 출신 이진서 대표와 방송 작가, 현업 감독, AI 영상 아티스트가 함께 설계했습니다. 엑스콘다 파이프라인으로 KBS 1TV 〈전설의 고향: 구미호〉(2025년 5월, 국내 방송사 최초 AI 애니메이션 본방송), KBS 다큐 〈한국전쟁 이동외상센터〉(2025년 6월), KBS 1TV 다큐 〈성물〉 생성 AI 파트(2026년 3월 방영)를 제작했고, 한국콘텐츠진흥원(KOCCA) 뉴미디어 신기술 콘텐츠랩에서 AI 웹드라마 4편을 제작 중입니다. 누적 3,100컷 이상의 방송급 AI 콘텐츠를 만들었습니다.","s":"XCONDA 공식 사이트 푸터 (https://www.xconda.ai) / 큐브베리 회사 소개 (https://www.cubeberry.ai/)","u":"https://hub.xconda.ai/qna/who-made-xconda/","d":"2026-10-11","h":"회사 이름 운영사 만든 곳 큐브베리"},{"k":"qna","t":"AI 영상은 왜 컷마다 얼굴이 바뀌나요?","a":"영상 AI에 글(프롬프트)만 넣으면, AI는 매번 새로 상상해서 그립니다. 그래서 같은 인물이라고 적어도 컷마다 얼굴, 옷, 구도가 조금씩 달라집니다. 이걸 막으려면 눈에 보이는 것은 이미지로 고정해야 합니다. 얼굴과 의상은 레퍼런스 이미지로, 공간은 배경 이미지로, 구도는 스토리보드로 알려주는 방식입니다. 엑스콘다의 제작 흐름은 이 고정 작업을 영상 생성 전에 끝내도록 짜여 있습니다.\nEP.00 전체 지도 블로그","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/why-faces-change-between-cuts/","d":"2026-10-21"},{"k":"qna","t":"퍼펫 영상은 왜 필요한가요?","a":"'왼쪽 문에서 들어와 탁자를 돌아 창가에 선다' 같은 움직임은 글로만 쓰면 엉뚱한 방향으로 걷는 경우가 많고, 여러 인물이 동시에 움직이면 글로는 통제가 어렵습니다. 퍼펫 영상을 함께 넣으면 시댄스가 동선을 글이 아니라 영상으로 읽습니다. 퍼펫은 사람처럼 보일 필요 없이 위치, 방향, 속도만 맞으면 됩니다.\nEP.00 전체 지도 블로그","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/why-puppet-video/","d":"2026-10-21"},{"k":"qna","t":"무제한으로 쓰고 싶으면요?","a":"엔터프라이즈를 위해 따로 신청하는 경로가 있어요. 그쪽은 조직·구성원 무제한이에요.","s":"","u":"https://hub.xconda.ai/qna/workspace-enterprise-unlimited/","d":"2026-11-18"},{"k":"qna","t":"구성원은 몇 명까지예요?","a":"Lite 1 · Plus 3 · Pro 5 · Studio 10 · Max 20명, 본인 포함이에요.","s":"","u":"https://hub.xconda.ai/qna/workspace-member-limit/","d":"2026-11-18"},{"k":"qna","t":"구독하면 조직이 몇 개예요?","a":"전 플랜에 조직 1개예요.","s":"","u":"https://hub.xconda.ai/qna/workspace-organization-count/","d":"2026-11-18"},{"k":"qna","t":"조직 크레딧은 구독 크레딧에서 자동으로 가요?","a":"아니요. 별도 신청이에요.","s":"","u":"https://hub.xconda.ai/qna/workspace-organization-credits-separate-request/","d":"2026-11-18"},{"k":"qna","t":"워크스페이스는 뭐예요?","a":"새로 생긴 팀 공간이에요. 11/17 오후 베타로 열렸고, 조직·프로젝트·공유 예산을 관리해요. 가이드 No.25가 있어요.","s":"","u":"https://hub.xconda.ai/qna/workspace-overview/","d":"2026-11-18"},{"k":"qna","t":"엑스콘다로 영상을 만드는 전체 순서가 궁금해요.","a":"큐브베리의 제작 흐름은 7단계입니다. 1) 시나리오 작성 2) 레퍼런스 이미지 확보(캐릭터 시트, Turn 배경) 3) 글콘티와 스토리보드 프롬프트 작성(Flex Board 스킬) 4) 스토리보드와 블로킹 영상(Flex Board, 블로킹 보드) 5) 시댄스 프롬프트 작성과 영상 생성 6) 사운드 제작 7) 영상과 사운드를 합쳐 완성. 이 중 4단계 스토리보드가 준비 작업과 영상 작업을 잇는 지점입니다. 자세한 내용은 허브 블로그의 「시나리오 한 편이 완성 영상이 되기까지」에서 보실 수 있습니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/xconda-video-workflow-overview/","d":"2026-11-14"},{"k":"qna","t":"다른 AI 영상 툴과 무엇이 다른가요?","a":"엑스콘다는 영상을 생성하기 전 단계에 더 깊이 집중합니다. 영상 AI에 글만 넣으면 컷마다 얼굴, 옷, 구도가 달라지기 쉽습니다. 엑스콘다는 Flex Board(컷별 스토리보드), Turn(360도 가상 세트), 블로킹 보드(인물 동선)로 얼굴, 공간, 구도, 동선을 먼저 고정한 뒤 영상을 생성하도록 제작 흐름을 설계했습니다. 방송 드라마 현장의 제작 방식을 AI 영상에 옮긴 구조입니다.","s":"XCONDA Hub 블로그 제작 워크플로우 소개","u":"https://hub.xconda.ai/qna/xconda-vs-other-ai-video-tools/","d":"2026-11-23"},{"k":"notice","t":"블로킹 보드 베타 무료 오픈: 프롬프트로 3D 블로킹, Seedance까지 한 번에","a":"블로킹 보드 베타를 무료로 오픈합니다(영상 생성 전 단계까지).\n장면 프롬프트만 넣으면 3D 공간과 인물이 구성되고, 마네킹 영상을 Seedance로 바로 보내 영상을 생성합니다.\n핵심 기능\n프롬프트 → 3D 구성: 장면 프롬프트 입력만으로 공간·인물 3D 모델링 자동 구성\n배우·카메라 배치: 인물 위치와 카메라 위치를 직접 조정\n마네킹 영상 생성: 배치 결과를 회색 마네킹 영상으로 확인\nSeedance 연동: 마네킹 영상을 Seedance로 바로 전송해 실제 영상 생성\n사용 방법\n장면 프롬프트 붙여넣기 → Create\nAdd camera로 카메라 추가\nOutput 탭에서 Seedance로 전송\n베타 기간 동안 지속 업데이트 예정입니다.","s":"","u":"https://hub.xconda.ai/notice/blocking-board-beta-free-open/","d":"2026-11-10"},{"k":"notice","t":"Kling 4.0 출시: XCONDA에서 최대 30초 영상 생성","a":"Kling 4.0을 XCONDA에서 바로 사용할 수 있습니다. 한 번에 최대 30초 영상을 만들 수 있고, 21:9 시네마틱 비율과 이미지·영상 레퍼런스를 지원합니다\nKling 4.0이 출시되었습니다. XCONDA에서 바로 사용하실 수 있습니다. 🎬\nKling 4.0은 한 번에 최대 30초 영상을 만들 수 있습니다. 이전 버전 Kling 3.0의 최대 15초보다 두 배 깁니다.\n주요 기능\n최대 30초 영상 생성: 3초부터 30초까지 1초 단위로 선택\n시네마틱 비율 지원: 16:9, 9:16, 1:1에 21:9 추가\n이미지·영상 레퍼런스: 프롬프트에서 @태그로 레퍼런스를 지정해 인물과 제품을 유지\n시작·끝 프레임 지정: 원하는 장면으로 시작하고 끝나는 영상 생성","s":"","u":"https://hub.xconda.ai/notice/kling-40-xconda/","d":"2026-11-06"},{"k":"notice","t":"KOCCA AI 웹드라마 4편 국내 쇼케이스 (11/27 서울영화센터) 참가 신청 안내","a":"AICCA 협회원 작품 런칭 공식행사, KOCCA AI 웹드라마 4편 국내 쇼케이스가 11월 27일(금) 17:00 서울영화센터 상영관 I에서 열립니다. 상영과 패널토크, 참가비 무료. 앞서 11월 25일(수)에는 4편의 제작 노하우를 나누는 Meet 라이브가 있습니다.\n안녕하세요. XCONDA를 만드는 큐브베리 대표 이진서입니다.\nAI로 만든 웹드라마 4편을 극장 스크린에서 처음 선보입니다. AICCA 협회원 작품 런칭 공식행사로 열리는 KOCCA AI 웹드라마 4편 국내 쇼케이스에 여러분을 초대합니다. 작품 상영과 함께 만든 사람들이 직접 이야기하는 패널토크가 이어집니다. 참가비는 무료입니다.\n🎬\nKOCCA AI 웹드라마 4편 국내 쇼케이스\n일시: 2026년 11월 27일 (금) 17:00 ~ 19:30\n장소: 서울영화센터 상영관 I (지하 1~2층)\n내용: AI 웹드라마 4편 상영 및 패널토크\n참가비: 무료\n👉 쇼케이스 참가 신청하기\n상영작\n이상한나라의 이엘\nDIVISION 0\n콜드사이트\n목구멍포도청\n쇼케이스 전에: 제작 노하우 Meet 라이브 (11/25)\n쇼케이스 이틀 전, 4편을 만든 과정을 그대로 공개하는 온라인 라이브를 엽니다. 주제는 DIRECT FIRST, THEN GENERATE. 생성보다 연출이 먼저라는 원칙으로 실제 현장에서 쓴 방법을 나눕니다.","s":"","u":"https://hub.xconda.ai/notice/kocca-ai-webdrama-showcase/","d":"2026-11-20","p":1},{"k":"notice","t":"KOCCA AI 웹드라마 4편 국내 쇼케이스 (11/27 서울영화센터) 참가 신청 안내","a":"💡\nAI 웹드라마 제작 노하우 스킬 대방출\n일시: 2026년 11월 25일 (수) 오후 5:00 ~ 7:00\n방식: Google Meet 라이브 (온라인)\n👉 Meet 라이브 신청하기\n순서 | 주제 | 내용 |\nCUT 01 | 프롬프트 스킬 5단계 | 시나리오 → 블로킹보드 → 영상 생성 |\nCUT 02 | 캐릭터·공간 일관성 | 컷이 달라도 무너지지 않는 법 |\nCUT 03 | 실패 사례와 체크리스트 | 돈과 시간을 아끼는 제작법 |\nCUT 04 | 라이브 Q&A | 내 작품, 현장에서 바로 묻기 |\n라이브에서 노하우를 먼저 듣고 쇼케이스에서 완성작을 보시면, 같은 작품이 훨씬 다르게 보일 겁니다.\n신청 방법\n위 신청 링크를 누르거나, 포스터의 QR 코드를 스마트폰 카메라로 비춥니다.\n신청서를 작성해 제출합니다.\n쇼케이스(11/27)와 Meet 라이브(11/25)는 신청서가 따로 있습니다. 둘 다 참여하시려면 두 곳 모두 신청해 주세요.\n문의: cuberry01@gmail.com","s":"","u":"https://hub.xconda.ai/notice/kocca-ai-webdrama-showcase/","d":"2026-11-20","p":2},{"k":"notice","t":"Seedance 2.5 프로모션 — 최대 30% 할인 (10/7~11/6, 종료)","a":"XCONDA에서 Seedance 2.5 프로모션을 진행했습니다. 10월 7일 오전 11시부터 11월 6일 오전 11시까지(KST) 최대 30% 할인했으며, 11월 6일에 종료되었습니다. 36컷 스토리보드 엔진 FLEXBOARD 출시 기념 프로모션이었습니다.\n⚠️\n종료된 행사입니다. 이 프로모션은 2026년 11월 6일 오전 11시(KST)에 종료되었습니다. 현재 할인 행사는 XCONDA 뉴스에서 확인해 주세요.\nXCONDA에서 Seedance 2.5 프로모션을 시작합니다.\n프로모션 개요\n항목 | 내용 |\n기간 | 2026년 10월 7일 오전 11시 → 11월 6일 오전 11시 (KST) |\n혜택 | 최대 30% 할인 |\n대상 | Seedance 2.5 |\n단순한 할인 이상의 의미\n이번 프로모션은 Seedance 2.5와 유기적으로 맞물려 동작하도록 설계된 36컷 스토리보드 엔진 FLEXBOARD의 정식 출시를 기념해 준비한 런칭 프로모션입니다.\n원문 (X 게시글)\nSeedance 2.5 promotion begins today at 11 AM (KST) on XCONDA. 🎉\n📅 October 7, 11 AM – November 6, 11 AM (KST)\n✅ Up to 30% off\nThis promotion is more than just a discount.","s":"","u":"https://hub.xconda.ai/notice/seedance-2-5-promotion-30-off/","d":"2026-11-08","p":1},{"k":"notice","t":"Seedance 2.5 프로모션 — 최대 30% 할인 (10/7~11/6, 종료)","a":"To celebrate the launch of FLEXBOARD, our new 36-shot storyboard engine designed specifically to work seamlessly with Seedance 2.5, we're introducing a special launch promotion.\n👉 xconda.ai\n#ai #seedance #seedance25 #aivideo\nX 원문 보기 (@Xconda_official, 2026.10.07)","s":"","u":"https://hub.xconda.ai/notice/seedance-2-5-promotion-30-off/","d":"2026-11-08","p":2},{"k":"notice","t":"Seedance 2.5 업데이트 — 30초 영상 생성·영상+오디오 동시 생성 등 5가지 기능","a":"Seedance 2.5 API가 XCONDA에서 정식 제공됩니다. 최대 30초 영상 생성, 영상·오디오 동시 생성, 레퍼런스 최대 50개, 타임스탬프 기반 편집, 그린스크린 배경 교체를 지원합니다.\nSeedance 2.5 API가 정식 제공(Generally Available)됩니다. XCONDA에서 바로 사용하실 수 있습니다. 🚀\n업데이트된 5가지 기능\n기능 | 내용 |\n긴 영상 생성 | 최대 30초 분량의 영상을 끊김 없이 생성 |\n영상+오디오 동시 생성 | 영상과 소리를 한 번에 같이 생성 |\n대용량 레퍼런스 | 이미지·영상·오디오 파일을 최대 50개까지 참조 |\n타임스탬프 편집 | 시간 지점을 지정해 해당 구간만 편집 |\n그린스크린 | 배경 교체 지원 |\n🔗 xconda.ai 바로가기\n원문 (X 게시글)\nSeedance 2.5, has been updated. 🚀\n✨Generate up to 30 seconds of video seamlessly\n✨Generate video and audio simultaneously\n✨Reference up to 50 images, videos, and audio files\n✨Timestamp-based editing\n✨green screen background replacement\n🔗 xconda.ai\nX 원문 보기 (@Xconda_official, 2026.08.25)","s":"","u":"https://hub.xconda.ai/notice/seedance-2-5-update/","d":"2026-10-23"},{"k":"notice","t":"Seedance 2.5 Draft Mode 업데이트: 초안 보관 기간 최대 14일로 연장","a":"Seedance 2.5 Draft Mode의 초안 영상 보관 기간이 7일에서 최대 14일로 늘어납니다.\nSeedance 2.5 Draft Mode의 초안 보관 기간이 늘어납니다. 🎬\n지금은 초안 영상을 7일까지 보관할 수 있지만, 업데이트 후에는 최대 14일까지 보관됩니다. 초안을 더 오래 비교해 본 뒤 최종본으로 만들 수 있습니다.\n알아두세요\n업데이트 이후 생성한 초안부터 최대 14일까지 보관됩니다.\n업데이트 이전에 생성한 초안은 기존과 같이 7일까지만 유효합니다. 소급 적용되지 않습니다.\n추가 안내 (2026년 11월 14일)\n14일은 초안을 1080p로 바꿀 수 있는 기간입니다. 14일이 지나면 1080p 전환 버튼만 사라지고, 초안 영상은 결과물로 계속 남습니다.","s":"","u":"https://hub.xconda.ai/notice/seedance-25-draft-14-days/","d":"2026-11-14"},{"k":"notice","t":"Seedance 2.5 Draft 기능 추가 — 480p 초안으로 확인하고 1080p로 완성","a":"Seedance 2.5에 Draft 기능이 추가되었습니다. 480p 초안으로 결과를 먼저 확인하고, 마음에 드는 초안만 1080p 최종본으로 만들어 크레딧을 아낄 수 있습니다.\n480p 초안으로 결과를 먼저 확인한 뒤, 마음에 드는 초안만 1080p 최종본으로 만들 수 있습니다. 원하는 결과가 나올 때까지 초안을 여러 번 생성해 볼 수 있어 크레딧을 아낄 수 있습니다.\n이용 방법\n입력 패널에서 Draft로 초안 생성\n결과 확인 후 마음에 드는 초안 선택\n최종 생성 버튼으로 최종본 완성\n알아두세요\nSeedance 2.5 전용 기능입니다.\n초안은 생성 후 7일간 유효하며, 기간이 지나면 최종본으로 만들 수 없습니다.\n최종본은 초안과 같은 에셋으로 새로 생성되므로 세부 표현이 일부 달라질 수 있습니다.\n최종본 생성에 실패하면 차감된 크레딧은 환불됩니다.","s":"","u":"https://hub.xconda.ai/notice/seedance-25-draft-480p-preview/","d":"2026-10-24"},{"k":"notice","t":"Seedance 30% 할인 적용 — 패키지별 제작 가능 수량 (종료)","a":"행사 기간(10월 7일~11월 6일 KST)에 크레딧 사용량 30% 할인을 적용했을 때 패키지별로 만들 수 있던 Seedance 영상 수량입니다. 할인은 11월 6일 오전 11시에 종료되었으며, 지금은 기존 수량이 적용됩니다.\n⚠️\n종료된 행사입니다. 30% 할인은 2026년 11월 6일 오전 11시(KST)에 종료되었습니다. 아래 표의 '할인 후' 수량은 행사 기간 기준이며, 지금은 '기존' 수량이 적용됩니다.\n크레딧 사용량 30% 할인을 적용하면 패키지 가격은 그대로인 채로 같은 패키지에서 더 많은 영상을 만들 수 있습니다. 아래는 클립 길이별 크레딧과 패키지별 제작 가능 수량입니다.\n클립 길이별 크레딧\n클립 길이 | 기존 크레딧 | 할인 후 크레딧 |\n4초 클립 | 368 cr | 약 258 cr |\n5초 클립 | 460 cr | 322 cr |\n15초 클립 | 1,380 cr | 966 cr |\n패키지별 제작 가능 수량 (기존 → 할인 후)\n패키지 | Starter V1 | Starter V2 | Pro V1 | Pro V2 |\n4초 클립 | 5개 → 7개 | 16개 → 24개 | 28개 → 40개 | 58개 → 83개 |\n5초 클립 | 4개 → 6개 | 13개 → 19개 | 22개 → 32개 | 46개 → 66개 |","s":"","u":"https://hub.xconda.ai/notice/seedance-30-off-package-quantities/","d":"2026-11-13","p":1},{"k":"notice","t":"Seedance 30% 할인 적용 — 패키지별 제작 가능 수량 (종료)","a":"15초 클립 | 1개 → 2개 | 4개 → 6개 | 7개 → 10개 | 15개 → 22개 |\nMaster 패키지 (114,000 cr 기준)\n클립 길이 | 기존 | 할인 후 |\n4초 클립 | 309개 | 442개 |\n5초 클립 | 247개 | 354개 |\n15초 클립 | 82개 | 118개 |\n할인 안내 · 패키지 가격은 동일하며, 기존 표시 크레딧에서 30% 차감된 사용량을 적용했습니다. 계산 결과는 가장 가까운 정수 크레딧 및 제작 가능 수량으로 반올림했습니다.\ncr = credits\n관련 공지: Seedance 2.5 프로모션 — 최대 30% 할인 (10/7~11/6, 종료)","s":"","u":"https://hub.xconda.ai/notice/seedance-30-off-package-quantities/","d":"2026-11-13","p":2},{"k":"notice","t":"Seedance 크레딧 단가표: 해상도·영상 길이별 차감 크레딧","a":"Seedance 영상 생성 시 해상도·영상 길이별 차감 크레딧과 영상 레퍼런스 입력 시 단가 안내.\nSeedance 영상 생성 크레딧 단가 안내\n1. 영상 생성 단가\n영상 길이에 따라 차감 크레딧 상이\n해상도 | 초당 | 4초 | 5초 | 10초 | 15초 |\n480p | 29cr | 115cr | 144cr | 287cr | 431cr |\n720p | 64cr | 258cr | 322cr | 644cr | 966cr |\n1080p | 158cr | 633cr | 791cr | 1,582cr | 2,373cr |\n2. 영상 레퍼런스 입력 시 단가\n입력 영상 길이 + 출력 영상 길이 합산 과금\n예: 5초 입력 + 5초 출력 = 총 10초 기준\n480p | 24cr | 96cr | 120cr | 240cr | 360cr |\n720p | 55cr | 220cr | 275cr | 550cr | 825cr |\n1080p | 135cr | 540cr | 675cr | 1,350cr | 2,025cr |","s":"","u":"https://hub.xconda.ai/notice/seedance-credit-pricing/","d":"2026-11-11","h":"시댄스 가격 크레딧 단가 초당 해상도 몇 크레딧"},{"k":"notice","t":"Seedream 5.5 3K 오픈: 11월 27일부터 고해상도 이미지 생성 가능","a":"11월 27일(금)부터 XCONDA에서 Seedream 5.5 3K 화질 이미지 생성 가능.\n11월 27일(금)부터 Seedream 5.5 3K 화질 XCONDA 오픈 🖼️\nSeedream 5.5에 3K 화질 추가. 11월 27일부터 XCONDA에서 3K 고해상도 이미지 생성 가능.\n3K 고해상도 이미지 생성\n디테일이 중요한 포스터·키 비주얼·상세 이미지 작업에 적합","s":"","u":"https://hub.xconda.ai/notice/seedream-55-3k/","d":"2026-11-26"},{"k":"notice","t":"Seedream 5.5 출시: XCONDA 이미지 기본 모델, 지금 40% 할인","a":"XCONDA 이미지 기본 모델이 Seedream 5.5로 바뀌었습니다. 여러 번 수정해도 구도·조명·색이 유지되고, 지금 40% 할인가로 만들 수 있습니다.\nXCONDA에 Seedream 5.5가 왔습니다. 이제 XCONDA 이미지 기본 모델은 Seedream 5.5입니다. 🎨\n수정은 100번, 퀄리티는 그대로. 한 장을 계속 고쳐도 구도·조명·색이 무너지지 않습니다.\n주요 특징\n반복 수정에도 유지: 한 장을 계속 고쳐도 구도·조명·색이 무너지지 않습니다\n투명 배경 바로 출력: 따로 자를 필요 없이 바로 나옵니다\n또렷한 작은 글자: 작은 글자도 선명하게 표현합니다\n할인 안내\n대상: Seedream 5.5 이미지 생성\n혜택: 40% 할인","s":"","u":"https://hub.xconda.ai/notice/seedream-55-xconda/","d":"2026-11-17"},{"k":"notice","t":"웰컴 크레딧 500 지급","a":"XCONDA에 새로 가입하면 웰컴 크레딧 500을 다시 받을 수 있습니다.\nXCONDA 웰컴 크레딧 지급을 다시 시작합니다. 🎁\n새로 가입하시면 500크레딧을 바로 드립니다. 받은 크레딧으로 Flex Board, 블로킹 보드, 영상·이미지 생성을 결제 없이 먼저 사용해 보실 수 있습니다.\n지급 안내\n대상: 신규 가입자\n지급: 500크레딧\n지급 시점: 가입 즉시 자동 지급","s":"","u":"https://hub.xconda.ai/notice/welcome-credits-500/","d":"2026-11-06","h":"무료 공짜 체험 신규 가입 혜택"},{"k":"notice","t":"XCONDA 홈페이지 개편","a":"Flex Board, 블로킹 보드, Turn의 특징을 한눈에 비교하고 내 작업에 맞는 툴을 쉽게 고를 수 있습니다.\nXCONDA 홈페이지 개편 | Flex Board·블로킹 보드·Turn\nXCONDA 홈페이지가 새로워졌습니다. 🎬\n연출 툴 3종의 특징을 한 화면에서 비교하고, 내 작업에 맞는 툴을 쉽게 고를 수 있습니다.\nFlex Board: 대본을 컷별 스토리보드로\n블로킹 보드: 인물 동선과 카메라 리허설\nTurn: 360° 가상 세트와 공간\n대본부터 Seedance 2.5 영상까지 이어지는 제작 흐름도 함께 확인할 수 있습니다. 홈페이지는 English, 한국어, 日本語, 简体中文 4개 언어로 볼 수 있습니다.","s":"","u":"https://hub.xconda.ai/notice/xconda-landing-renewal/","d":"2026-11-03"},{"k":"notice","t":"XCONDA 다국어 지원: 영어·한국어·일본어·중국어","a":"XCONDA 화면을 영어·한국어·일본어·중국어 4개 언어로 이용할 수 있습니다. 메뉴와 버튼 등 화면 문구를 원하는 언어로 바꿔 사용할 수 있습니다.\nXCONDA가 4개 언어를 지원합니다. 🌏\n메뉴, 버튼, 안내 문구 등 XCONDA 화면 전체를 원하는 언어로 바꿔 사용할 수 있습니다.\n지원 언어\nEnglish\n한국어\n日本語\n中文\n이용 방법\n화면의 언어 설정에서 원하는 언어 선택","s":"","u":"https://hub.xconda.ai/notice/xconda-multilanguage-support/","d":"2026-11-10"},{"k":"notice","t":"XCONDA 워크스페이스 베타 오픈: 팀 프로젝트·멤버·크레딧을 한곳에서","a":"11월 17일, 기업·팀용 XCONDA 워크스페이스 베타 오픈. 팀 프로젝트와 멤버, 크레딧을 한곳에서 관리합니다.\n11월 17일, 기업·팀용 XCONDA 워크스페이스 베타 오픈 🏢\n팀 프로젝트와 멤버, 크레딧을 한곳에서 관리하는 기업용 공간.\n이런 팀에 추천\n여러 담당자가 같은 프로젝트 결과물을 공유해야 하는 팀\n프로젝트마다 제작 예산을 나눠 관리해야 하는 조직\n프로젝트별 사용량 확인이 필요한 기업\n주요 기능\n프로젝트별 크레딧 예산: 조직 지갑의 크레딧을 프로젝트별 예산으로 배정. 각 프로젝트는 배정된 예산 안에서 생성. 예산 배정은 지갑에 있는 크레딧을 나누는 것이며, 크레딧이 새로 생기지는 않음.\n멤버와 역할 관리: 워크스페이스 초대와 프로젝트 배정을 따로 관리. 배정된 프로젝트에만 접근 가능.\n사용량 확인: Usage & budget에서 조직 크레딧 잔액, 프로젝트별 배정 예산, 전체 사용량, 7일·30일 사용 추이 확인.\n운영 기록·설정: Operation logs에서 예산 변경 등 주요 작업 기록 확인. Settings에서 조직 이름·언어·시간대·로고·기본 색상 설정.\n도입 방법\n무료 상담 신청으로 시작. 신청 비용 없음.\n워크스페이스 도입 상담 페이지(xconda.ai/workspace)에서 신청서 작성","s":"","u":"https://hub.xconda.ai/notice/xconda-workspace-beta-open/","d":"2026-11-17","p":1},{"k":"notice","t":"XCONDA 워크스페이스 베타 오픈: 팀 프로젝트·멤버·크레딧을 한곳에서","a":"영업일 기준 2일 이내 담당자 이메일 회신 (메일이 안 보이면 스팸함 확인)\n상담 후 요금·계약·개통 절차 안내\n필수 항목: 회사명, 담당자 이름, 업무 이메일, 예상 사용 인원, 개인정보 수집·이용 동의\n선택 항목: 연락처, 희망 도입 시기, 문의 내용(사용 목적, 주요 작업 유형, 필요 기능 등)\n개인정보 보관 기간: 상담 종료 후 1년 보관 후 파기\n소규모 팀은 상담 없이 Pricing에서 바로 이용 가능\n베타 1 이용 범위\n결과물 Reuse는 같은 프로젝트 안에서만 가능\n카드 결제, 청구서, PDF 내보내기는 이후 업데이트(Beta 2)에서 제공 예정\n👉 워크스페이스 도입 상담 신청하기","s":"","u":"https://hub.xconda.ai/notice/xconda-workspace-beta-open/","d":"2026-11-17","p":2},{"k":"guide","t":"FLEXBOARD로 컷별 스토리보드 만들기 7단계 (AI 영상제작 과정 EP.03)","a":"시나리오를 컷별 스토리보드로 만들고, 문제 있는 컷만 골라 고친 뒤 시댄스(Seedance) 2.5로 넘기는 FLEXBOARD 사용법을 7단계로 정리했습니다.\n이 글에서 배우는 것: 시나리오를 컷별 스토리보드로 만들고, 문제 있는 컷만 골라 고친 뒤 시댄스(Seedance) 2.5로 넘기는 방법\n이런 분께: AI 영상을 처음 만들어 보는 분, 영상을 돌리다 크레딧을 낭비한 경험이 있는 분\n준비물: XCONDA 계정과 크레딧, 시나리오 한 장면, (있다면) Turn으로 만든 배경 이미지. 이미지 생성과 재생성 버튼에는 필요한 크레딧이 화면에 표시됩니다.\n이 글은 \"AI 영상제작 과정\" 연재 중 스토리보드 편입니다. 지난 글 「XCONDA Turn으로 360도 세트 만들기」에서 만든 배경과 키 이미지를 여기서 사용합니다.\nFLEXBOARD는 어디에 있나요\nXCONDA 왼쪽 메뉴에서 Studio로 들어가 Storyboard를 열면 FLEXBOARD 카드가 보입니다. \"시댄스 2.5에 최적화된 스토리보드 도구\"라고 적힌 카드입니다. 카드를 누르고 New Project를 선택하면 시작합니다.\n1단계: 프로젝트 설정\n화면 위쪽에 작업 단계가 세 개의 버튼으로 표시됩니다.\nProject settings: 프로젝트 기본 설정","s":"","u":"https://hub.xconda.ai/guide/flexboard-storyboard-guide/","d":"2026-11-08","p":1},{"k":"guide","t":"FLEXBOARD로 컷별 스토리보드 만들기 7단계 (AI 영상제작 과정 EP.03)","a":"Scene Settings: 시나리오, 인물과 배경, 컷 수 설정\nEdit Panel: 만들어진 컷을 보고 고치기\n이 글의 1~5단계가 앞의 두 버튼, 6~7단계가 Edit Panel에 해당합니다. 먼저 세 가지를 정합니다.\n작업 방식\n이미지 모델: 화면 왼쪽 위 드롭다운에서 컷 이미지를 그릴 모델을 고릅니다. 현재 고를 수 있는 모델은 네 가지입니다.\n프로젝트 이름: 나중에 목록에서 찾기 쉬운 이름으로 적습니다. 예: \"웹드라마_1화_대청마루씬\"\n2단계: 시나리오, 장르, 분위기 적기\nScenario 칸에 장면을 적습니다. \"누가, 어디서, 무엇을, 어떤 감정으로\"가 들어가면 컷을 검토하기 쉬워집니다. 일이 여러 개 일어나면 순서대로 적습니다.\n예를 들면 이렇습니다.\n비 오는 밤, 한옥 대청마루. 수연이 깨진 도자기 조각을 들고 서 있다. 대문 쪽에서 발소리가 들리고, 수연은 조각을 등 뒤로 숨긴다. 문이 열리고 어머니가 들어온다. 두 사람은 말없이 서로를 바라본다.\n그다음 Genre(예: Suspense)와 Tone / Mood(예: Tense)를 고르고 Save project로 저장합니다.\n3단계: 인물과 배경 등록하기 (Reference Assets)\n컷이 바뀌어도 같은 인물, 같은 장소가 나오게 하는 단계입니다. Reference Assets 영역에 Cast(인물) 카드와 Background(배경) 카드를 등록합니다.","s":"","u":"https://hub.xconda.ai/guide/flexboard-storyboard-guide/","d":"2026-11-08","p":2},{"k":"guide","t":"FLEXBOARD로 컷별 스토리보드 만들기 7단계 (AI 영상제작 과정 EP.03)","a":"Add Cast를 눌러 인물 카드를 만듭니다. 카드마다 @image1, @image2 같은 이름표(토큰)가 자동으로 붙습니다.\n카드에 얼굴 이미지와 알아보기 쉬운 이름을 넣습니다. 예: 수연, 어머니\n반복해서 나오는 소품도 카드로 등록할 수 있습니다. 예: 깨진 도자기\n배경 카드(Background)를 추가합니다. 지난 글에서 Turn으로 만든 공간 이미지를 여기에 넣으면 좋습니다.\n토큰이 하는 일: 컷 설명 안에 \"@image1\"처럼 표시되어, 이 컷에 누가 나오는지 한눈에 보입니다. 영상 프롬프트에서도 같은 방식으로 인물을 가리키게 됩니다.\n주의: 인물은 한 사람당 카드 하나로 등록하세요. 카드를 교체하거나 지운 뒤에는 토큰 번호와 컷 설명이 여전히 맞는지 다시 확인해야 합니다.\n4단계: 컷 수와 컷 길이 정하기\nNumber of Panels: 컷 수를 정합니다. 화면 예시는 9컷입니다.\nShot Length: 컷 하나의 길이를 정합니다. 4초에서 30초 사이로 조절할 수 있습니다.\n예를 들어 9컷 × 15초로 설정하면 단순 합계는 약 2분 15초입니다. 실제 완성 길이는 이후 영상 작업에 따라 달라질 수 있습니다.\n컷 수는 장면이 바뀌는 지점을 기준으로 정하세요. 위 예시라면 \"도자기를 든 수연 / 발소리 / 숨기는 손 / 문이 열림 / 어머니 등장 / 마주 보는 두 사람\"처럼 나눌 수 있습니다.","s":"","u":"https://hub.xconda.ai/guide/flexboard-storyboard-guide/","d":"2026-11-08","p":3},{"k":"guide","t":"FLEXBOARD로 컷별 스토리보드 만들기 7단계 (AI 영상제작 과정 EP.03)","a":"5단계: 이미지보다 글로 먼저 확인하기 (Text Preview)\n화면 아래 노란 Text Preview Generate 버튼을 누르면, 이미지를 만들기 전에 컷별 글 콘티가 먼저 나옵니다. 각 CUT 카드에서 세 가지를 확인합니다.\n장면 설명이 의도한 순서대로 나왔는가\n@image 토큰이 맞는 인물을 가리키는가\n아래쪽 SFX(효과음) 설명이 장면 분위기와 맞는가\n컷 순서나 인물, 장면 전환이 어색하면 이미지를 만들기 전에 시나리오나 컷 수로 돌아가서 고칩니다. 글 단계에서 고치는 것이 가장 빠릅니다.\n6단계: Edit Panel에서 컷 확인하기 (Panel 보기와 Sheet 보기)\n이미지를 생성하면 Edit Panel 단계로 넘어갑니다. 모델 선택 옆의 Panel / Sheet 버튼으로 보는 방식을 바꿀 수 있습니다.\n보기 | 화면 | 언제 쓰나 |\nPanel | 컷마다 카드 하나. 이미지 아래에 Edit 버튼, 장면 설명, 대사(Dialogue), 효과음(SFX)이 함께 나옴 | 컷 하나하나를 읽고 고칠 때 |\nSheet | 설명 없이 컷 이미지만 크게 한 장에 모아서 보여줌 | 전체 흐름을 한눈에 볼 때 |\nSheet로 먼저 전체 흐름을 봅니다. 글 없이 그림만 이어서 보면, 실제 영상처럼 컷이 이어지는지 판단하기 쉽습니다.","s":"","u":"https://hub.xconda.ai/guide/flexboard-storyboard-guide/","d":"2026-11-08","p":4},{"k":"guide","t":"FLEXBOARD로 컷별 스토리보드 만들기 7단계 (AI 영상제작 과정 EP.03)","a":"컷 순서가 뒤바뀌거나 빠진 장면은 없는가\n앞뒤 컷이 자연스럽게 이어지는가 (의상, 소품, 조명, 시선 방향)\n같은 인물이 컷마다 같은 얼굴로 나오는가\n화면 오른쪽 위에는 세 가지 버튼이 있습니다.\nDownload CUT ZIP(Panel 보기) / Download Sheet(Sheet 보기): 컷 이미지를 한꺼번에 내려받거나, 시트 한 장으로 내려받습니다. 팀원이나 클라이언트에게 콘티를 공유할 때 씁니다.\nRegenerate images: 이미지를 다시 생성합니다. 버튼에 필요한 크레딧이 표시되니 누르기 전에 확인하세요.\nClear Sheet: 시트를 비웁니다. 되돌리기 어려울 수 있으니 내려받은 뒤에 쓰는 것이 안전합니다.\n7단계: 문제 있는 컷만 골라 고치기\n잘 나온 컷은 그대로 두고, 문제 있는 컷만 고칩니다. Panel 보기에서 고칠 컷 카드의 Edit를 누르면 그 컷만 따로 수정할 수 있습니다. 컷 카드에는 다음 도구가 있습니다.\n도구 | 하는 일 |\nEdit | 빠른 수정 창 열기 |\n+ | 컷에 쓰이는 요소 추가 |\n휴지통 | 컷 삭제 |\n↓ / ↑ | 컷 이미지 내려받기 / 외부 이미지로 교체 |\n↑(올리기)를 쓰면 Turn에서 만든 키 이미지를 그 컷에 바로 넣을 수도 있습니다. 프롬프트로 잘 안 나오는 구도를 해결할 때 유용합니다.","s":"","u":"https://hub.xconda.ai/guide/flexboard-storyboard-guide/","d":"2026-11-08","p":5},{"k":"guide","t":"FLEXBOARD로 컷별 스토리보드 만들기 7단계 (AI 영상제작 과정 EP.03)","a":"빠른 수정 (Quick Edit)\n고칠 컷의 Edit를 누르고, 창 위쪽의 컷 번호(예: CUT 04)가 맞는지 확인합니다.\n필요하면 Reference images에 참고 이미지를 추가합니다.\nEdit prompt에 바꿀 내용을 한 문장으로 적습니다. @토큰으로 인물을 가리킬 수 있습니다.\n대상 컷과 지시 내용, 크레딧 안내를 확인하고 Apply edit를 누릅니다.\n지시문 쓰는 요령: 바꿀 것과 유지할 것을 함께 적으세요. 예: \"안경만 바꾸고, 자세와 배경은 그대로 유지\" 예: \"@image1의 표정만 놀란 표정으로, 손에 든 도자기와 배경은 그대로\"\n자세한 수정 (Detailed Edit) 카메라를 바꾸고 싶을 때 씁니다. 오른쪽에서 세 가지를 조절합니다.\nShot Size: 화면에 얼마나 담을지 (예: Extreme Wide Shot, Close-up)\nCamera Angle: 카메라 높이와 기울기 (예: Low Angle, Dutch Angle)\nCamera Movement: 카메라 움직임 (예: Handheld, Track Out)\n화면 예시에서는 \"POV · Low Angle · Handheld\"였던 긴장감 있는 근접 구도를 \"Extreme Wide Shot · Dutch Angle · Track Out\"으로 바꿔, 넓게 기울어진 화면에서 카메라가 뒤로 빠지는 구도로 다시 만들었습니다. 설정을 확인한 뒤 Regenerate를 누르면 되고, 이때도 화면에 표시되는 크레딧을 확인하세요.","s":"","u":"https://hub.xconda.ai/guide/flexboard-storyboard-guide/","d":"2026-11-08","p":6},{"k":"guide","t":"FLEXBOARD로 컷별 스토리보드 만들기 7단계 (AI 영상제작 과정 EP.03)","a":"참고 이미지 순서 바꾸기 컷 생성에 쓰이는 인물과 배경 카드는 목록으로 관리됩니다. 인물은 인물끼리, 배경은 배경끼리 끌어서 순서를 바꿀 수 있고, Reset to automatic selection을 누르면 기본 선택으로 돌아갑니다. 순서를 바꾼 뒤에는 컷 이미지를 다시 생성해야 반영됩니다.\n시댄스로 넘기기 전 최종 점검\n스토리보드가 완성되면 영상 단계로 넘어갑니다. 넘기기 전에 아래를 확인하세요.\nSheet 보기로 컷이 자연스럽게 이어지는지 확인했는가\n모든 컷의 이미지와 설명이 맞는가\n인물 토큰이 컷마다 정확한가\n빠진 컷은 없는가\n컷 길이, 화면 크기, 카메라 각도, 카메라 움직임이 컷의 의도와 맞는가\n여기서 확인한 컷 이미지가 영상 프롬프트의 기준이 됩니다. 구도를 고치는 비용은 이 단계가 가장 작습니다. 영상으로 넘어간 뒤에 구도를 고치려면 영상을 여러 번 다시 돌려야 하기 때문입니다.\n자주 하는 실수\n글 콘티를 건너뛰고 바로 이미지를 만든다: 컷 순서가 틀린 채로 이미지를 만들면 다시 만들어야 합니다.\n같은 인물을 카드 여러 개로 등록한다: 토큰이 헷갈리고 얼굴이 섞일 수 있습니다.\n수정 지시문에 바꿀 것만 적는다: 유지할 것을 적지 않으면 다른 부분까지 바뀔 수 있습니다.","s":"","u":"https://hub.xconda.ai/guide/flexboard-storyboard-guide/","d":"2026-11-08","p":7},{"k":"guide","t":"FLEXBOARD로 컷별 스토리보드 만들기 7단계 (AI 영상제작 과정 EP.03)","a":"잘 나온 컷까지 다시 생성한다: 문제 있는 컷만 골라 Panel 보기에서 Edit로 고치세요.\nPanel 보기로만 검토한다: 글을 읽다 보면 그림이 실제로 이어지는지 놓치기 쉽습니다. Sheet 보기로 그림만 이어서 보는 단계를 꼭 거치세요.\n중간에 이미지 모델을 바꾼다: 컷마다 그림 느낌이 달라질 수 있습니다.\n다음 편 예고\n다음 글에서는 여러 인물이 움직이는 장면에서 동선이 엉키지 않도록, 블로킹 보드로 퍼펫 영상을 만들어 동선을 잡는 법을 다룹니다.\nAI 영상제작 과정 연재\nEP.00 전체 지도: 시나리오 한 편이 완성 영상이 되기까지\nEP.02 레퍼런스: XCONDA Turn으로 360도 세트 만들기\nEP.03 스토리보드: FLEXBOARD로 컷별 스토리보드 만들기 (지금 읽는 글)\nEP.04 블로킹: 블로킹 보드로 동선 잡기 (예정)\nEP.05 영상 생성: 시댄스에 넣는 네 가지 (예정)\n지금 시작하시는 분들께\n엑스콘다는 신규 가입 시 500크레딧을 드립니다. 진행 중인 할인 행사는 XCONDA 뉴스에서 확인해 주세요.\n도입이나 협업 문의는 아래로 연락 주세요.\n이메일: cubeberry@cuberry.kr\n전화: +82-70-8095-2302 (평일 10:00~17:00)\n오늘도 긴 글 읽어주셔서 감사합니다!","s":"","u":"https://hub.xconda.ai/guide/flexboard-storyboard-guide/","d":"2026-11-08","p":8},{"k":"guide","t":"[입력 조건 안내 ①] XCONDA Image Generator: 모델별 옵션과 참조 파일 규격","a":"Image Generator에서 모델마다 다른 프롬프트 글자 수·해상도·결과 비율·참조 한도와 참조 파일 규격을 정리했습니다. 입력 조건 안내 시리즈 1편입니다.\n안녕하세요. XCONDA를 만드는 큐브베리 대표 이진서입니다.\n생성 버튼이 눌리지 않거나, 올린 파일이 \"사용 불가\"로 바뀌어 당황하신 적 있으신가요? 대부분 모델마다 다른 입력 조건 때문입니다. 그래서 XCONDA Video·Image Generator의 입력 조건을 두 편으로 나눠 정리했습니다. 이번 1편은 Image Generator, 2편은 Video Generator입니다.\n📚\n입력 조건 안내 시리즈 (v1.0)\nImage Generator 편 (지금 보는 글)\n[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격\n먼저, 두 도구에 공통인 조건\n항목 | 조건 |\n프롬프트 | 필수 입력입니다. 모델마다 최소·최대 글자 수가 다르며, 프롬프트에 넣은 @ 참조 표기도 글자 수에 포함됩니다 |\nInput Assets 보관 | Video Generator 최대 50개, Image Generator 최대 15개. 보관 개수와 실제로 생성에 쓰이는 참조 개수는 별개이며, 후자는 모델별 한도를 따릅니다 |","s":"","u":"https://hub.xconda.ai/guide/xconda-image-generator-input-guide/","d":"2026-11-07","p":1},{"k":"guide","t":"[입력 조건 안내 ①] XCONDA Image Generator: 모델별 옵션과 참조 파일 규격","a":"참조 한도 초과 | 모델 한도를 넘는 파일은 삭제되지 않고 \"사용 불가\" 상태로 남으며, 생성에 포함되지 않습니다 |\n@ 참조 지정 | 참조를 지원하는 모델에서는 프롬프트에 @를 입력해 특정 참조를 지칭할 수 있습니다. 지칭한 참조가 꺼져 있거나 삭제되면 생성할 수 없습니다 |\n업로드 중 | 파일 업로드가 끝나기 전에는 Generate 버튼이 눌리지 않습니다 |\nAsset Library | Asset Library에서 고른 파일에도 직접 올린 파일과 같은 규격이 적용됩니다 |\n💡\n알아 두면 좋은 점\n파일 형식은 확장자가 아니라 실제 파일 내용으로 판정합니다. 확장자만 바꾼 파일은 받지 않습니다.\n아이폰 사진(HEIC/HEIF)은 브라우저가 열지 못하면 올라가지 않습니다. JPEG나 PNG로 바꿔 올리는 것이 안전합니다.\n1. 모델별 옵션과 참조 한도\n기본 모델은 Seedream 5.0 Lite입니다.\n모델 | 프롬프트 글자 수 | 해상도 | 결과 비율 | 결과 수 | 참조 한도 |\nNano Banana 2 | 3 ~ 45,000 | 512px, 1K, 2K, 4K | 12종 ① | 1, 2, 4장 | 이미지 14장 |\nNano Banana 2 Lite | 3 ~ 45,000 | 1K | 14종 ② | 1, 2, 4장 | 이미지 14장 + 영상 1개 |","s":"","u":"https://hub.xconda.ai/guide/xconda-image-generator-input-guide/","d":"2026-11-07","p":2},{"k":"guide","t":"[입력 조건 안내 ①] XCONDA Image Generator: 모델별 옵션과 참조 파일 규격","a":"Nano Banana Pro | 3 ~ 45,000 | 1K, 2K, 4K | 10종 ③ | 1, 2, 4장 | 이미지 14장 |\nKling Image O1 | 3 ~ 2,500 | 1K, 2K | 8종 ④ | 1, 2, 4장 | 이미지 10장 |\nZ Image | 2 ~ 10,000 | 1K | 10종 ③ | 1, 2, 4장 | 지원 안 함 |\nSeedream 5.0 Lite | 1자 이상 | 2K, 3K | 8종 ④ | 1, 2, 4장 | 이미지 14장 |\nSeedream 5.0 Pro | 1자 이상 | 1K, 2K | 8종 ④ | 1 ~ 9장 | 이미지 10장 |\nGrok Imagine Image | 1자 이상 | 1K | 9종 ⑤ | 1, 2, 4장 | 이미지 3장 |\nGrok Imagine Pro | 1자 이상 | 1K, 2K | 9종 ⑤ | 1, 2, 4장 | 이미지 1장 |\nGPT Image 2.5 (Flare / Sunburst) | 1 ~ 32,000 | 결과 비율에 따라 다름 (3절) | 7종 (3절) | 1, 2, 3, 4장 | 이미지 8장 |\n결과 비율 목록\n① 16:9, 9:16, 1:1, 3:2, 2:3, 4:3, 3:4, 5:4, 4:5, 21:9, 4:1, 1:4","s":"","u":"https://hub.xconda.ai/guide/xconda-image-generator-input-guide/","d":"2026-11-07","p":3},{"k":"guide","t":"[입력 조건 안내 ①] XCONDA Image Generator: 모델별 옵션과 참조 파일 규격","a":"② ①의 12종 + 8:1, 1:8\n③ 16:9, 9:16, 1:1, 3:2, 2:3, 4:3, 3:4, 5:4, 4:5, 21:9\n④ 16:9, 9:16, 1:1, 3:2, 2:3, 4:3, 3:4, 21:9\n⑤ 16:9, 9:16, 1:1, 3:2, 2:3, 4:3, 3:4, 2:1, 1:2\nZ Image는 참조를 쓰지 않는 대신 Negative prompt(넣고 싶지 않은 요소)를 선택해서 입력할 수 있습니다.\n2. 참조 파일 규격\nImage Generator에는 이미지와 영상만 넣을 수 있습니다. 오디오는 받지 않습니다.\n대상 | 받는 형식 | 용량 | 가로·세로 크기 | 파일 비율 | 길이 |\n참조 이미지 — GPT Image 2.5 | PNG, JPEG, WebP (움직이지 않는 이미지만) | 각 20MB 이하 | 제한 없음 | 제한 없음 | — |\n참조 이미지 — 그 밖의 모델 | JPEG, PNG, WebP, GIF, AVIF | 20MB 이하 | 제한 없음 | 제한 없음 | — |\n참조 영상 — Nano Banana 2 Lite | MP4, WEBM, MOV | 40MB 이하 | 제한 없음 | 제한 없음 | 제한 없음 |\n영상 참조는 Nano Banana 2 Lite에서만 쓰입니다. 다른 모델에서는 보관만 되고 생성에 포함되지 않습니다.","s":"","u":"https://hub.xconda.ai/guide/xconda-image-generator-input-guide/","d":"2026-11-07","p":4},{"k":"guide","t":"[입력 조건 안내 ①] XCONDA Image Generator: 모델별 옵션과 참조 파일 규격","a":"GPT Image 2.5는 GIF, AVIF, 움직이는 WebP, 영상을 받지 않습니다. 이 검사는 Generate를 누른 뒤에 이루어지며, 맞지 않으면 생성이 시작되지 않고 안내가 표시됩니다.\nImage Generator는 참조 이미지의 크기와 비율을 검사하지 않습니다. 다만 지나치게 작거나 길쭉한 이미지는 모델 공급사에서 거절되어 생성이 실패할 수 있습니다.\n3. GPT Image 2.5 전용 옵션\nFlare와 Sunburst 중 하나를 고르며, 입력 조건은 서로 같습니다. 결과 비율마다 고를 수 있는 크기가 정해져 있습니다.\n결과 비율 | 선택 가능한 크기 |\n1:1 | 1K (1024×1024), 2K (2048×2048) |\n3:2 | 1K (1536×1024) |\n2:3 | 1K (1024×1536) |\n4:3 | 1K (1536×1152) |\n3:4 | 1K (1152×1536) |\n16:9 | 2K (2048×1152), 4K (3840×2160) |\n9:16 | 2K (1152×2048), 4K (2160×3840) |\nQuality | Low, Medium, High, XHigh, Max 중 선택 |\nBackground | Auto, Transparent(투명), Opaque(불투명) 중 선택 |","s":"","u":"https://hub.xconda.ai/guide/xconda-image-generator-input-guide/","d":"2026-11-07","p":5},{"k":"guide","t":"[입력 조건 안내 ①] XCONDA Image Generator: 모델별 옵션과 참조 파일 규격","a":"다음 편 예고\n2편에서는 Video Generator의 생성 모드, 모델별 옵션, 함께 쓸 수 없는 입력 조합, 파일 규격을 정리합니다. 👉 [입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격\n문의: cubeberry@cuberry.kr\n전화: +82-70-8095-2302 (평일 10:00~17:00)","s":"","u":"https://hub.xconda.ai/guide/xconda-image-generator-input-guide/","d":"2026-11-07","p":6},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"Video Generator의 생성 모드, 모델별 기본 옵션과 입력 개수, 함께 쓸 수 없는 조합, Video edit·extend 조건, 모델별 파일 규격을 정리했습니다. 입력 조건 안내 시리즈 2편입니다.\n안녕하세요. XCONDA를 만드는 큐브베리 대표 이진서입니다.\n입력 조건 안내 시리즈 2편은 Video Generator입니다. 영상은 모델마다 모드, 길이, 넣을 수 있는 파일이 크게 달라서, 조건을 모르면 Generate 버튼이 막히거나 생성이 실패하기 쉽습니다. 영상을 만들기 전에 쓰려는 모델의 줄만 확인해 보세요.\n📚\n입력 조건 안내 시리즈 (v1.0)\n[입력 조건 안내 ①] XCONDA Image Generator: 모델별 옵션과 참조 파일 규격\nVideo Generator 편 (지금 보는 글)\n먼저, 두 도구에 공통인 조건\n항목 | 조건 |\n프롬프트 | 필수 입력입니다. 모델마다 최소·최대 글자 수가 다르며, 프롬프트에 넣은 @ 참조 표기도 글자 수에 포함됩니다 |\nInput Assets 보관 | Video Generator 최대 50개, Image Generator 최대 15개. 보관 개수와 실제로 생성에 쓰이는 참조 개수는 별개이며, 후자는 모델별 한도를 따릅니다 |","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":1},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"참조 한도 초과 | 모델 한도를 넘는 파일은 삭제되지 않고 \"사용 불가\" 상태로 남으며, 생성에 포함되지 않습니다 |\n@ 참조 지정 | 참조를 지원하는 모델에서는 프롬프트에 @를 입력해 특정 참조를 지칭할 수 있습니다. 지칭한 참조가 꺼져 있거나 삭제되면 생성할 수 없습니다 |\n업로드 중 | 파일 업로드가 끝나기 전에는 Generate 버튼이 눌리지 않습니다 |\nAsset Library | Asset Library에서 고른 파일에도 직접 올린 파일과 같은 규격이 적용됩니다 |\n기본 업로드 규격 (모델별 전용 규격이 없을 때 적용)\n파일 종류 | 받는 형식 | 용량 | 길이 |\n이미지 (프레임 · 참조) | JPEG, PNG, WebP, GIF, AVIF | 20MB 이하 | — |\n영상 (참조 · Source) | MP4, WEBM, MOV | 40MB 이하 | 모델별 (5절) |\n오디오 (참조) | MP3, WAV, OGG, AAC, FLAC, M4A | 20MB 이하 | 모델별 (5절) |\n전용 규격이 있는 모델은 Kling 4.0, Seedance 전 모델입니다. 나머지는 기본 규격만 적용됩니다.\n파일 비율은 넣는 파일의 가로÷세로 값입니다(16:9는 1.78, 1:1은 1, 9:16은 0.56). Options에서 고르는 결과 비율과는 별개입니다.","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":2},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"파일 형식은 확장자가 아니라 실제 파일 내용으로 판정합니다. 아이폰 사진(HEIC/HEIF)은 JPEG나 PNG로 바꿔 올리는 것이 안전합니다.\n1. 생성 모드\n모델에 따라 고를 수 있는 모드가 다릅니다. 모드가 하나뿐인 모델은 Ref-to-video만 표시됩니다.\n모드 (화면 표기) | 쓰임 | 선택 가능한 모델 |\nRef-to-video | 프롬프트만으로, 또는 프레임·참조 파일과 함께 생성 | 전 모델 |\nVideo edit | 기존 영상을 프롬프트대로 수정 | Kling 4.0, Seedance 2.5, Grok Imagine Video |\nVideo extend | 기존 영상의 뒤를 이어서 생성 | Seedance 2.5, Grok Imagine Video |\nFirst/last frame | 시작·끝 프레임 이미지로 생성 | Seedance 2.0, 2.0 Fast, 2.0 Mini, 2.5 |\n프롬프트만 넣으면 텍스트 기반 생성, 프레임이나 참조 파일이 있으면 이미지 기반 생성으로 자동 처리됩니다. 따로 고를 필요가 없습니다.\n2. 모델별 기본 옵션\n⚠️\n영상 길이에는 기본값이 없습니다. 길이를 직접 골라야 Generate 버튼이 활성화됩니다(길이가 자동으로 정해지는 경우는 4절).","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":3},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"모델 | 프롬프트 글자 수 | 해상도 | 결과 비율 | 길이 | 오디오 |\nKling 4.0 | 1 ~ 26,000 (영문 기준) | 720p, 1080p | 16:9, 9:16, 1:1, 21:9 | 3 ~ 30초 | 항상 포함 |\nVeo 3.1 / Veo 3.1 Fast | 2 ~ 3,000 | 720p, 1080p, 4K | 16:9, 9:16 | 7초, 8초 | 켜기/끄기 선택 |\nGemini Omni Flash | 2 ~ 2,500 | 720p | 16:9, 9:16 | 3 ~ 10초 | 항상 포함 |\nKling 3.0 Pro | 2 ~ 2,500 | 1080p | 16:9, 1:1, 9:16 | 3 ~ 15초 | 켜기/끄기 선택 |\nKling 3.0 4K | 2 ~ 2,500 | 4K | 16:9, 1:1, 9:16 | 3 ~ 15초 | 켜기/끄기 선택 |\nKling OMNI | 2 ~ 2,500 | 1080p | 16:9, 1:1, 9:16 | 3 ~ 15초 | 켜기/끄기 선택 |\nGrok Imagine Video | 1 ~ 2,500 | 480p, 720p | 16:9, 9:16, 1:1, 4:3, 3:4, 3:2, 2:3 | 1 ~ 15초 | 항상 포함 |","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":4},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"Grok Imagine Video 1.5 | 1 ~ 2,500 | 480p, 720p, 1080p | 16:9, 9:16, 1:1, 4:3, 3:4, 3:2, 2:3 | 1 ~ 15초 | 항상 포함 |\nVidu Q3 | 2 ~ 2,000 | 360p, 540p, 720p, 1080p | 16:9, 9:16, 1:1, 4:3, 3:4 | 1 ~ 16초 | 켜기/끄기 선택 (기본 꺼짐) |\nSeedance 2.0 | 1 ~ 15,000 | 480p, 720p, 1080p, 4K | 16:9, 9:16, 1:1, 4:3, 3:4, 21:9 | 4 ~ 15초 | 선택 항목 없음 |\nSeedance 2.0 Fast / Mini | 1 ~ 15,000 | 480p, 720p | 16:9, 9:16, 1:1, 4:3, 3:4, 21:9 | 4 ~ 15초 | 선택 항목 없음 |\nSeedance 2.5 | 1 ~ 30,000 | 480p, 720p, 1080p | 16:9, 9:16, 1:1, 4:3, 3:4, 21:9 | 4 ~ 30초 | 선택 항목 없음 |\n길이는 모두 1초 단위입니다.\nKling 4.0의 프롬프트 한도는 영문만 쓰면 26,000자, 한글 등 비영문만 쓰면 11,000자입니다. 섞어 쓰면 두 기준을 합산해 판정합니다.","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":5},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"결과 비율을 고를 수 없는 경우 — 결과가 넣은 파일의 비율을 그대로 따릅니다.\n경우 | 결과 비율 |\nSeedance 2.5 — First/last frame 모드에 프레임 이미지를 넣었을 때 | 시작 프레임 비율 |\nSeedance 2.5 — Video edit, Video extend | 원본 영상 비율 |\nKling 4.0 — 프레임 이미지만 넣고 다른 참조가 없을 때 | 프레임 비율 |\nSource 영상을 넣었을 때 (Veo, Gemini Omni Flash, Kling OMNI, Grok) | 원본 영상 비율 |\n3. 모델별로 넣을 수 있는 입력 (개수)\n모델 | 프레임 이미지 | 참조(Reference) 한도 | Source 영상 |\nKling 4.0 | Start, Mid, End 각 1장 | 이미지 10장(프레임 포함), 영상 5개(Source 포함), Voice 3개, 전체 15개 | Video edit 모드에서 1개 |\nVeo 3.1 / Veo 3.1 Fast | Start, End | 지원 안 함 | 1개 |\nGemini Omni Flash | Start | 이미지 7장 (Source 사용 시 5장) | 1개 |\nKling 3.0 Pro / 3.0 4K | Start, End | 지원 안 함 | 지원 안 함 |","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":6},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"Kling OMNI | Start, End | 이미지 7장 (Source 사용 시 4장) | 1개 |\nGrok Imagine Video | Start | 지원 안 함 | Video edit · Video extend 모드에서 1개 |\nGrok Imagine Video 1.5 | Start (필수) | 지원 안 함 | 지원 안 함 |\nVidu Q3 | Start, End | 지원 안 함 | 지원 안 함 |\nSeedance 2.0 / Fast / Mini | Start, End (First/last frame 모드) | 이미지 9장, 영상 3개, 오디오 3개, 전체 15개 | 해당 없음 |\nSeedance 2.5 | Start, End (First/last frame 모드) | 이미지 30장, 영상 10개, 오디오 10개, 전체 50개 | 해당 없음 (참조 영상으로 넣음) |\n프레임 자리에는 이미지만, Source 자리에는 영상만 넣을 수 있습니다.\n참조를 지원하지 않는 모델에 넣은 참조 파일은 보관만 되고 생성에 쓰이지 않습니다.\n🚫\n함께 쓸 수 없는 조합\nSource 영상과 프레임 이미지는 함께 쓸 수 없습니다 (Veo, Gemini Omni Flash, Kling OMNI, Grok).","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":7},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"Kling OMNI는 프레임 이미지와 참조 이미지를 함께 쓸 수 없습니다. 둘 중 하나만 사용합니다.\nGrok Imagine Video 1.5는 시작 프레임이 없으면 생성할 수 없습니다. 프롬프트만으로는 생성되지 않습니다.\nGemini Omni Flash는 이미지 기반 생성 시 Source 영상, 시작 프레임, 참조 이미지 중 하나 이상이 있어야 합니다.\nSeedance는 모드에 따라 쓰이는 입력이 갈립니다. First/last frame 모드에서는 참조가 쓰이지 않고, Ref-to-video 모드에서는 프레임이 쓰이지 않습니다.\nSeedance First/last frame 모드는 시작 프레임(Start)이 필수이고 끝 프레임(End)은 선택입니다.\nSeedance 2.0 / Fast / Mini는 오디오만 참조로 넣을 수 없습니다. 이미지나 영상 참조가 1개 이상 있어야 합니다. Seedance 2.5는 오디오만 넣어도 됩니다.\n4. Source 영상 · Video edit · Video extend 조건\nSource 영상을 넣으면, 결과가 원본을 따르는 항목은 화면에서 선택지가 사라집니다.\n모델 · 모드 | 넣는 영상 길이 | 결과 길이 | 사라지는 선택 항목 |\nVeo 3.1 / Fast + Source | 길이 제한 없음 | 7초 고정 | 해상도, 결과 비율, 길이, 오디오 |","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":8},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"Gemini Omni Flash + Source | 10초 이하 | 원본 길이 | 해상도, 결과 비율, 길이 |\nKling OMNI + Source | 3 ~ 15.5초 | 원본 길이 | 해상도, 결과 비율, 길이, 오디오, Shot Mode |\nGrok Imagine Video — Video edit | 8.7초 이하, 1개 | 원본 길이 | 해상도, 결과 비율, 길이 |\nGrok Imagine Video — Video extend | 2 ~ 15초, 1개 | 연장 길이 2 ~ 10초를 선택 | 해상도, 결과 비율 |\nKling 4.0 — Video edit | 3 ~ 30초, 1개 | 3 ~ 30초 중 선택 | 없음 |\nSeedance 2.5 — Video edit | 4 ~ 30초, 참조 영상 정확히 1개 | 원본 길이 | 결과 비율, 길이 |\nSeedance 2.5 — Video extend | 참조 영상 1개 이상 | 연장 길이 4 ~ 30초를 선택 | 결과 비율 |\nVideo extend에서 고르는 길이는 최종 영상 길이가 아니라 새로 이어 붙는 구간의 길이입니다. 예를 들어 10초 영상에 5초를 고르면 5초가 새로 생깁니다.\nSeedance 2.5 Video extend는 최종 영상을 \"연장 영상만\" 또는 \"원본과 연결\" 중에서 고릅니다.","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":9},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"Video edit · Video extend는 프롬프트 내용이 선택한 모드와 맞아야 합니다. 모드와 다른 지시(예: edit 모드에서 연장 요청)를 쓰면 생성이 취소되고 크레딧이 환불됩니다.\n5. 모델별 입력 파일 규격\n넣는 파일이 아래 규격을 벗어나면 추가되지 않거나 \"사용 불가\"로 표시되고 Generate가 막힙니다.\n이미지 (프레임 · 참조)\n모델 | 받는 형식 | 용량 | 가로·세로 크기 | 파일 비율 |\nKling 4.0 | JPG, PNG만 | 30MB 이하 | 가로·세로 각 300px 이상 | 0.4 ~ 2.5 |\nSeedance 2.0 / Fast / Mini / 2.5 | 기본 규격 | 20MB 이하 | 가로·세로 각 300 ~ 6,000px | 0.4 ~ 2.5 |\nVeo 3.1 / Fast, Gemini Omni Flash, Kling 3.0 Pro / 4K, Kling OMNI, Grok Imagine Video / 1.5, Vidu Q3 | 기본 규격 | 20MB 이하 | 제한 없음 | 제한 없음 |\n영상 (참조 · Source)\n모델 | 받는 형식 | 용량 | 가로·세로 크기 · 파일 비율 | 길이 | 프레임 속도 |\nKling 4.0 | MP4만 | 300MB 이하 | 가로·세로 각 700 ~ 4,553px · 전체 픽셀 수 8,294,400 이하 · 비율 0.4 ~ 2.5 | 개별 3 ~ 30초, Source 포함 합계 30초 이하 | 24 ~ 60fps |","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":10},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"Seedance 2.5 (참조 영상) | MP4, MOV만 | 40MB 이하 | 화면에서 검사하지 않음 (아래 공급사 기준 참고) | 개별 2 ~ 30초, 합계 30초 이하 | 화면에서 검사하지 않음 |\nSeedance 2.0 / Fast / Mini (참조 영상) | 기본 규격 | 40MB 이하 | 화면에서 검사하지 않음 (아래 공급사 기준 참고) | 개별 2 ~ 15초, 합계 15초 이하 | 화면에서 검사하지 않음 |\nKling OMNI (Source) | 기본 규격 | 40MB 이하 | 제한 없음 | 3 ~ 15.5초 | 제한 없음 |\nGemini Omni Flash (Source) | 기본 규격 | 40MB 이하 | 제한 없음 | 10초 이하 | 제한 없음 |\nGrok Imagine Video (Source) | 기본 규격 | 40MB 이하 | 제한 없음 | Video edit 8.7초 이하 · Video extend 2 ~ 15초 | 제한 없음 |\nVeo 3.1 / Fast (Source) | 기본 규격 | 40MB 이하 | 제한 없음 | 제한 없음 | 제한 없음 |\n영상의 길이와 가로·세로 크기를 읽을 수 없는 파일은 쓸 수 없습니다. 다시 올려야 합니다.\nKling 4.0의 전체 픽셀 수는 가로×세로 값입니다. 8,294,400은 3840×2160(4K)에 해당합니다.","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":11},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"오디오 (참조)\n모델 | 받는 형식 | 용량 | 길이 |\nSeedance 2.5 | MP3, WAV만 | 15MB 이하 | 개별 2 ~ 30초, 합계 30초 이하 |\nSeedance 2.0 / Fast / Mini | 기본 규격 | 20MB 이하 | 개별 2 ~ 15초, 합계 15초 이하 |\nKling 4.0 | 파일을 직접 올릴 수 없음 | — | — |\n그 밖의 모델 | 오디오 참조를 지원하지 않음 | — | — |\nKling 4.0은 기본 제공 음성을 고르거나 Asset Library에 등록해 둔 Voice만 쓸 수 있습니다.\nSeedance 공급사 기준 (화면에서 미리 막지 않는 조건)\n아래 조건은 화면에서는 통과하지만 Seedance 공급사가 받지 않습니다. 어기면 생성이 실패하고 크레딧이 환불됩니다.\n참조 영상 (전 모델): MP4, MOV · 전체 픽셀 수(가로×세로) 407,696 ~ 8,295,044\n참조 영상 (전 모델, 공급사 안내값): 가로·세로 각 300 ~ 6,000px · 파일 비율 0.4 ~ 2.5 · 24 ~ 60fps\n참조 오디오 (2.0 / Fast / Mini): MP3, WAV · 15MB 미만\n전체 픽셀 수 407,696은 대략 854×480보다 조금 작은 크기입니다. 이보다 작은 영상은 참조로 쓸 수 없습니다. Seedance 2.0 계열에 WEBM 영상이나 MP3·WAV가 아닌 오디오를 넣으면 공급사에서 거절될 수 있습니다.","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":12},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"6. Kling 4.0 — Element · Voice 등록 규격\nKling 4.0에서는 등록된 Element를 최대 7개까지, 그중 영상 Element는 3개까지 쓸 수 있습니다. 아래는 Asset Library에서 Kling용으로 등록할 때의 규격이며, 등록에는 크레딧이 들지 않습니다.\n등록 대상 | 받는 형식 | 용량 | 가로·세로 크기 · 파일 비율 | 길이 | 그 밖의 조건 |\n이미지 Element | JPG, PNG | 각 10MB 이하 | 가로·세로 각 300px 이상 · 비율 0.4 ~ 2.5 | — | 정면 이미지 1장 + 다른 각도 이미지 1 ~ 3장 |\n영상 Element | MP4 | 200MB 이하 | 1920×1080 또는 1080×1920 | 3 ~ 8초 | 실사 인물 영상 1개 |\nVoice | MP3, WAV | 20MB 이하 | — | 5 ~ 30초 | 한 사람의 목소리가 선명해야 함 |\n7. 그 밖의 모델별 옵션\n옵션 | 대상 모델 | 조건 |\nNegative prompt | Kling 3.0 Pro, Kling 3.0 4K | 선택 입력 · 2,500자 이하 |\nShot Mode | Kling 3.0 Pro, Kling 3.0 4K, Kling OMNI | Single Shot, Smart Multi-Shot, Custom Multi-Shot 중 선택. Source 영상과는 함께 쓸 수 없습니다 |","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":13},{"k":"guide","t":"[입력 조건 안내 ②] XCONDA Video Generator: 생성 모드·모델별 옵션·파일 규격","a":"Quality | Grok Imagine Video, Grok Imagine Video 1.5 | 켜면 고품질 출력 (기본 꺼짐) |\nHigh Quality | Seedance 전 모델 | 켜기/끄기 선택 |\nDraft | Seedance 2.5 | 켜면 해상도가 480p로 고정된 초안을 만듭니다. 초안이 완성되면 7일 이내에 같은 내용으로 1080p 최종본을 한 번 만들 수 있습니다 |\nCustom Multi-Shot 조건\n샷은 1 ~ 6개입니다.\n샷마다 프롬프트 2자 이상, 길이 3초 이상(1초 단위)이어야 합니다.\n전체 샷 길이의 합은 15초 이하이며, 이 합계가 곧 영상 길이가 됩니다.\n이미지 생성 조건은 1편에서 확인하세요. 👉 [입력 조건 안내 ①] XCONDA Image Generator: 모델별 옵션과 참조 파일 규격\n문의: cubeberry@cuberry.kr\n전화: +82-70-8095-2302 (평일 10:00~17:00)","s":"","u":"https://hub.xconda.ai/guide/xconda-video-generator-input-guide/","d":"2026-11-07","p":14}]</script>

  var EXAMPLES = ["엑스콘다 가격이 얼마예요?","무료로 써볼 수 있나요?","환불은 어떻게 받나요?","시댄스 1080p 10초는 몇 크레딧이에요?","만든 영상 상업적으로 써도 되나요?","문의는 어디로 하나요?"];

  var log = document.getElementById("log"), scroller = document.getElementById("scroller");
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function scrollDown(){ scroller.scrollTop = scroller.scrollHeight; }
  function scheduleScroll(){ (typeof requestAnimationFrame==="function"?requestAnimationFrame:setTimeout)(scrollDown,0); }

  function chipRow(list){
    var row = el("div","chips");
    list.forEach(function(q){ var b=el("button","chip",q); b.type="button"; b.onclick=function(){ ask(q); }; row.appendChild(b); });
    return row;
  }
  function userMsg(text, isExample){
    var m=el("div","msg user");
    if(isExample) m.appendChild(el("span","example-tag","예시 질문"));
    m.appendChild(el("div","bubble",text)); log.appendChild(m);
  }
  function botText(text){ var m=el("div","msg bot"); m.appendChild(el("div","bubble",text)); log.appendChild(m); return m; }

  function answerCard(d){
    var m=el("div","msg bot"), b=el("div","bubble");
    var head=el("div","card-head"); head.appendChild(el("span","chip-kind",KIND[d.k])); head.appendChild(el("span","card-title",d.t)); b.appendChild(head);
    var a=el("div","answer",d.a); b.appendChild(a);
    if(d.a.length>420){ a.classList.add("clamp"); var more=el("button","more","전체 보기 ▾"); more.type="button";
      more.onclick=function(){ var c=a.classList.toggle("clamp"); more.textContent=c?"전체 보기 ▾":"접기 ▴"; }; b.appendChild(more); }
    if(/종료/.test(d.t)) b.appendChild(el("div","notice","이 글은 이미 끝난 행사 안내예요. 지금 진행 중인 행사는 공지사항을 확인하세요."));
    var meta=el("div","meta");
    if(d.s) meta.appendChild(el("span",null,"출처: "+d.s));
    var line=el("span"); line.appendChild(document.createTextNode((d.d?"수정일 "+d.d+" · ":""))); var link=el("a",null,"허브에서 원문 보기 ↗"); link.href=d.u; link.target="_blank"; link.rel="noopener"; line.appendChild(link); meta.appendChild(line);
    b.appendChild(meta); m.appendChild(b); log.appendChild(m);
  }

  function aiAnswerCard(aiData, fallbackDoc){
    var m=el("div","msg bot"), b=el("div","bubble");
    var head=el("div","card-head");
    head.appendChild(el("span","chip-kind","AI 요약"));
    head.appendChild(el("span","card-title",fallbackDoc ? fallbackDoc.t : "허브 문서 기반 답변"));
    b.appendChild(head);
    b.appendChild(el("div","answer",aiData.answer));
    if(fallbackDoc && /종료/.test(fallbackDoc.t)){
      b.appendChild(el("div","notice","참고 문서에 이미 끝난 행사 안내가 포함되어 있어요. 최신 행사는 공지사항을 확인하세요."));
    }
    var sources = Array.isArray(aiData.sources) && aiData.sources.length ? aiData.sources : (fallbackDoc ? [{title:fallbackDoc.t,url:fallbackDoc.u,kind:fallbackDoc.k}] : []);
    if(sources.length){
      var meta=el("div","meta");
      meta.appendChild(el("span",null,"근거 원문:"));
      var list=el("div","source-list");
      sources.slice(0,3).forEach(function(src){
        var a=el("a","source-link",(KIND[src.kind]||"원문")+" · "+src.title+" ↗");
        a.href=src.url; a.target="_blank"; a.rel="noopener";
        list.appendChild(a);
      });
      meta.appendChild(list);
      b.appendChild(meta);
    }
    m.appendChild(b); log.appendChild(m);
  }

  function appendRelated(picked){
    var rel=picked.slice(1,4).filter(function(p){return p.s>=MAYBE;}).map(function(p){return p.d.t;});
    if(rel.length){
      var w=el("div","msg bot"), box=el("div","related");
      box.appendChild(el("p",null,"이런 질문도 있어요"));
      box.appendChild(chipRow(rel));
      w.appendChild(box); log.appendChild(w);
    }
  }

  function ask(q, isExample){
    q=(q||"").trim(); if(!q) return;
    userMsg(q, isExample);
    var r = search(IX, q);
    var picked=[], urls={};
    r.forEach(function(x){ var d=KB[x.i]; if(urls[d.u]) return; urls[d.u]=1; picked.push({d:d,s:x.s}); });
    var topChunks = r.slice(0, 4).map(function(x){ return KB[x.i]; });

    // 첫 화면 자동 예시 질문은 API 쿼터를 아끼기 위해 즉시 내장 BM25 카드로 표시
    if(!isExample && API_URL && picked.length && picked[0].s >= MAYBE){
      var pending = el("div","msg bot"), pb = el("div","bubble pending","허브 글을 바탕으로 답변을 정리하고 있어요…");
      pending.appendChild(pb); log.appendChild(pending);
      scheduleScroll();
      askBotApi(API_URL, q, topChunks, "ko").then(function(aiData){
        if(pending.parentNode) pending.parentNode.removeChild(pending);
        if(aiData && aiData.answer){
          aiAnswerCard(aiData, picked[0].d);
          appendRelated(picked);
        } else if(picked[0].s >= GOOD){
          answerCard(picked[0].d);
          appendRelated(picked);
        } else {
          renderNotFound(picked);
        }
        scheduleScroll();
      });
      return;
    }

    if(picked.length && picked[0].s>=GOOD){
      answerCard(picked[0].d);
      appendRelated(picked);
    } else {
      renderNotFound(picked);
    }
    scheduleScroll();
  }

  function renderNotFound(picked){
    var cand=picked.slice(0,3).filter(function(p){return p.s>=MAYBE;}).map(function(p){return p.d.t;});
    var m=botText("허브 글에서 딱 맞는 답을 찾지 못했어요. 단어를 바꿔서 다시 물어보시거나, 고객센터로 문의해 주세요.\n이메일 cubeberry@cuberry.kr · 전화 +82-70-8095-2302 (평일 10:00~17:00)");
    if(cand.length){ var box=el("div","related"); box.appendChild(el("p",null,"혹시 이 질문인가요?")); box.appendChild(chipRow(cand)); m.appendChild(box); }
  }

  var exBox=document.getElementById("examples"), exRow=chipRow(EXAMPLES);
  while(exRow.firstChild) exBox.appendChild(exRow.firstChild);
  document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); var i=document.getElementById("q"); ask(i.value); i.value=""; i.focus(); });

  botText("안녕하세요! 엑스콘다(XCONDA)에 대해 궁금한 걸 물어보세요. 가격, 크레딧, 환불, Flex Board·Turn·블로킹 보드 사용법 같은 질문에 허브 글을 찾아서 답해 드려요.");
  ask(EXAMPLES[0], true);
})();
</script>
</body>
</html>
